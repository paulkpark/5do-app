/* ─── DeepFieldSession ─────────────────────────────── */
function DeepFieldSession({ onExit }) {
  const lang = useContext(LangCtx);
  const canvasRef = useRef(null);
  const engineRef = useRef(null);
  const audioARef = useRef(null);
  const audioBRef = useRef(null);
  const [trackIdx, setTrackIdx] = useState(0);
  const [progress, setProgress] = useState(0);
  const [phase, setPhase] = useState('loading'); // loading | running | complete | error
  const sidecarsRef = useRef({});
  const ctrlRef = useRef(null);

  // Mount engine + audio
  useEffect(() => {
    if (!canvasRef.current) return;
    const engine = new DeepFieldEngine(canvasRef.current);
    engineRef.current = engine;
    engine.start();

    // Preload sidecars (best-effort, non-blocking)
    const ac = new AbortController();
    ctrlRef.current = ac;
    DF_TRACKS.forEach((basename, i) => {
      const url = `${DF_MEDIA_BASE}/${basename}.fft.json`;
      fetch(url, { signal: ac.signal })
        .then(r => r.ok ? r.json() : null)
        .then(j => { if (j) sidecarsRef.current[i] = j; })
        .catch(() => {});
    });

    // Sequencer: state held in closure-bound refs
    let cancelled = false;
    let currentIdx = 0;
    let usingA = true;
    let switchTimer = null;
    let progressTimer = null;
    const sessionStartMs = performance.now();
    const totalSec = DF_TRACKS.length * DF_TRACK_SEC;

    const audioA = audioARef.current;
    const audioB = audioBRef.current;
    audioA.crossOrigin = 'anonymous'; audioB.crossOrigin = 'anonymous';

    const cleanup = () => {
      cancelled = true;
      if (switchTimer) clearTimeout(switchTimer);
      if (progressTimer) clearInterval(progressTimer);
      audioA.pause(); audioB.pause();
      audioA.removeAttribute('src'); audioB.removeAttribute('src');
    };

    const playTrack = (i, useA) => {
      const el = useA ? audioA : audioB;
      const other = useA ? audioB : audioA;
      el.src = `${DF_MEDIA_BASE}/${DF_TRACKS[i]}.mp3`;
      el.currentTime = 0;
      el.volume = 0;
      const playPromise = el.play();
      if (playPromise && playPromise.catch) playPromise.catch(() => {});
      // Fade in
      if (DF_IS_IOS) {
        el.volume = 1; // iOS volume is read-only — hard cut
      } else {
        const t0 = performance.now();
        const fadeIn = () => {
          if (cancelled) return;
          const k = Math.min(1, (performance.now() - t0) / (DF_FADE_SEC * 1000));
          el.volume = k;
          if (k < 1) requestAnimationFrame(fadeIn);
        };
        fadeIn();
        // Fade out the other
        const t1 = performance.now();
        const initial = other.volume;
        const fadeOut = () => {
          if (cancelled) return;
          const k = Math.min(1, (performance.now() - t1) / (DF_FADE_SEC * 1000));
          other.volume = initial * (1 - k);
          if (k < 1) requestAnimationFrame(fadeOut);
          else { other.pause(); }
        };
        if (initial > 0) fadeOut();
      }
    };

    const scheduleNext = () => {
      const i = currentIdx;
      const dur = DF_TRACK_SEC * 1000;
      switchTimer = setTimeout(() => {
        if (cancelled) return;
        const nextIdx = i + 1;
        if (nextIdx >= DF_TRACKS.length) {
          // Fade out final + complete
          if (!DF_IS_IOS) {
            const t0 = performance.now();
            const el = usingA ? audioA : audioB;
            const initial = el.volume;
            const fade = () => {
              if (cancelled) return;
              const k = Math.min(1, (performance.now() - t0) / (DF_FADE_SEC * 1000));
              el.volume = initial * (1 - k);
              if (k < 1) requestAnimationFrame(fade);
              else el.pause();
            };
            fade();
          } else { audioA.pause(); audioB.pause(); }
          setPhase('complete');
          return;
        }
        currentIdx = nextIdx;
        usingA = !usingA;
        playTrack(nextIdx, usingA);
        setTrackIdx(nextIdx);
        // Scene transition?
        const oldScene = DF_SCENE_FOR_TRACK[i];
        const newScene = DF_SCENE_FOR_TRACK[nextIdx];
        if (oldScene !== newScene && engineRef.current) {
          engineRef.current.goToScene(newScene);
        }
        scheduleNext();
      }, dur);
    };

    // Audio reactivity loop (sample sidecar, feed engine)
    const reactivityTick = () => {
      if (cancelled) return;
      const el = usingA ? audioA : audioB;
      const sidecar = sidecarsRef.current[currentIdx];
      if (sidecar) {
        const spectrum = dfSampleFFT(sidecar, el.currentTime);
        const bands = dfBands(spectrum);
        if (engineRef.current) engineRef.current.setAmbient(bands.bass, bands.mid, bands.treble);
      }
      requestAnimationFrame(reactivityTick);
    };

    // Begin
    playTrack(0, true);
    setPhase('running');
    setTrackIdx(0);
    scheduleNext();
    reactivityTick();

    progressTimer = setInterval(() => {
      if (cancelled) return;
      const elapsed = (performance.now() - sessionStartMs) / 1000;
      setProgress(Math.min(1, elapsed / totalSec));
    }, 250);

    return () => {
      cleanup();
      ac.abort();
      if (engineRef.current) {
        engineRef.current.destroy();
        engineRef.current = null;
      }
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Restart handler
  const restart = () => {
    setPhase('loading');
    setTrackIdx(0); setProgress(0);
    setTimeout(() => window.location.reload(), 0); // simplest clean state
  };

  const sceneIdx = DF_SCENE_FOR_TRACK[trackIdx] ?? 0;
  const gateKey = `df.gate.${sceneIdx+1}.name`;
  const trackKey = `df.track.${trackIdx+1}`;

  return (
    <div className="df-app">
      <canvas ref={canvasRef} className="df-canvas"></canvas>
      <div className="df-vignette"></div>
      <audio ref={audioARef} preload="auto" playsInline></audio>
      <audio ref={audioBRef} preload="auto" playsInline></audio>

      <button className="df-back" onClick={onExit} aria-label="back">&#8592;</button>

      {phase !== 'loading' && (
        <>
          <div className="df-hud df-card">
            <div className="df-card-label">{t(lang, 'df.session.label')}</div>
            <div className="df-card-title">{t(lang, gateKey)}</div>
            <div className="df-card-track">
              <span>{t(lang, 'df.session.track')} {String(trackIdx+1).padStart(2,'0')}</span>
              <span className="name">{t(lang, trackKey)}</span>
            </div>
          </div>
          <div className="df-hud df-counter">
            {t(lang, 'df.session.gate')} <b>{sceneIdx+1}</b> / 3 &nbsp;·&nbsp; {t(lang, 'df.session.track')} <b>{trackIdx+1}</b> / {DF_TRACKS.length}
          </div>
          <div className="df-hud df-progress"><div style={{ width: `${progress*100}%` }}></div></div>
        </>
      )}

      {phase === 'running' && (
        <div className="df-guide" key={`guide-${trackIdx}`}>
          {t(lang, `df.guide.${trackIdx+1}`)}
        </div>
      )}

      {phase === 'loading' && (
        <div className="df-loading">
          <div className="df-loading-text">{t(lang, 'df.session.loading')}</div>
        </div>
      )}
      {phase === 'complete' && (
        <div className="df-complete">
          <h2>{t(lang, 'df.session.complete')}</h2>
          <p>{t(lang, 'df.session.completeSub')}</p>
          <div className="df-complete-btns">
            <button onClick={onExit}>{t(lang, 'df.session.exit')}</button>
            <button className="primary" onClick={restart}>{t(lang, 'df.session.restart')}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState('ko');
  const [page, setPage] = useState('cts');
  const [stage, setStage] = useState('splash'); // splash | library | intro | main | breathIntro | breathMain

  // Parent postMessage listener
  useEffect(() => {
    function onMsg(e) {
      if (e.data?.type === 'setLang') setLang(e.data.lang);
    }
    window.addEventListener('message', onMsg);
    // Pull current lang from parent (avoids race where parent sends setLang on
    // iframe load event before this listener has attached)
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'requestLang' }, '*'); } catch(_){}
    }
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const pages = { cts: CTSGuide, starmap: StarMap, timer: MeditationTimer, log: SessionLog, tones: CE5Tones };
  const PageComponent = pages[page];

  if (stage === 'splash') {
    return (
      <LangCtx.Provider value={lang}>
        <SplashScreen onComplete={() => setStage('library')} />
      </LangCtx.Provider>
    );
  }
  if (stage === 'library') {
    return (
      <LangCtx.Provider value={lang}>
        <div className="ce5-app">
          <LibraryPage onSelect={(id) => {
            if (id === 'ce5') setStage('intro');
            else if (id === 'breath') setStage('breathIntro');
            else if (id === 'body') setStage('bodyIntro');
            else if (id === 'chakra') setStage('chakraIntro');
            else if (id === 'deepfield') setStage('deepfieldIntro');
          }} />
        </div>
      </LangCtx.Provider>
    );
  }
  if (stage === 'intro') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><IntroPage onEnter={() => setStage('main')} onBack={() => setStage('library')} /></div></LangCtx.Provider>);
  }
  if (stage === 'breathIntro') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><BreathIntroPage onEnter={() => setStage('breathMain')} onBack={() => setStage('library')} /></div></LangCtx.Provider>);
  }
  if (stage === 'breathMain') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><nav className="sub-nav"><button onClick={() => setStage('library')} style={{paddingLeft:10,paddingRight:10}}>&#8592;</button><button className="active">{t(lang, 'breath.title')}</button></nav><DeepBreathGuide /></div></LangCtx.Provider>);
  }
  if (stage === 'bodyIntro') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><BodyScanIntro onEnter={() => setStage('bodyMain')} onBack={() => setStage('library')} /></div></LangCtx.Provider>);
  }
  if (stage === 'bodyMain') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><nav className="sub-nav"><button onClick={() => setStage('library')} style={{paddingLeft:10,paddingRight:10}}>&#8592;</button><button className="active">{t(lang, 'body.title')}</button></nav><BodyScanGuide /></div></LangCtx.Provider>);
  }
  if (stage === 'chakraIntro') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><ChakraIntro onEnter={() => setStage('chakraMain')} onBack={() => setStage('library')} /></div></LangCtx.Provider>);
  }
  if (stage === 'chakraMain') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><nav className="sub-nav"><button onClick={() => setStage('library')} style={{paddingLeft:10,paddingRight:10}}>&#8592;</button><button className="active">{t(lang, 'chakra.title')}</button></nav><ChakraGuide /></div></LangCtx.Provider>);
  }
  if (stage === 'deepfieldIntro') {
    return (<LangCtx.Provider value={lang}><div className="ce5-app"><DeepFieldIntro onEnter={() => setStage('deepfieldMain')} onBack={() => setStage('library')} /></div></LangCtx.Provider>);
  }
  if (stage === 'deepfieldMain') {
    return (<LangCtx.Provider value={lang}><DeepFieldSession onExit={() => setStage('library')} /></LangCtx.Provider>);
  }

  return (
    <LangCtx.Provider value={lang}>
      <div className="ce5-app">
        <nav className="sub-nav">
          <button onClick={() => setStage('library')} title={lang === 'ko' ? '명상 라이브러리' : 'Library'} style={{paddingLeft:10,paddingRight:10}}>&#8592;</button>
          {['cts','starmap','timer','log','tones'].map(k => (
            <button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>
              {t(lang, `nav.${k}`)}
            </button>
          ))}
        </nav>
        <PageComponent />
      </div>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
