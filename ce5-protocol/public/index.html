<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CE5 Protocol — 5DO</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="star-catalog.js"></script>
<style>
:root {
  --bg: #0A0A0F; --bg-elevated: #141420; --bg-card: #1A1A2E;
  --surface: #252540; --border: #2A2A45;
  --primary: #7C5CFC; --primary-light: #9B7FFF; --primary-dark: #5A3AD9;
  --secondary: #3ECFCF; --accent: #FF6B9D;
  --text-primary: #F0F0FF; --text-secondary: #A0A0C0; --text-tertiary: #6B6B8D;
  --glass: rgba(26,26,46,0.7); --glass-border: rgba(124,92,252,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text-primary); font-family:-apple-system,'SF Pro Text',sans-serif; overflow-x:hidden; }
.ce5-app { max-width:520px; margin:0 auto; min-height:100vh; position:relative; }

/* Sub-nav */
.sub-nav { display:flex; gap:4px; padding:8px 12px; background:var(--bg-elevated); position:sticky; top:0; z-index:10; overflow-x:auto; }
.sub-nav::-webkit-scrollbar { display:none; }
.sub-nav button { flex-shrink:0; padding:7px 14px; border:none; border-radius:20px; background:transparent; color:var(--text-secondary); font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; white-space:nowrap; }
.sub-nav button.active { background:var(--primary); color:#fff; }

/* Cards */
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:20px; margin:12px 16px; }
.card h3 { font-size:17px; font-weight:700; margin-bottom:8px; }
.card p { font-size:14px; color:var(--text-secondary); line-height:1.6; }

/* Buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 24px; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
.btn-primary:active { transform:scale(0.96); }
.btn-secondary { background:var(--surface); color:var(--text-primary); border:1px solid var(--border); }
.btn-sm { padding:8px 16px; font-size:13px; border-radius:8px; }
.btn-round { width:64px; height:64px; border-radius:50%; font-size:24px; padding:0; }

/* CTS */
.cts-stage { display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px 16px; min-height:calc(100vh - 120px); justify-content:center; }
.cts-visual { width:280px; height:280px; border-radius:50%; margin:24px 0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.cts-visual canvas { width:100%; height:100%; }
.cts-instruction { font-size:16px; line-height:1.7; color:var(--text-secondary); max-width:340px; margin:16px auto; }
.cts-step-label { font-size:12px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.cts-title { font-size:22px; font-weight:700; margin-bottom:4px; }
.cts-controls { display:flex; gap:12px; margin-top:24px; }
.mute-btn { position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(8px); color:var(--text-secondary); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; transition:all .2s; }
.mute-btn.muted { color:var(--accent); border-color:var(--accent); }
.narration-bar { display:flex; align-items:center; gap:8px; margin-top:12px; padding:8px 16px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; font-size:12px; color:var(--text-tertiary); }
.narration-bar .bar-fill { flex:1; height:3px; background:var(--surface); border-radius:2px; overflow:hidden; }
.narration-bar .bar-fill span { display:block; height:100%; background:var(--primary); border-radius:2px; transition:width .3s; }

/* Star Map */
.starmap-wrap { position:relative; width:100%; height:calc(100vh - 120px); background:#000; touch-action:none; }
.starmap-wrap canvas { width:100%; height:100%; }
.starmap-info { position:absolute; bottom:16px; left:16px; right:16px; background:var(--glass); backdrop-filter:blur(12px); border-radius:12px; padding:12px 16px; font-size:12px; color:var(--text-secondary); display:flex; justify-content:space-between; }

/* Timer */
.timer-display { font-size:64px; font-weight:200; font-variant-numeric:tabular-nums; margin:32px 0; }
.timer-ring { position:relative; width:240px; height:240px; margin:0 auto; }
.timer-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.timer-ring .time-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.timer-presets { display:flex; gap:8px; justify-content:center; margin:16px 0; flex-wrap:wrap; }
.timer-freq { display:flex; gap:8px; justify-content:center; margin:16px 0; flex-wrap:wrap; }

/* Session Log */
.session-form { display:flex; flex-direction:column; gap:12px; }
.session-form label { font-size:13px; color:var(--text-secondary); margin-bottom:2px; }
.session-form input, .session-form select, .session-form textarea {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 14px; color:var(--text-primary); font-size:14px; width:100%;
  font-family:inherit;
}
.session-form textarea { min-height:80px; resize:vertical; }
.session-item { border-bottom:1px solid var(--border); padding:12px 0; }
.session-item:last-child { border-bottom:none; }

/* Tones */
.tone-card { display:flex; align-items:center; gap:14px; padding:14px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin:8px 16px; }
.tone-card.playing { border-color:var(--primary); box-shadow:0 0 20px rgba(124,92,252,0.2); }
.tone-info { flex:1; }
.tone-info h4 { font-size:15px; font-weight:600; }
.tone-info p { font-size:12px; color:var(--text-tertiary); margin-top:2px; }
.tone-hz { font-size:20px; font-weight:700; color:var(--secondary); min-width:70px; }
.tone-btn { width:40px; height:40px; border-radius:50%; border:none; background:var(--primary); color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.tone-btn.stop { background:var(--accent); }

/* Fade animations */
.fade-in { animation: fadeIn .4s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
.gps-status { font-size:12px; color:var(--secondary); display:flex; align-items:center; gap:4px; margin-top:8px; }
.gps-dot { width:6px; height:6px; border-radius:50%; background:var(--secondary); animation:pulse 2s infinite; }

/* ── Splash Screen ── */
@keyframes splashLogoIn { 0%{opacity:0;transform:scale(0.3) rotate(-180deg)} 60%{opacity:1;transform:scale(1.1) rotate(10deg)} 100%{opacity:1;transform:scale(1) rotate(0deg)} }
@keyframes splashTextIn { 0%{opacity:0;transform:translateY(20px);letter-spacing:0px} 100%{opacity:1;transform:translateY(0);letter-spacing:6px} }
@keyframes splashSubIn { 0%,40%{opacity:0;transform:translateY(10px)} 100%{opacity:1;transform:translateY(0)} }
@keyframes splashGlowPulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:0.8;transform:scale(1.1)} }
@keyframes splashRing { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
@keyframes splashFadeOut { 0%{opacity:1} 100%{opacity:0;visibility:hidden} }
@keyframes starTwinkle { 0%,100%{opacity:0.2} 50%{opacity:1} }

.splash-screen { position:fixed; inset:0; background:radial-gradient(ellipse at center, #1a1040 0%, #050310 60%, #000000 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; overflow:hidden; }
.splash-screen.fade-out { animation: splashFadeOut 0.8s ease forwards; }
.splash-stars { position:absolute; inset:0; pointer-events:none; }
.splash-stars div { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation: starTwinkle 3s infinite; }
.splash-glow { position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(124,92,252,0.4) 0%, rgba(62,207,207,0.15) 30%, transparent 70%); animation: splashGlowPulse 4s ease-in-out infinite; filter:blur(20px); }
.splash-rings { position:relative; width:280px; height:280px; }
.splash-ring { position:absolute; inset:0; border:1px solid rgba(124,92,252,0.4); border-radius:50%; animation: splashRing 20s linear infinite; }
.splash-ring:nth-child(2) { inset:20px; border-color:rgba(62,207,207,0.4); animation-direction:reverse; animation-duration:15s; }
.splash-ring:nth-child(3) { inset:40px; border-color:rgba(255,107,157,0.3); animation-duration:25s; }
@keyframes breathPulse { 0%,100% { transform:scale(1); opacity:0.4 } 50% { transform:scale(1.06); opacity:0.7 } }
.splash-rings .breath-ring { animation: breathPulse 5s ease-in-out infinite, splashRing 30s linear infinite; }
.splash-rings .breath-ring2 { animation: breathPulse 5s ease-in-out infinite 0.4s, splashRing 25s linear infinite reverse; }
.splash-rings .breath-ring3 { animation: breathPulse 5s ease-in-out infinite 0.8s, splashRing 35s linear infinite; }
.splash-logo { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.splash-logo svg { width:180px; height:180px; animation: splashLogoIn 1.6s cubic-bezier(0.16,1,0.3,1) forwards; }
@keyframes lotusBreath { 0%,100% { transform:scale(1) } 50% { transform:scale(1.04) } }
.splash-logo .lotus-outer { transform-origin:100px 100px; animation: lotusBreath 6s ease-in-out infinite; }
.splash-logo .lotus-inner { transform-origin:100px 100px; animation: lotusBreath 6s ease-in-out infinite 1s; }
.splash-title { font-size:48px; font-weight:200; color:#fff; margin-top:48px; text-transform:uppercase; opacity:0; animation: splashTextIn 1.5s ease 0.6s forwards; font-family:-apple-system, 'Helvetica Neue', sans-serif; }
.splash-subtitle { font-size:13px; color:rgba(180,160,255,0.8); margin-top:12px; letter-spacing:3px; text-transform:uppercase; opacity:0; animation: splashSubIn 1.2s ease 1.2s forwards; max-width:340px; text-align:center; line-height:1.6; }
.splash-credit { position:absolute; bottom:32px; font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:2px; opacity:0; animation: splashSubIn 1.2s ease 1.8s forwards; }

/* ── Library Page ── */
.library-page { padding:32px 20px 100px; max-width:560px; margin:0 auto; animation: fadeIn 0.6s ease; }
.library-page h1 { font-size:30px; font-weight:300; text-align:center; margin-bottom:8px; background:linear-gradient(135deg,#9B7FFF,#3ECFCF); -webkit-background-clip:text; background-clip:text; color:transparent; }
.library-page .lib-tag { font-size:12px; letter-spacing:2px; color:var(--text-tertiary); text-align:center; margin-bottom:32px; }
.med-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:14px; cursor:pointer; transition:all 0.25s ease; position:relative; overflow:hidden; }
.med-card:hover { border-color:var(--primary); transform:translateY(-2px); box-shadow:0 8px 28px rgba(124,92,252,0.2); }
.med-card.disabled { cursor:default; opacity:0.55; }
.med-card.disabled:hover { transform:none; border-color:var(--border); box-shadow:none; }
.med-card .med-icon { width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--secondary)); display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:14px; }
.med-card .med-name { font-size:17px; font-weight:700; margin-bottom:6px; color:var(--text-primary); display:flex; align-items:center; gap:8px; }
.med-card .med-desc { font-size:13px; line-height:1.6; color:var(--text-secondary); margin-bottom:12px; }
.med-card .med-meta { display:flex; gap:10px; font-size:11px; color:var(--text-tertiary); }
.med-card .med-meta span { background:var(--surface); padding:4px 10px; border-radius:8px; }
.med-card .coming-badge { position:absolute; top:14px; right:14px; background:var(--accent-warm); color:#000; padding:3px 10px; border-radius:8px; font-size:10px; font-weight:700; letter-spacing:0.5px; }

/* ── Intro Page ── */
.intro-page { padding:24px 20px 100px; max-width:560px; margin:0 auto; animation: fadeIn 0.6s ease; }
.intro-page .intro-back { display:inline-flex; align-items:center; gap:6px; color:var(--text-tertiary); font-size:13px; margin-bottom:16px; cursor:pointer; background:none; border:none; padding:6px 0; }
.intro-page .intro-back:hover { color:var(--primary-light); }
.intro-page h1 { font-size:32px; font-weight:300; text-align:center; margin-bottom:8px; background:linear-gradient(135deg,#9B7FFF,#3ECFCF); -webkit-background-clip:text; background-clip:text; color:transparent; }
.intro-page .intro-tag { font-size:11px; letter-spacing:3px; color:var(--text-tertiary); text-transform:uppercase; text-align:center; margin-bottom:32px; }
.intro-section { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:14px; }
.intro-section h2 { font-size:15px; font-weight:600; color:var(--secondary); margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.intro-section h2 .num { background:var(--primary); color:#fff; width:26px; height:26px; min-width:26px; flex-shrink:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
.intro-section p { font-size:14px; line-height:1.7; color:var(--text-secondary); padding-left:36px; }
.intro-section p + p { margin-top:10px; }
.intro-enter-btn { display:block; width:100%; padding:18px; margin-top:24px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.3s; box-shadow:0 8px 24px rgba(124,92,252,0.3); letter-spacing:1px; }
.intro-enter-btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(124,92,252,0.4); }
.intro-enter-btn:active { transform:translateY(0); }

/* ── Deep Breath Guide ── */
.breath-guide { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 120px); padding:24px 16px; text-align:center; position:relative; }
.breath-circle-wrap { position:relative; width:220px; height:220px; margin:24px 0; }
.breath-circle { position:absolute; inset:0; border-radius:50%; border:2px solid var(--primary); transition:transform 0.3s ease; }
.breath-circle-inner { position:absolute; inset:20px; border-radius:50%; background:radial-gradient(circle, rgba(124,92,252,0.25), rgba(62,207,207,0.1), transparent); transition:transform 0.3s ease; }
.breath-circle.inhale, .breath-circle-inner.inhale { animation:breathIn 6s ease-in-out forwards; }
.breath-circle.hold,   .breath-circle-inner.hold   { transform:scale(1.3); }
.breath-circle.exhale, .breath-circle-inner.exhale  { animation:breathOut 10s ease-in-out forwards; }
@keyframes breathIn { 0%{transform:scale(0.7)} 100%{transform:scale(1.3)} }
@keyframes breathOut { 0%{transform:scale(1.3)} 100%{transform:scale(0.7)} }
.breath-phase { font-size:20px; font-weight:300; color:var(--text-primary); margin-bottom:4px; }
.breath-count { font-size:48px; font-weight:200; color:var(--primary-light); font-variant-numeric:tabular-nums; }
.breath-round { font-size:12px; color:var(--text-tertiary); margin-top:8px; }
.breath-timer { font-size:13px; color:var(--text-tertiary); margin-top:4px; }
.breath-settings { display:flex; gap:8px; justify-content:center; margin-top:20px; flex-wrap:wrap; }

/* ─── DEEP FIELD ─────────────────────────────────────────────────── */
.df-app { position:fixed; inset:0; background:#000; overflow:hidden; z-index:50; }
.df-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
.df-canvas:active { cursor:grabbing; }
.df-vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%); }
.df-hud { position:absolute; pointer-events:none; z-index:10; color:#cfe8f2; font-family:"Helvetica Neue",-apple-system,sans-serif; }
.df-hud * { pointer-events:auto; }
.df-back { position:absolute; top:14px; right:14px; width:38px; height:38px; border:1px solid rgba(87,217,255,0.25); border-radius:8px; background:rgba(6,12,20,0.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#57d9ff; font-family:ui-monospace,"SF Mono",monospace; font-size:18px; cursor:pointer; display:grid; place-items:center; transition:0.2s; z-index:11; }
.df-back:hover { background:rgba(87,217,255,0.15); box-shadow:0 0 14px rgba(87,217,255,0.3); }
.df-card { top:18px; left:18px; width:min(380px, calc(100vw - 36px)); background:rgba(6,12,20,0.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(87,217,255,0.18); border-radius:12px; box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 18px 60px rgba(0,0,0,0.6); padding:14px 16px; transition:opacity 0.4s; }
.df-card-label { font-family:ui-monospace,"SF Mono",monospace; font-size:10px; letter-spacing:0.34em; color:#57d9ff; text-transform:uppercase; opacity:0.85; }
.df-card-title { font-size:17px; letter-spacing:0.12em; margin-top:8px; font-weight:300; color:#eaf6fb; transition:opacity 0.3s; }
.df-card-track { display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(87,217,255,0.12); font-family:ui-monospace,"SF Mono",monospace; font-size:11px; letter-spacing:0.22em; color:#57d9ff; text-transform:uppercase; }
.df-card-track .name { color:#b9d4df; letter-spacing:0.1em; text-transform:none; font-family:"Helvetica Neue",sans-serif; font-size:13px; }
.df-counter { position:absolute; bottom:18px; left:18px; padding:8px 14px; background:rgba(6,12,20,0.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(87,217,255,0.18); border-radius:10px; font-family:ui-monospace,"SF Mono",monospace; font-size:11px; letter-spacing:0.28em; color:#6f93a3; }
.df-counter b { color:#57d9ff; font-weight:600; }
.df-progress { position:absolute; bottom:22px; right:18px; width:min(220px, 40vw); height:3px; background:rgba(87,217,255,0.12); border-radius:2px; overflow:hidden; }
.df-progress > div { height:100%; background:linear-gradient(90deg,#57d9ff,#7C5CFC); transition:width 0.3s linear; width:0%; }
.df-loading, .df-complete { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:rgba(0,0,0,0.65); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); z-index:20; color:#eaf6fb; text-align:center; padding:20px; }
.df-loading-text { font-family:ui-monospace,"SF Mono",monospace; font-size:13px; letter-spacing:0.3em; color:#57d9ff; text-transform:uppercase; }
.df-complete h2 { font-size:24px; font-weight:300; letter-spacing:0.1em; color:#eaf6fb; }
.df-complete p { color:#6f93a3; font-size:14px; }
.df-complete-btns { display:flex; gap:12px; margin-top:12px; }
.df-complete-btns button { padding:12px 22px; border:1px solid rgba(87,217,255,0.4); border-radius:10px; background:rgba(87,217,255,0.08); color:#57d9ff; font-family:ui-monospace,"SF Mono",monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; transition:0.2s; }
.df-complete-btns button:hover { background:rgba(87,217,255,0.18); box-shadow:0 0 16px rgba(87,217,255,0.3); }
.df-complete-btns .primary { background:linear-gradient(135deg,#57d9ff,#7C5CFC); color:#fff; border-color:transparent; }
.df-complete-btns .primary:hover { box-shadow:0 0 22px rgba(87,217,255,0.5); }
.df-guide { position:absolute; left:50%; top:75%; transform:translate(-50%,-50%); max-width:520px; width:calc(100vw - 56px); text-align:center; font-size:18px; line-height:1.75; color:#eaf6fb; letter-spacing:0.04em; pointer-events:none; z-index:12; text-shadow:0 2px 28px rgba(0,0,0,0.75), 0 0 18px rgba(87,217,255,0.18); white-space:pre-line; opacity:0; animation:dfGuideShow 10s cubic-bezier(.22,.61,.36,1) forwards; font-weight:300; }
@keyframes dfGuideShow {
  0%   { opacity:0; transform:translate(-50%,-44%); }
  15%  { opacity:1; transform:translate(-50%,-50%); }
  85%  { opacity:1; transform:translate(-50%,-50%); }
  100% { opacity:0; transform:translate(-50%,-56%); }
}
@media (max-width:520px) { .df-guide { font-size:16px; line-height:1.7; } }
.df-card-warn { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px; background:rgba(87,217,255,0.10); color:#57d9ff; font-size:11px; font-weight:600; letter-spacing:0.4px; margin-bottom:10px; border:1px solid rgba(87,217,255,0.22); }
.df-card-warn svg { flex-shrink:0; }
.df-intro-warn { display:flex; align-items:center; justify-content:center; gap:10px; padding:13px 18px; border-radius:12px; background:rgba(87,217,255,0.08); border:1px solid rgba(87,217,255,0.22); color:#57d9ff; font-size:13px; font-weight:500; letter-spacing:0.3px; margin:-16px 0 28px; }
.df-intro-warn svg { flex-shrink:0; }
@media (max-width:520px) {

const LangCtx = createContext('ko');
function t(lang, key) { return (T[lang] && T[lang][key]) || (T['en'] && T['en'][key]) || key; }

/* ── GPS hook ── */
function useGPS() {
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!navigator.geolocation) return;
    const id = navigator.geolocation.watchPosition(
      p => setPos({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => {},
      { enableHighAccuracy: true, timeout: 10000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  }, []);
  return pos;
}

/* ── Audio Context ── */
const audioCtxRef = { current: null };
function getAudioCtx() {
  if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
  return audioCtxRef.current;
}
function playBell() {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = 852;
  g.gain.setValueAtTime(0.3, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 2);
}

/* ════════════════════════════════════════
   CTS — Coherent Thought Sequencing
   ════════════════════════════════════════ */
function CTSGuide() {
  const lang = useContext(LangCtx);
  const gps = useGPS();
  const [step, setStep] = useState(-1); // -1 = intro
  const [started, setStarted] = useState(false);
  const [muted, setMuted] = useState(false);
  const [narrationProgress, setNarrationProgress] = useState(0);
  const [narrationPlaying, setNarrationPlaying] = useState(false);
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const audioRef = useRef(null);
  const mutedRef = useRef(muted);

  const colors = ['#3ECFCF','#7C5CFC','#E8E8FF','#FFD700','#4A90D9','#4ADE80','#FF6B9D'];

  useEffect(() => {
    if (step < 0) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = 560; canvas.height = 560;
    let frame = 0;

    function draw() {
      const cx = 280, cy = 280;
      ctx.clearRect(0, 0, 560, 560);

      // Background glow
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 280);
      grad.addColorStop(0, colors[step] + '30');
      grad.addColorStop(0.5, colors[step] + '10');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 560, 560);

      frame++;
      const t = frame / 60;

      if (step === 0) {
        // Breathing circle
        const breathPhase = (Math.sin(t * Math.PI / 4) + 1) / 2;
        const r = 60 + breathPhase * 80;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = colors[0]; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = colors[0] + '20'; ctx.fill();
      } else if (step === 1) {
        // Expanding consciousness rings
        for (let i = 0; i < 5; i++) {
          const r = ((t * 30 + i * 50) % 250);
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = colors[1] + Math.round((1 - r/250) * 80).toString(16).padStart(2,'0');
          ctx.lineWidth = 1.5; ctx.stroke();
        }
      } else if (step === 2) {
        // Galaxy spiral
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.1);
        for (let arm = 0; arm < 4; arm++) {
          for (let i = 0; i < 200; i++) {
            const angle = (i / 200) * Math.PI * 3 + (arm * Math.PI / 2);
            const r = (i / 200) * 230;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r * 0.5;
            const size = Math.random() * 1.5 + 0.5;
            ctx.fillStyle = `rgba(255,255,${200+Math.random()*55},${0.3+Math.random()*0.5})`;
            ctx.fillRect(x, y, size, size);
          }
        }
        ctx.restore();
      } else if (step === 3) {
        // Solar system
        ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI*2); ctx.fill();
        const planets = [40,60,85,120,160,200,230];
        const pColors = ['#aaa','#fa8','#4A90D9','#c44','#da6','#fb8','#8cf'];
        planets.forEach((r, i) => {
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
          ctx.strokeStyle = '#ffffff10'; ctx.lineWidth = 0.5; ctx.stroke();
          const a = t * (0.5 - i*0.05) + i * 1.2;
          const px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
          ctx.beginPath(); ctx.arc(px, py, i===2?5:3, 0, Math.PI*2);
          ctx.fillStyle = pColors[i]; ctx.fill();
          if (i === 2) { ctx.strokeStyle='#4ADE80'; ctx.lineWidth=1.5; ctx.stroke(); }
        });
      } else if (step === 4) {
        // Earth
        const pulse = Math.sin(t) * 10;
        ctx.beginPath(); ctx.arc(cx, cy, 100+pulse, 0, Math.PI*2);
        const eg = ctx.createRadialGradient(cx-30,cy-30,20,cx,cy,120);
        eg.addColorStop(0,'#2B6CB0'); eg.addColorStop(0.4,'#276749');
        eg.addColorStop(0.7,'#2B6CB0'); eg.addColorStop(1,'#1A365D');
        ctx.fillStyle = eg; ctx.fill();
        // City lights
        for (let i = 0; i < 30; i++) {
          const a = i*0.21+Math.sin(i)*2, r2 = 50+Math.random()*40;
          const lx = cx+Math.cos(a)*r2, ly = cy+Math.sin(a)*r2;
          ctx.fillStyle = `rgba(255,200,100,${0.3+Math.random()*0.5})`;
          ctx.fillRect(lx,ly,2,2);
        }
      } else if (step === 5) {
        // Your location pin
        const bounce = Math.abs(Math.sin(t*2)) * 10;
        ctx.fillStyle = '#4ADE8040';
        ctx.beginPath(); ctx.arc(cx, cy+20, 80, 0, Math.PI*2); ctx.fill();
        // Pin
        ctx.fillStyle = '#4ADE80';
        ctx.beginPath(); ctx.moveTo(cx, cy+30-bounce); ctx.lineTo(cx-12,cy-10-bounce);
        ctx.arc(cx,cy-22-bounce,12,Math.PI*0.8,Math.PI*0.2); ctx.closePath(); ctx.fill();
        // Coordinates
        if (gps) {
          ctx.fillStyle = '#4ADE80'; ctx.font = '13px SF Mono, monospace'; ctx.textAlign = 'center';
          ctx.fillText(`${gps.lat.toFixed(4)}°N  ${gps.lon.toFixed(4)}°E`, cx, cy+140);
        }
      } else if (step === 6) {
        // Contact — radiating love
        for (let i = 0; i < 7; i++) {
          const r = ((t*40 + i*35) % 250);
          const alpha = (1 - r/250);
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(255,107,157,${alpha*0.6})`; ctx.lineWidth = 2; ctx.stroke();
        }
        // Heart
        ctx.save(); ctx.translate(cx, cy); const hs = 1 + Math.sin(t*3)*0.1;
        ctx.scale(hs, hs); ctx.fillStyle = '#FF6B9D';
        ctx.beginPath(); ctx.moveTo(0,8);
        ctx.bezierCurveTo(-20,-10,-35,-30,0,-15);
        ctx.bezierCurveTo(35,-30,20,-10,0,8);
        ctx.fill(); ctx.restore();
      }

      animRef.current = requestAnimationFrame(draw);
    }
    draw();
    return () => { if (animRef.current) cancelAnimationFrame(animRef.current); };
  }, [step, gps]);

  // Narration playback
  useEffect(() => {
    // 이전 오디오 정리
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
    setNarrationPlaying(false); setNarrationProgress(0);

    if (step < 0 || !started) return;

    const audio = new Audio(`audio/cts${step+1}_${lang}.mp3`);
    audioRef.current = audio;
    audio.volume = mutedRef.current ? 0 : 1;

    audio.onplay = () => setNarrationPlaying(true);
    audio.onended = () => { setNarrationPlaying(false); setNarrationProgress(100); };
    audio.ontimeupdate = () => {
      if (audio.duration) setNarrationProgress((audio.currentTime / audio.duration) * 100);
    };

    audio.play().catch(() => {});
    return () => { audio.pause(); audioRef.current = null; };
  }, [step, lang, started]);

  // Mute/unmute — volume 방식 (muted 속성은 일부 브라우저에서 불안정)
  useEffect(() => {
    mutedRef.current = muted;
    if (audioRef.current) audioRef.current.volume = muted ? 0 : 1;
  }, [muted]);

  function goStep(next) {
    if (audioRef.current) { audioRef.current.pause(); }
    playBell();
    setNarrationProgress(0);
    if (next >= 0) setStarted(true);
    else setStarted(false);
    setStep(next);
  }

  if (step < 0) {
    return (
      <div className="cts-stage fade-in">
        <div style={{fontSize:'48px',marginBottom:'16px'}}>&#x1F30C;</div>
        <h2>{t(lang,'cts.title')}</h2>
        <p style={{color:'var(--text-secondary)',marginTop:'4px'}}>{t(lang,'cts.subtitle')}</p>
        <p className="cts-instruction" style={{marginTop:'20px'}}>
          {lang==='ko'
            ? '7단계 의식 연결 시퀀싱을 통해\n우주와의 평화로운 접촉을 시도합니다.'
            : 'Through 7 steps of consciousness sequencing,\nattempt peaceful contact with the cosmos.'}
        </p>
        {gps && <div className="gps-status"><span className="gps-dot"></span>{gps.lat.toFixed(2)}°N, {gps.lon.toFixed(2)}°E</div>}
        <div className="cts-controls">
          <button className="btn btn-primary" onClick={() => goStep(0)}>{t(lang,'cts.start')}</button>
        </div>
      </div>
    );
  }

  return (
    <div className="cts-stage fade-in" key={step} style={{position:'relative'}}>
      <button className={`mute-btn ${muted?'muted':''}`} onClick={() => setMuted(!muted)}
        title={muted ? 'Unmute' : 'Mute'}>
        {muted
          ? <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          : <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>}
      </button>
      <div className="cts-step-label">{t(lang,'cts.step')} {step+1} {t(lang,'cts.of')} 7</div>
      <h2 className="cts-title">{t(lang,`cts.s${step+1}.title`)}</h2>
      <div className="cts-visual">
        <canvas ref={canvasRef}></canvas>
      </div>
      <p className="cts-instruction" style={{whiteSpace:'pre-line'}}>{t(lang,`cts.s${step+1}.desc`)}</p>
      {narrationPlaying && (
        <div className="narration-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" strokeWidth="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <div className="bar-fill"><span style={{width:`${narrationProgress}%`}}></span></div>
        </div>
      )}
      <div className="cts-controls">
        {step > 0 && <button className="btn btn-secondary btn-sm" onClick={() => goStep(step-1)}>{t(lang,'cts.prev')}</button>}
        {step < 6
          ? <button className="btn btn-primary" onClick={() => goStep(step+1)}>{t(lang,'cts.next')}</button>
          : <button className="btn btn-primary" onClick={() => goStep(-1)}>{t(lang,'cts.finish')}</button>}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   Star Map
   ════════════════════════════════════════ */
function StarMap() {
  const lang = useContext(LangCtx);
  const gps = useGPS();
  const canvasRef = useRef(null);
  const [selectedStar, setSelectedStar] = useState(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio || 1);
    canvas.height = rect.height * (window.devicePixelRatio || 1);
    const ctx = canvas.getContext('2d');
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
    const W = rect.width, H = rect.height;

    const lat = gps ? gps.lat : 37.5;
    const lon = gps ? gps.lon : 127.0;

    // Sidereal time
    const now = new Date();
    const JD = 2440587.5 + now.getTime()/86400000;
    const T0 = (JD - 2451545.0) / 36525;
    const GMST = 280.46061837 + 360.98564736629*(JD-2451545.0) + 0.000387933*T0*T0;
    const LST = ((GMST + lon) % 360 + 360) % 360;

    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

    // Project stars (stereographic)
    const projected = [];
    if (typeof STARS !== 'undefined') {
      STARS.forEach(s => {
        const ra = s.ra * 15; // hours → degrees
        const dec = s.dec;
        const ha = ((LST - ra) % 360 + 360) % 360;
        const haRad = ha * Math.PI/180;
        const decRad = dec * Math.PI/180;
        const latRad = lat * Math.PI/180;

        const sinAlt = Math.sin(decRad)*Math.sin(latRad) + Math.cos(decRad)*Math.cos(latRad)*Math.cos(haRad);
        const alt = Math.asin(sinAlt);
        if (alt < 0) return; // below horizon

        const cosAz = (Math.sin(decRad) - Math.sin(latRad)*sinAlt) / (Math.cos(latRad)*Math.cos(alt));
        let az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
        if (Math.sin(haRad) > 0) az = 2*Math.PI - az;

        const r = (Math.PI/2 - alt) / (Math.PI/2) * Math.min(W,H) * 0.45;
        const x = W/2 + r * Math.sin(az);
        const y = H/2 - r * Math.cos(az);

        const size = Math.max(1, 4 - s.mag);
        const alpha = Math.min(1, Math.max(0.3, (3 - s.mag) / 4));

        ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(240,240,255,${alpha})`; ctx.fill();

        if (s.mag < 1.5) {
          ctx.fillStyle = `rgba(160,160,192,0.6)`;
          ctx.font = '10px -apple-system, sans-serif';
          ctx.fillText(s.name, x + size + 3, y + 3);
        }
        projected.push({ ...s, x, y, size });
      });
    }

    // Cardinal directions
    ctx.fillStyle = 'var(--text-tertiary)';
    ctx.font = '12px SF Mono, monospace'; ctx.textAlign = 'center';
    const dirs = lang === 'ko' ? ['북','동','남','서'] : ['N','E','S','W'];
    ctx.fillText(dirs[0], W/2, 20);
    ctx.fillText(dirs[1], W-16, H/2);
    ctx.fillText(dirs[2], W/2, H-10);
    ctx.fillText(dirs[3], 16, H/2);

    // Horizon circle
    ctx.beginPath(); ctx.arc(W/2, H/2, Math.min(W,H)*0.45, 0, Math.PI*2);
    ctx.strokeStyle = '#2A2A45'; ctx.lineWidth = 1; ctx.stroke();

  }, [gps, lang]);

  return (
    <div className="starmap-wrap">
      <canvas ref={canvasRef}></canvas>
      <div className="starmap-info">
        <span>{gps ? `${gps.lat.toFixed(2)}°N ${gps.lon.toFixed(2)}°E` : t(lang,'starmap.nogps')}</span>
        <span>{new Date().toLocaleTimeString()}</span>
      </div>
    </div>
  );
}

function MeditationTimer() {
  const lang = useContext(LangCtx);
  const [duration, setDuration] = useState(30);
  const [remaining, setRemaining] = useState(30 * 60);
  const [running, setRunning] = useState(false);
  const [intervalBell, setIntervalBell] = useState(10);
  const [bgFreq, setBgFreq] = useState(null);
  const oscRef = useRef(null);
  const gainRef = useRef(null);
  const timerRef = useRef(null);
  const bellCountRef = useRef(0);

  useEffect(() => {
    if (!running) return;
    timerRef.current = setInterval(() => {
      setRemaining(prev => {
        if (prev <= 1) {
          setRunning(false); clearInterval(timerRef.current);
          playBell(); stopBgFreq();
          return 0;
        }
        const next = prev - 1;
        const elapsed = duration * 60 - next;
        if (intervalBell > 0 && elapsed > 0 && elapsed % (intervalBell * 60) === 0) {
          playBell();
        }
        return next;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [running, duration, intervalBell]);

  function startBgFreq(hz) {
    stopBgFreq();
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = hz;
    g.gain.value = 0.08;
    osc.connect(g); g.connect(ctx.destination);
    osc.start();
    oscRef.current = osc; gainRef.current = g;
  }
  function stopBgFreq() {
    if (oscRef.current) { try { oscRef.current.stop(); } catch(_){} oscRef.current = null; }
  }

  function handleStart() {
    if (running) { setRunning(false); stopBgFreq(); return; }
    setRemaining(duration * 60);
    setRunning(true);
    playBell();
    if (bgFreq) startBgFreq(bgFreq);
  }

  function handleReset() {
    setRunning(false); stopBgFreq();
    setRemaining(duration * 60);
  }

  function selectDuration(m) { setDuration(m); setRemaining(m*60); setRunning(false); stopBgFreq(); }

  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const progress = running || remaining < duration*60 ? 1 - remaining / (duration * 60) : 0;
  const circumference = 2 * Math.PI * 108;

  return (
    <div className="cts-stage fade-in">
      <h2>{t(lang,'timer.title')}</h2>
      <div className="timer-presets" style={{marginTop:'16px'}}>
        {[15,30,45,60].map(m => (
          <button key={m} className={`btn btn-sm ${duration===m?'btn-primary':'btn-secondary'}`}
            onClick={()=>selectDuration(m)}>{m}{t(lang,'timer.min')}</button>
        ))}
      </div>

      <div className="timer-ring" style={{marginTop:'24px'}}>
        <svg viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="108" fill="none" stroke="var(--border)" strokeWidth="4"/>
          <circle cx="120" cy="120" r="108" fill="none" stroke="var(--primary)" strokeWidth="4"
            strokeDasharray={circumference}
            strokeDashoffset={circumference * (1 - progress)}
            strokeLinecap="round"/>
        </svg>
        <div className="time-text">
          <span style={{fontSize:'48px',fontWeight:200,fontVariantNumeric:'tabular-nums'}}>
            {String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}
          </span>
          {remaining === 0 && <span style={{color:'var(--secondary)',fontSize:'14px',marginTop:'4px'}}>{t(lang,'timer.complete')}</span>}
        </div>
      </div>

      <div style={{display:'flex',gap:'12px',marginTop:'24px'}}>
        <button className={`btn ${running?'btn-secondary':'btn-primary'}`} onClick={handleStart}>
          {running ? t(lang,'timer.pause') : t(lang,'timer.start')}
        </button>
        <button className="btn btn-secondary" onClick={handleReset}>{t(lang,'timer.reset')}</button>
      </div>

      <div style={{marginTop:'24px',width:'100%',maxWidth:'340px'}}>
        <label style={{fontSize:'13px',color:'var(--text-secondary)'}}>{t(lang,'timer.interval')}</label>
        <div className="timer-presets" style={{marginTop:'6px'}}>
          {[0,5,10,15].map(m => (
            <button key={m} className={`btn btn-sm ${intervalBell===m?'btn-primary':'btn-secondary'}`}
              onClick={()=>setIntervalBell(m)}>{m===0?(lang==='ko'?'없음':'Off'):`${m}${t(lang,'timer.min')}`}</button>
          ))}
        </div>
      </div>

      <div style={{marginTop:'16px',width:'100%',maxWidth:'340px'}}>
        <label style={{fontSize:'13px',color:'var(--text-secondary)'}}>{t(lang,'timer.freq')}</label>
        <div className="timer-freq" style={{marginTop:'6px'}}>
          {[{hz:null,label:'Off'},{hz:136.1,label:'OM'},{hz:432,label:'432'},{hz:528,label:'528'},{hz:639,label:'639'}].map(f => (
            <button key={f.label} className={`btn btn-sm ${bgFreq===f.hz?'btn-primary':'btn-secondary'}`}
              onClick={() => { setBgFreq(f.hz); if(running){stopBgFreq();if(f.hz)startBgFreq(f.hz);} }}>
              {f.label}{f.hz?'Hz':''}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function CE5Tones() {
  const lang = useContext(LangCtx);
  const [playing, setPlaying] = useState({});
  const oscsRef = useRef({});

  function toggle(tone) {
    const key = tone.hz;
    if (oscsRef.current[key]) {
      try { oscsRef.current[key].osc.stop(); } catch(_){}
      delete oscsRef.current[key];
      setPlaying(prev => { const n = {...prev}; delete n[key]; return n; });
    } else {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = tone.type || 'sine';
      osc.frequency.value = tone.hz;
      g.gain.value = tone.hz < 20 ? 0.5 : 0.12; // Schumann needs binaural approach
      osc.connect(g); g.connect(ctx.destination);
      osc.start();
      oscsRef.current[key] = { osc, gain: g };
      setPlaying(prev => ({ ...prev, [key]: true }));
    }
  }

  // Cleanup on unmount
  useEffect(() => {
    return () => {
      Object.values(oscsRef.current).forEach(o => { try { o.osc.stop(); } catch(_){} });
      oscsRef.current = {};
    };
  }, []);

  return (
    <div className="fade-in" style={{padding:'8px 0 80px'}}>
      <div style={{padding:'16px',marginBottom:'4px'}}>
        <h2>{t(lang,'tones.title')}</h2>

        </p>
      </div>
      {CE5_TONES.map(tone => (
        <div key={tone.hz} className={`tone-card ${playing[tone.hz]?'playing':''}`}>
          <span className="tone-hz">{tone.hz < 10 ? tone.hz.toFixed(2) : tone.hz}</span>
          <div className="tone-info">
            <h4>{tone.name}</h4>
            <p>{lang === 'ko' ? tone.desc_ko : tone.desc_en}</p>
          </div>
          <button className={`tone-btn ${playing[tone.hz]?'stop':''}`} onClick={() => toggle(tone)}>
            {playing[tone.hz] ? '\u25A0' : '\u25B6'}
          </button>
        </div>
      ))}
    </div>
  );
}

function DeepBreathGuide() {
  const lang = useContext(LangCtx);
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState('ready');
  const [count, setCount] = useState(0);
  const [round, setRound] = useState(0);
  const [totalRounds, setTotalRounds] = useState(8);
  const [elapsed, setElapsed] = useState(0);
  const [muted, setMuted] = useState(false);
  const timerRef = useRef(null);
  const mutedRef = useRef(false);

  // Preload all breath audio
  const breathFiles = ['breath_intro','breath_inhale','breath_hold','breath_exhale','breath_complete'];
  const { cache: breathCache, ready: breathReady, loaded: breathLoaded, total: breathTotal } = usePreloadedAudio(breathFiles, lang);

  // Preload count audio (1-8)
  const countFiles = [1,2,3,4,5,6,7,8].map(n=>'count'+n);
  const { cache: countCache, ready: countReady, loaded: countLoaded, total: countTotal } = usePreloadedAudio(countFiles, lang);

  // Combined ready state
  const audioReady = breathReady && countReady;
  const audioProgress = ((breathLoaded + countLoaded) / (breathTotal + countTotal)) * 100;

  // Timeline per cycle (28 seconds):
  // 0: cue "숨을 들이마시고", 1: pause, 2-5: count 1-4, 6: pause
  // 7: cue "숨을 참고", 8: pause, 9-15: count 1-7, 16: pause
  // 17: cue "숨을 천천히 내쉬세요", 18: pause, 19-26: count 1-8, 27: pause
  const CYCLE_LEN = 28;

  function getAction(cyclePos) {
    if (cyclePos === 0)  return { phase:'inhale', type:'cue' };
    if (cyclePos === 1)  return { phase:'inhale', type:'pause' };
    if (cyclePos >= 2 && cyclePos <= 5) return { phase:'inhale', type:'count', n: cyclePos - 1 };
    if (cyclePos === 6)  return { phase:'inhale', type:'pause' };
    if (cyclePos === 7)  return { phase:'hold', type:'cue' };
    if (cyclePos === 8)  return { phase:'hold', type:'pause' };
    if (cyclePos >= 9 && cyclePos <= 15) return { phase:'hold', type:'count', n: cyclePos - 8 };
    if (cyclePos === 16) return { phase:'hold', type:'pause' };
    if (cyclePos === 17) return { phase:'exhale', type:'cue' };
    if (cyclePos === 18) return { phase:'exhale', type:'pause' };
    if (cyclePos >= 19 && cyclePos <= 26) return { phase:'exhale', type:'count', n: cyclePos - 18 };
    return { phase:'exhale', type:'pause' };
  }

  const currentNarration = useRef(null);
  const currentCount = useRef(null);

  // Stop ALL currently playing voices (cue + count)
  function stopAllVoices() {
    if (currentNarration.current) {
      try { currentNarration.current.pause(); currentNarration.current.currentTime = 0; } catch(_){}
      currentNarration.current = null;
    }
    if (currentCount.current) {
      try { currentCount.current.pause(); currentCount.current.currentTime = 0; } catch(_){}
      currentCount.current = null;
    }
  }

  function playNarration(name) {
    if (mutedRef.current) return;
    stopAllVoices();
    const a = breathCache.current[name];
    if (!a) return;
    a.currentTime = 0; a.volume = 1.0; a.play().catch(()=>{});
    currentNarration.current = a;
  }

  function getBreathDuration(name, fallback = 10) {
    const a = breathCache.current[name];
    return (a && a.duration && isFinite(a.duration)) ? a.duration : fallback;
  }

  function playCount(n) {
    if (mutedRef.current || n < 1 || n > 8) return;
    const a = countCache.current['count'+n];
    if (!a) {
      console.warn('[Breath] count audio missing:', n);
      return;
    }
    // Stop ANY previously playing voice (cue or previous count) — prevents overlap
    stopAllVoices();
    try {
      a.currentTime = 0;
      a.volume = 0.85; // consistent, slightly lower than cue
      const p = a.play();
      if (p && p.catch) p.catch(e => console.warn('[Breath] count', n, 'play failed:', e.message));
    } catch (e) { console.warn('[Breath] count', n, 'error:', e.message); }
    currentCount.current = a;
  }

  useEffect(() => { mutedRef.current = muted; }, [muted]);

  useEffect(() => {
    if (!running) { if (timerRef.current) clearInterval(timerRef.current); return; }
    let sec = 0;
    timerRef.current = setInterval(() => {
      const currentRound = Math.floor(sec / CYCLE_LEN);
      const cyclePos = sec % CYCLE_LEN;

      if (currentRound >= totalRounds) {
        setPhase('complete');
        setCount(0);
        setRound(totalRounds);
        setRunning(false);
        playNarration('breath_complete');
        playBell();
        return;
      }

      const action = getAction(cyclePos);
      setPhase(action.phase);
      setRound(currentRound + 1);
      setElapsed(sec);

      if (action.type === 'count') {
        setCount(action.n);
        playCount(action.n);
      } else if (action.type === 'cue') {
        setCount(0);
        playNarration('breath_' + action.phase);
        if (cyclePos === 0 && currentRound > 0) playBell();
      }
      // pause: do nothing (silence)

      sec++;
    }, 1000);

    playBell();
    return () => { if (timerRef.current) clearInterval(timerRef.current); };
  }, [running, totalRounds, lang]);

  function startBreathing() {
    playNarration('breath_intro');
    // Wait for intro to fully finish + 2s pause
    const introLen = getBreathDuration('breath_intro', 11);
    const delay = Math.ceil((introLen + 2) * 1000);
    setTimeout(() => {
      setRunning(true);
      setPhase('inhale');
      setCount(0);
      setRound(1);
      setElapsed(0);
      // Note: breath_inhale cue is played by the interval at cyclePos=0
      // (removing the explicit playNarration here prevents double-play on round 1)
    }, delay);
    setPhase('inhale');
  }

  function stopBreathing() {
    // Stop any playing audio from cache
    Object.values(breathCache.current).forEach(a => { try{a.pause();a.currentTime=0;}catch(_){} });
    Object.values(countCache.current).forEach(a => { try{a.pause();a.currentTime=0;}catch(_){} });
    setRunning(false);
    setPhase('ready');
    setCount(0);
    setRound(0);
    setElapsed(0);
  }

  const phaseText = {
    ready: t(lang, 'breath.ready'),
    inhale: t(lang, 'breath.inhale'),
    hold: t(lang, 'breath.hold'),
    exhale: t(lang, 'breath.exhale'),
    complete: t(lang, 'breath.complete'),
  };

  const phaseColor = { ready: 'var(--text-tertiary)', inhale: '#4ADE80', hold: '#FBBF24', exhale: '#7C5CFC', complete: '#3ECFCF' };
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;

  return (
    <div className="breath-guide fade-in" style={{position:'relative'}}>
      <button className={`mute-btn ${muted?'muted':''}`} onClick={() => setMuted(!muted)}
        title={muted ? 'Unmute' : 'Mute'}>
        {muted
          ? <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          : <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>}
      </button>
      <div className="cts-step-label" style={{color:phaseColor[phase]}}>{phaseText[phase]}</div>

      <div className="breath-circle-wrap">
        <div className={`breath-circle ${phase}`} style={{borderColor:phaseColor[phase]}}></div>
        <div className={`breath-circle-inner ${phase}`}></div>
        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>
          {running && phase !== 'complete' && <div className="breath-count" style={{color:phaseColor[phase]}}>{count}</div>}
          {phase === 'complete' && <div style={{fontSize:'36px'}}>&#x2728;</div>}
          {phase === 'ready' && <div style={{fontSize:'36px',opacity:0.4}}>&#x1F343;</div>}
        </div>
      </div>

      {running && phase !== 'complete' && (
        <div className="breath-round">{t(lang, 'breath.round')} {round} / {totalRounds}</div>
      )}
      {(running || elapsed > 0) && (
        <div className="breath-timer">{String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}</div>
      )}

      {!running && phase === 'ready' && (
        <div>
          <div className="breath-settings">
            <span style={{fontSize:'12px',color:'var(--text-tertiary)',lineHeight:'32px'}}>{t(lang, 'breath.rounds')}:</span>
            {[4,6,8,12].map(r => (
              <button key={r} className={`btn btn-sm ${totalRounds===r?'btn-primary':'btn-secondary'}`}
                onClick={() => setTotalRounds(r)}>{r}</button>
            ))}
          </div>
          <div className="cts-controls" style={{marginTop:'20px'}}>
            <button className="btn btn-primary" onClick={startBreathing} disabled={!audioReady}
              style={{ opacity: audioReady ? 1 : 0.5, cursor: audioReady ? 'pointer' : 'default' }}>
              {audioReady
                ? t(lang, 'breath.start')
                : (lang === 'ko' ? `보이스 로딩 중… ${Math.round(audioProgress)}%` : `Loading voice… ${Math.round(audioProgress)}%`)}
            </button>
          </div>
        </div>
      )}

      {running && (
        <div className="cts-controls" style={{marginTop:'16px'}}>
          <button className="btn btn-secondary btn-sm" onClick={stopBreathing}>{t(lang, 'breath.stop')}</button>
        </div>
      )}

      {phase === 'complete' && (
        <div className="cts-controls" style={{marginTop:'16px'}}>
          <button className="btn btn-primary" onClick={stopBreathing}>{lang === 'ko' ? '다시 시작' : 'Restart'}</button>
        </div>
      )}
    </div>
  );
}

// Preload audio helper — avoids new Audio() per playback
function usePreloadedAudio(files, lang) {
  const cache = useRef({});
  const [ready, setReady] = useState(false);
  const [loaded, setLoaded] = useState(0);
  const total = files.length;

  useEffect(() => {
    cache.current = {};
    setReady(false);
    setLoaded(0);
    let loadedCount = 0;
    let cancelled = false;

    const markLoaded = () => {
      loadedCount++;
      if (cancelled) return;
      setLoaded(loadedCount);
      if (loadedCount >= total) setReady(true);
    };

    files.forEach(f => {
      const a = new Audio();
      a.preload = 'auto';
      const onReady = () => {
        a.removeEventListener('canplaythrough', onReady);
        a.removeEventListener('loadeddata', onReady);
        a.removeEventListener('error', onError);
        markLoaded();
      };
      const onError = () => {
        a.removeEventListener('canplaythrough', onReady);
        a.removeEventListener('loadeddata', onReady);
        a.removeEventListener('error', onError);
        console.warn('[Audio] load failed:', f, `audio/${f}_${lang}.mp3`);
        markLoaded(); // count as "done" even on error — don't block UI forever
      };
      a.addEventListener('canplaythrough', onReady, { once: true });
      a.addEventListener('loadeddata', onReady, { once: true });
      a.addEventListener('error', onError, { once: true });
      a.src = `audio/${f}_${lang}.mp3`;
      a.load();
      cache.current[f] = a;
    });

    // Safety timeout: mark ready after 15 seconds regardless (slow networks)
    const safety = setTimeout(() => {
      if (!cancelled && loadedCount < total) {
        console.warn(`[Audio] preload timeout — ${loadedCount}/${total} loaded`);
        setReady(true);
      }
    }, 15000);

    return () => {
      cancelled = true;
      clearTimeout(safety);
      Object.values(cache.current).forEach(a => { try { a.pause(); a.src=''; } catch(_) {} });
      cache.current = {};
    };
  }, [lang]);

  // Return both cache ref (for audio access) and React state (for UI gating)
  return { cache, ready, loaded, total };
}

function BodyScanGuide() {
  const lang = useContext(LangCtx);
  const [running, setRunning] = useState(false);
  const [step, setStep] = useState(0);
  const [stepTime, setStepTime] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [done, setDone] = useState(false);
  const [muted, setMuted] = useState(false);
  const [secPerRegion, setSecPerRegion] = useState(60);
  const [scriptText, setScriptText] = useState('');
  const timerRef = useRef(null);
  const mutedRef = useRef(false);
  const lastStepRef = useRef(-1);
  const currentAudio = useRef(null);

  // Preload all body scan audio files
  const audioFiles = ['body_intro',...BODY_REGIONS.map(r=>'body_'+r),'body_complete'];
  const { cache: audioCache, ready: audioReady, loaded: audioLoaded, total: audioTotal } = usePreloadedAudio(audioFiles, lang);
  const audioProgress = (audioLoaded / audioTotal) * 100;

  function playNarration(name) {
    if (mutedRef.current) return;
    // Stop previous narration to prevent overlap
    if (currentAudio.current) {
      currentAudio.current.pause();
      currentAudio.current.currentTime = 0;
    }
    const a = audioCache.current[name];
    if (!a) return;
    a.currentTime = 0;
    a.volume = 1;
    a.play().catch(()=>{});
    currentAudio.current = a;
  }

  function getAudioDuration(name, fallback = 12) {
    const a = audioCache.current[name];
    return (a && a.duration && isFinite(a.duration)) ? a.duration : fallback;
  }

  useEffect(() => {
    mutedRef.current = muted;
    if (currentAudio.current) currentAudio.current.volume = muted ? 0 : 1;
  }, [muted]);

  useEffect(() => {
    if (!running) { if (timerRef.current) clearInterval(timerRef.current); return; }
    let sec = 0;
    lastStepRef.current = 0;
    timerRef.current = setInterval(() => {
      sec++;
      setElapsed(sec);
      const curStep = Math.min(Math.floor(sec / secPerRegion), BODY_REGIONS.length - 1);
      setStepTime(sec - curStep * secPerRegion);
      setStep(curStep);

      // Play narration only on step change
      if (curStep !== lastStepRef.current) {
        lastStepRef.current = curStep;
        const region = BODY_REGIONS[curStep];
        playNarration('body_' + region);
        setScriptText(BODY_SCRIPTS[lang][region] || '');
      }

      if (sec >= BODY_REGIONS.length * secPerRegion) {
        setDone(true); setRunning(false);
        playNarration('body_complete');
        setScriptText(BODY_SCRIPTS[lang].complete);
        playBell();
      }
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, [running, secPerRegion, lang]);

  function start() {
    playNarration('body_intro');
    setScriptText(lang === 'ko' ? '편안하게 누워주세요. 바디 스캔을 시작합니다.' : 'Lie down comfortably. Begin the body scan.');
    // Wait for intro to FULLY finish + 2s pause
    const introLen = getAudioDuration('body_intro', 12);
    const delay = Math.ceil((introLen + 2) * 1000);
    setTimeout(() => {
      setRunning(true); setStep(0); setElapsed(0); setDone(false);
      lastStepRef.current = 0;
      playNarration('body_feet');
      setScriptText(BODY_SCRIPTS[lang].feet);
    }, delay);
  }
  function stop() {
    Object.values(audioCache.current).forEach(a => { try{a.pause();a.currentTime=0;}catch(_){} });
    setRunning(false); setStep(0); setElapsed(0); setDone(false); setScriptText(''); lastStepRef.current = -1;
  }

  const region = BODY_REGIONS[step];
  const progress = running ? stepTime / secPerRegion : 0;
  const mins = Math.floor(elapsed/60), secs = elapsed%60;

  return (
    <div className="breath-guide fade-in" style={{position:'relative',paddingBottom:120}}>
      <button className={`mute-btn ${muted?'muted':''}`} onClick={()=>setMuted(!muted)}>{muted?'🔇':'🔊'}</button>
      <div className="cts-step-label">{done ? t(lang,'body.complete') : running ? t(lang,'body.'+region) : lang==='ko'?'준비':'Ready'}</div>
      <div style={{fontSize:'56px',margin:'20px 0'}}>{done ? '✨' : running ? BODY_EMOJI[step] : '🧘'}</div>
      {running && <div style={{fontSize:'12px',color:'var(--text-tertiary)'}}>{step+1} / {BODY_REGIONS.length}</div>}
      {running && (
        <div style={{width:'80%',maxWidth:300,height:6,background:'var(--surface)',borderRadius:3,margin:'12px auto',overflow:'hidden'}}>
          <div style={{width:`${progress*100}%`,height:'100%',background:'linear-gradient(90deg,var(--primary),var(--secondary))',borderRadius:3,transition:'width 1s linear'}}></div>
        </div>
      )}
      {(running||elapsed>0) && <div className="breath-timer">{String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}</div>}
      {!running && !done && (
        <div>
          <div className="breath-settings">
            <span style={{fontSize:'12px',color:'var(--text-tertiary)',lineHeight:'32px'}}>{lang==='ko'?'부위당 시간':'Per region'}:</span>
            {[45,60,90].map(s => <button key={s} className={`btn btn-sm ${secPerRegion===s?'btn-primary':'btn-secondary'}`} onClick={()=>setSecPerRegion(s)}>{s}s</button>)}
          </div>
          <div className="cts-controls" style={{marginTop:20}}>
            <button className="btn btn-primary" onClick={start} disabled={!audioReady}
              style={{ opacity: audioReady ? 1 : 0.5, cursor: audioReady ? 'pointer' : 'default' }}>
              {audioReady
                ? t(lang,'breath.start')
                : (lang === 'ko' ? `보이스 로딩 중… ${Math.round(audioProgress)}%` : `Loading voice… ${Math.round(audioProgress)}%`)}
            </button>
          </div>
        </div>
      )}
      {running && <div className="cts-controls" style={{marginTop:16}}><button className="btn btn-secondary btn-sm" onClick={stop}>{t(lang,'breath.stop')}</button></div>}
      {done && <div className="cts-controls" style={{marginTop:16}}><button className="btn btn-primary" onClick={stop}>{lang==='ko'?'다시 시작':'Restart'}</button></div>}

      {/* Script display (inline, like CTS) */}
      {scriptText && (
        <div className="cts-instruction" style={{marginTop:16,maxWidth:360,fontSize:'15px',lineHeight:1.8,color:'var(--text-secondary)',whiteSpace:'pre-line'}}>
          {scriptText}
        </div>
      )}
    </div>
  );
}

function ChakraGuide() {
  const lang = useContext(LangCtx);
  const [running, setRunning] = useState(false);
  const [step, setStep] = useState(0);
  const [stepTime, setStepTime] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [done, setDone] = useState(false);
  const [muted, setMuted] = useState(false);
  const [secPerChakra, setSecPerChakra] = useState(120);
  const [scriptText, setScriptText] = useState('');
  const timerRef = useRef(null);
  const oscRef = useRef(null);
  const mutedRef = useRef(false);
  const lastStepRef = useRef(-1);
  const currentAudio = useRef(null);

  const chakraAudioFiles = ['chakra_intro',...CHAKRAS_LIST.map(c=>'chakra_'+c.id),'chakra_complete'];
  const { cache: audioCache, ready: audioReady, loaded: audioLoaded, total: audioTotal } = usePreloadedAudio(chakraAudioFiles, lang);
  const audioProgress = (audioLoaded / audioTotal) * 100;

  function playNarration(name) {
    if (mutedRef.current) return;
    // Stop previous narration to prevent overlap
    if (currentAudio.current) {
      currentAudio.current.pause();
      currentAudio.current.currentTime = 0;
    }
    const a = audioCache.current[name];
    if (!a) return;
    a.currentTime = 0;
    a.volume = 1;
    a.play().catch(()=>{});
    currentAudio.current = a;
  }

  // Get preloaded audio duration (returns seconds, fallback to default)
  function getAudioDuration(name, fallback = 12) {
    const a = audioCache.current[name];
    return (a && a.duration && isFinite(a.duration)) ? a.duration : fallback;
  }

  function startTone(hz, delayMs = 0) {
    if (delayMs > 0) {
      setTimeout(() => startTone(hz, 0), delayMs);
      return;
    }
    stopTone();
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = hz;
    // Fade in over 2 seconds for smooth start
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(mutedRef.current ? 0 : 0.06, ctx.currentTime + 2);
    osc.connect(g); g.connect(ctx.destination); osc.start();
    oscRef.current = { osc, gain: g };
  }
  function stopTone() {
    if (oscRef.current) {
      // Capture ref BEFORE clearing — prevents delayed stop from killing next tone
      const ref = oscRef.current;
      oscRef.current = null; // clear immediately so new tone won't be affected
      try {
        ref.gain.gain.linearRampToValueAtTime(0, ref.gain.context.currentTime + 0.5);
        setTimeout(() => { try { ref.osc.stop(); } catch(_){} }, 600);
      } catch(_) {}
    }
  }

  useEffect(() => {
    mutedRef.current = muted;
    if (currentAudio.current) currentAudio.current.volume = muted?0:1;
    if (oscRef.current) oscRef.current.gain.gain.value = muted?0:0.06;
  }, [muted]);

  useEffect(() => {
    if (!running) { if (timerRef.current) clearInterval(timerRef.current); stopTone(); return; }
    let sec = 0;
    lastStepRef.current = 0;
    timerRef.current = setInterval(() => {
      sec++;
      setElapsed(sec);
      const curStep = Math.min(Math.floor(sec / secPerChakra), 6);
      setStepTime(sec - curStep * secPerChakra);
      setStep(curStep);

      if (curStep !== lastStepRef.current && curStep < 7) {
        lastStepRef.current = curStep;
        const ck = CHAKRAS_LIST[curStep];
        // Stop previous tone IMMEDIATELY at step boundary
        stopTone();
        playBell();
        playNarration('chakra_' + ck.id);
        setScriptText(CHAKRA_SCRIPTS[lang][ck.id] || '');
        // Tone starts after narration (dynamic delay)
        const narLen = getAudioDuration('chakra_' + ck.id, 13);
        startTone(ck.hz, Math.ceil(Math.min(5000, narLen * 350)));
      }

      if (sec >= 7 * secPerChakra) {
        stopTone(); setDone(true); setRunning(false);
        playNarration('chakra_complete');
        setScriptText(CHAKRA_SCRIPTS[lang].complete);
        playBell();
      }
    }, 1000);
    return () => { clearInterval(timerRef.current); stopTone(); };
  }, [running, secPerChakra, lang]);

  function start() {
    playNarration('chakra_intro');
    setScriptText(lang==='ko'?'차크라 활성화를 시작합니다. 뿌리 차크라부터 크라운 차크라까지 순서대로 에너지를 깨웁니다.':'Begin chakra activation. We will awaken energy from Root to Crown.');
    // Wait for intro to FULLY finish + 2s pause before first chakra
    const introLen = getAudioDuration('chakra_intro', 12);
    const delay = Math.ceil((introLen + 2) * 1000);
    setTimeout(() => {
      setRunning(true); setStep(0); setElapsed(0); setDone(false);
      lastStepRef.current = 0;
      playNarration('chakra_root');
      setScriptText(CHAKRA_SCRIPTS[lang].root);
      // Tone starts after narration (root is ~15s, start tone at 5s — voice is clearly heard first)
      const rootLen = getAudioDuration('chakra_root', 15);
      startTone(CHAKRAS_LIST[0].hz, Math.min(5000, rootLen * 300));
    }, delay);
  }
  function stop() {
    // Stop all audio
    Object.values(audioCache.current).forEach(a => { try{a.pause();a.currentTime=0;}catch(_){} });
    stopTone();
    setRunning(false); setStep(0); setElapsed(0); setDone(false); setScriptText(''); lastStepRef.current=-1;
  }

  const ck = CHAKRAS_LIST[Math.min(step, 6)];
  const progress = running ? stepTime / secPerChakra : 0;
  const mins = Math.floor(elapsed/60), secs = elapsed%60;

  return (
    <div className="breath-guide fade-in" style={{position:'relative',paddingBottom:120}}>
      <button className={`mute-btn ${muted?'muted':''}`} onClick={()=>setMuted(!muted)}>{muted?'🔇':'🔊'}</button>
      <div className="cts-step-label" style={{color:done?'var(--secondary)':ck.color}}>{done ? t(lang,'chakra.complete') : running ? (lang==='ko'?ck.ko:ck.en) : lang==='ko'?'준비':'Ready'}</div>

      <div style={{width:180,height:180,borderRadius:'50%',margin:'20px auto',border:`3px solid ${done?'var(--secondary)':ck.color}`,background:`radial-gradient(circle, ${ck.color}30, transparent)`,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',transition:'all 0.5s'}}>
        {running && <div style={{fontSize:28,fontWeight:700,color:ck.color}}>{ck.hz}Hz</div>}
        {running && <div style={{fontSize:11,color:'var(--text-tertiary)',marginTop:4}}>{step+1} / 7</div>}
        {done && <div style={{fontSize:36}}>✨</div>}
        {!running && !done && <div style={{fontSize:36}}>🕉️</div>}
      </div>

      {running && (
        <div style={{display:'flex',gap:8,justifyContent:'center',margin:'8px 0'}}>
          {CHAKRAS_LIST.map((c,i) => <div key={i} style={{width:12,height:12,borderRadius:'50%',background:i<=step?c.color:'var(--surface)',transition:'background 0.3s',boxShadow:i===step?`0 0 12px ${c.color}60`:'none'}}></div>)}
        </div>
      )}
      {running && (
        <div style={{width:'80%',maxWidth:300,height:6,background:'var(--surface)',borderRadius:3,margin:'8px auto',overflow:'hidden'}}>
          <div style={{width:`${progress*100}%`,height:'100%',background:ck.color,borderRadius:3,transition:'width 1s linear'}}></div>
        </div>
      )}
      {(running||elapsed>0) && <div className="breath-timer">{String(mins).padStart(2,'0')}:{String(secs).padStart(2,'0')}</div>}
      {!running && !done && (
        <div>
          <div className="breath-settings">
            <span style={{fontSize:'12px',color:'var(--text-tertiary)',lineHeight:'32px'}}>{lang==='ko'?'차크라당 시간':'Per chakra'}:</span>
            {[90,120,180].map(s => <button key={s} className={`btn btn-sm ${secPerChakra===s?'btn-primary':'btn-secondary'}`} onClick={()=>setSecPerChakra(s)}>{s/60}min</button>)}
          </div>
          <div className="cts-controls" style={{marginTop:20}}>
            <button className="btn btn-primary" onClick={start} disabled={!audioReady}
              style={{ opacity: audioReady ? 1 : 0.5, cursor: audioReady ? 'pointer' : 'default' }}>
              {audioReady
                ? t(lang,'breath.start')
                : (lang === 'ko' ? `보이스 로딩 중… ${Math.round(audioProgress)}%` : `Loading voice… ${Math.round(audioProgress)}%`)}
            </button>
          </div>
        </div>
      )}
      {running && <div className="cts-controls" style={{marginTop:16}}><button className="btn btn-secondary btn-sm" onClick={stop}>{t(lang,'breath.stop')}</button></div>}
      {done && <div className="cts-controls" style={{marginTop:16}}><button className="btn btn-primary" onClick={stop}>{lang==='ko'?'다시 시작':'Restart'}</button></div>}

      {/* Script display (inline, like CTS) */}
      {scriptText && (
        <div className="cts-instruction" style={{marginTop:16,maxWidth:360,fontSize:'15px',lineHeight:1.8,color:'var(--text-secondary)',whiteSpace:'pre-line'}}>
          {scriptText}
        </div>
      )}
    </div>
  );
}

// FFT sidecar sampling — adapted from public/js/cymatics-loader.js (ESM-free copy)
function dfSampleFFT(sidecar, timeSec) {
  if (!sidecar || !sidecar.frames || sidecar.frames.length === 0) return null;
  const bins = sidecar.bins;
  const out = new Float32Array(bins);
  const idxF = Math.max(0, timeSec) * sidecar.fps;
  const i0 = Math.floor(idxF);
  if (i0 >= sidecar.frames.length) {
    const last = sidecar.frames[sidecar.frames.length - 1];
    for (let i = 0; i < bins; i++) out[i] = last[i] / 255;
    return out;
  }
  const i1 = Math.min(i0 + 1, sidecar.frames.length - 1);
  const frac = Math.min(1, idxF - i0);
  const f0 = sidecar.frames[i0], f1 = sidecar.frames[i1];
  for (let i = 0; i < bins; i++) out[i] = (f0[i] * (1 - frac) + f1[i] * frac) / 255;
  return out;
}
function dfBands(spectrum) {
  if (!spectrum) return { bass: 0, mid: 0, treble: 0 };
  const n = spectrum.length;
  const avg = (lo, hi) => {
    let s = 0, c = 0;
    for (let i = lo; i < hi && i < n; i++) { s += spectrum[i]; c++; }
    return c > 0 ? s / c : 0;
  };
  const q = Math.floor(n / 4);
  return { bass: avg(0, q), mid: avg(q, q * 3), treble: avg(q * 3, n) };
}

    const smallScreen = Math.min(window.screen.width, window.screen.height) < 820;
    const isMobile = (/Mobi|Android|iPhone|iPad|iPod|Tablet/i.test(navigator.userAgent)) || (coarse && smallScreen);
    const cores = navigator.hardwareConcurrency || 8;
    const Q = isMobile ? 0.38 : (cores <= 4 ? 0.7 : 1.0);
    const qScale = n => Math.round(n * Q);
    this._isMobile = isMobile;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.25 : 2));
    renderer.setClearColor(0x000000, 1);
    renderer.autoClear = true;
    const PR = renderer.getPixelRatio();
    const isGL2 = renderer.capabilities.isWebGL2;
    this.renderer = renderer; this._PR = PR; this._isGL2 = isGL2;

    this.renderer.setRenderTarget(this._sceneRT); this.renderer.clear();
    this.renderer.render(this.scene, this.camera);
    this._blit(this._brightMat, this._brightRT);
    let src = this._brightRT;
    for (let i = 0; i < this._LEVELS; i++) {
      const w = this._lvlSize[i][0], h = this._lvlSize[i][1];
      this._blurMat.uniforms.tDiffuse.value = src.texture;
      this._blurMat.uniforms.uDir.value.set(this._bloomRadius/w, 0); this._blit(this._blurMat, this._rtH[i]);
      this._blurMat.uniforms.tDiffuse.value = this._rtH[i].texture;
      this._blurMat.uniforms.uDir.value.set(0, this._bloomRadius/h); this._blit(this._blurMat, this._rtV[i]);
      src = this._rtV[i];
    }
    this.renderer.setRenderTarget(null);
    this._fsQuad.material = this._compMat;
    this.renderer.render(this._fsScene, this._fsCam);
  }

  _applyCamera() {
    const c = this.cam, r = c.radius, p = c.phi, t = c.theta;
    this.camera.position.set(r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
    this.camera.lookAt(c.target);
  }

  goToScene(idx) {
    const n = this.targets.length;
    idx = ((idx % n) + n) % n;
    if (idx === this.active) return;
    this.prev = this.active; this.active = idx; this.fade = 0;
    this.targets[this.active].group.visible = true;
    this.targets[this.prev].group.visible = true;
    this.sweep = {
      ft: this.cam.theta, fp: this.cam.phi, fr: this.cam.radius,
      tt: this.cam.theta + this.POSE[idx].dTheta,
      tp: this.POSE[idx].phi,
      tr: this.targets[idx].camRadius,
      t: 0, dur: 1.8
    };
  }

  setAmbient(bass, mid, treble) {
    this._ambient.bass = bass || 0;
    this._ambient.mid = mid || 0;
    this._ambient.treble = treble || 0;
  }

  start() {
    if (this._raf) return;
    const loop = () => {
      this._tick();
      this._raf = requestAnimationFrame(loop);
    };
    loop();
  }
  stop() {
    if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; }
  }

  _tick() {
    const dt = this._clock.getDelta();
    const t = this._clock.getElapsedTime();
    if (this.fade < 1) {
      this.fade = Math.min(1, this.fade + dt/0.75);
      const e = this.fade*this.fade*(3 - 2*this.fade);
      this.targets[this.active].setOpacity(e);
      if (this.prev >= 0) this.targets[this.prev].setOpacity(1 - e);
      if (this.fade >= 1 && this.prev >= 0) {
        this.targets[this.prev].group.visible = false; this.prev = -1;
      }
    }
    if (this.sweep) {
      this.sweep.t = Math.min(1, this.sweep.t + dt/this.sweep.dur);
      const k = this.sweep.t;
      const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
      const lerp = (a,b,r) => a + (b-a)*r;
      this.cam.theta = lerp(this.sweep.ft, this.sweep.tt, e);
      this.cam.phi = lerp(this.sweep.fp, this.sweep.tp, e);
      this.cam.radius = lerp(this.sweep.fr, this.sweep.tr, e);
      if (this.sweep.t >= 1) { this.sweep = null; this._autoIdle = 0; }
    } else {
      this._autoIdle += dt;
      if (this._autoIdle > 1.6) this.cam.theta += dt*0.05;
    }
    this.targets[this.active].update(t, this.camera);
    if (this.prev >= 0) this.targets[this.prev].update(t, this.camera);
    this.targets.forEach(tg => tg.group.children.forEach(ch => { if (ch.isSprite) ch.position.copy(this.cam.target); }));

    // Ambient audio coupling — smoothed for meditation feel
    const target = this._ambient;
    this._ambBass += (target.bass - this._ambBass) * Math.min(1, dt*4);
    this._ambTreble += (target.treble - this._ambTreble) * Math.min(1, dt*4);
    this._compMat.uniforms.uStrength.value = 1.25 + this._ambBass * 0.40;
    this._compMat.uniforms.uExposure.value = 1.05 + this._ambTreble * 0.15;

    this._applyCamera();
    this._renderBloom();
  }

  destroy() {
    this.stop();
    window.removeEventListener('resize', this._resize);
    this.targets.forEach(tg => {
      tg.group.traverse(ch => {
        if (ch.geometry) ch.geometry.dispose();
        if (ch.material) {
          if (ch.material.map) ch.material.map.dispose();
          ch.material.dispose();
        }
      });
    });
    if (this._stars) {
      this._stars.geometry.dispose();
      this._stars.material.dispose();
    }
    if (this._sceneRT) this._sceneRT.dispose();
    if (this._brightRT) this._brightRT.dispose();
    this._rtH.forEach(r => r.dispose());
    this._rtV.forEach(r => r.dispose());
    this._brightMat.dispose();
    this._blurMat.dispose();
    this._compMat.dispose();
    this._fsQuad.geometry.dispose();
    this.renderer.dispose();
  }
}
