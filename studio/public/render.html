<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Karleido — Render</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status" style="position:fixed;left:8px;top:8px;color:#fff;font-family:monospace;font-size:14px;text-shadow:0 1px 2px #000;z-index:10"></div>
<script>
(async function main() {
  const qs = new URL(location.href).searchParams;
  const cfgB64 = qs.get('cfg');
  const jobId  = qs.get('job');
  const cfg    = JSON.parse(atob(cfgB64));
  const log = (m) => { console.log('[render]', m); const s=document.getElementById('status'); if(s) s.textContent=m; };

  log('cfg loaded: ' + cfg.shaderId + ' · ' + cfg.resolution + ' · ' + cfg.fps + 'fps');

  // ── Canvas / WebGL setup ──────────────────────────────────
  const [W, H] = cfg.resolution.split('x').map(Number);

  // WebGL canvas — offscreen, used for shader render + FX pipeline.
  const glCanvas = document.createElement('canvas');
  glCanvas.width = W; glCanvas.height = H;
  // Try WebGL2 first (better precision + extensions), fall back to WebGL1, then experimental-webgl.
  const glAttrs = { antialias: true, preserveDrawingBuffer: true, alpha: false };
  const gl = glCanvas.getContext('webgl2', glAttrs)
          || glCanvas.getContext('webgl', glAttrs)
          || glCanvas.getContext('experimental-webgl', glAttrs);
  if (!gl) throw new Error('WebGL not available (tried webgl2 / webgl / experimental-webgl)');
  log('WebGL context: ' + (gl.getParameter && gl.getParameter(gl.VERSION) || 'unknown'));

  // Visible output canvas — 2D, composites FX'd WebGL + watermark + overlays → MediaRecorder target.
  const canvas = document.getElementById('c');
  canvas.width = W; canvas.height = H;
  const octx = canvas.getContext('2d');

  // FBO + post-processing program — applied to the preset render before compositing
  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const sharedVs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(sharedVs, 'attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }');
  gl.compileShader(sharedVs);

  // Helper: create a single FBO + color-attached texture at given size
  function makeFBO(w, h) {
    const fb = gl.createFramebuffer();
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex };
  }

  let fbo = null, fboTex = null;
  function setupFBO() {
    const o = makeFBO(W, H);
    fbo = o.fb; fboTex = o.tex;
  }
  setupFBO();

  // Ping-pong FBOs for shaders that want a previous-frame feedback texture
  // (Karleido-style: e.g., texture_warp uses uniform sampler2D BuffA = self last frame).
  let pingPong = null;
  function setupPingPong() {
    pingPong = { a: makeFBO(W, H), b: makeFBO(W, H), readFromA: true };
  }

  let postProg = null, postLocs = {};
  async function compilePost() {
    const src = await fetch('/shaders/post.frag').then(r => r.text());
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, src); gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) { log('post fs: ' + gl.getShaderInfoLog(fs)); return; }
    const p = gl.createProgram();
    gl.attachShader(p, sharedVs); gl.attachShader(p, fs);
    gl.linkProgram(p); gl.deleteShader(fs);
    postProg = p;
    ['u_tex','u_resolution','u_time','u_fxVignette','u_fxChroma','u_fxScanlines','u_fxGrain','u_fxPixelate']
      .forEach(k => postLocs[k] = gl.getUniformLocation(p, k));
  }
  await compilePost();

  // VS + quad buffer already created above as `sharedVs` / `quadBuf`. Re-use them.
  const vs = sharedVs;

  // Load presets + palettes + shader + shared libs
  log('fetching presets/palettes/shader...');
  const [presets, palettes, fragRes, paletteLib, audioLib] = await Promise.all([
    fetch('/api/presets').then(r => r.json()),
    fetch('/api/palettes').then(r => r.json()),
    fetch('/shaders/' + cfg.shader).then(r => r.text()),
    fetch('/shaders/lib/palette.glsl').then(r => r.ok ? r.text() : ''),
    fetch('/shaders/lib/audio.glsl').then(r => r.ok ? r.text() : ''),
  ]);
  const preset = presets.find(p => p.id === cfg.shaderId);
  if (!preset) throw new Error('Preset not found: ' + cfg.shaderId);
  // Custom palettes live only in client localStorage — caller inlines them via cfg.customPalette.
  const pal = (cfg.customPalette && cfg.customPalette.a)
    ? cfg.customPalette
    : (palettes.find(p => p.id === cfg.paletteId) || palettes[0]);

  // Shaders may declare `#pragma use_lib palette` / `#pragma use_lib audio` on
  // their first line to opt into shared helpers. Libs are prepended right after
  // the `precision` declaration so uniforms dedupe correctly.
  function composeShader(src, libs) {
    const useLib = {
      palette: /#pragma\s+use_lib\s+palette/.test(src),
      audio:   /#pragma\s+use_lib\s+audio/.test(src),
    };
    if (!useLib.palette && !useLib.audio) return src;
    const m = src.match(/(precision\s+\w+\s+float\s*;)/);
    const prefix = (useLib.audio   ? libs.audio   + '\n' : '')
                 + (useLib.palette ? libs.palette + '\n' : '');
    return m
      ? src.replace(m[1], m[1] + '\n' + prefix)
      : 'precision highp float;\n' + prefix + src;
  }
  // ── Multi-pass shader graph ──────────────────────────────
  // A preset can declare `passes: [{ shader?, defines?, inputs?, feedback?, size? }, ...]`.
  // Each pass compiles its own program, has its own FBO (or ping-pong pair if feedback),
  // can read from earlier passes' output via `inputs: { samplerName: passId }`.
  // The LAST pass's output becomes the input to the post-FX pipeline.
  //
  // For backward-compat: if no `passes` field, a single default pass uses the preset's
  // top-level `shader` field (= cfg.shader).
  const STD_UNIFORMS = [
    'u_time','u_resolution','u_bass','u_mid','u_treble','u_beat',
    'u_bassHit','u_midHit','u_trebleHit',
    'u_bassPres','u_midPres','u_treblePres',
    'u_bassTime','u_midTime','u_trebleTime',
    'u_beatOnset','u_beatPhase','u_beatPeriod',
    'u_colorA','u_colorB','u_colorC','u_paletteMix','u_paletteMode',
  ];

  const fragSrcCache = { [cfg.shader]: fragRes };
  async function loadFrag(name) {
    if (!fragSrcCache[name]) {
      fragSrcCache[name] = await fetch('/shaders/' + name).then(r => r.text());
    }
    return fragSrcCache[name];
  }

  function compileFrag(name, definesStr) {
    const raw = fragSrcCache[name];
    let composed = composeShader(raw, { palette: paletteLib, audio: audioLib });
    if (definesStr) {
      const m = composed.match(/(precision\s+\w+\s+float\s*;)/);
      composed = m
        ? composed.replace(m[1], m[1] + '\n' + definesStr)
        : definesStr + composed;
    }
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, composed);
    gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
      const err = gl.getShaderInfoLog(fs);
      console.error('FS compile error in', name, ':\n', composed);
      throw new Error('FS ' + name + ': ' + err);
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('Link ' + name + ': ' + gl.getProgramInfoLog(prog));
    return prog;
  }

  async function buildPass(passConfig, idx) {
    const id = passConfig.id || ('p' + idx);
    const shaderName = passConfig.shader || cfg.shader;
    await loadFrag(shaderName);
    const definesStr = passConfig.defines
      ? Object.entries(passConfig.defines).map(([k, v]) => `#define ${k} ${v}\n`).join('')
      : '';
    const prog = compileFrag(shaderName, definesStr);
    const uni = {};
    STD_UNIFORMS.forEach(k => uni[k] = gl.getUniformLocation(prog, k));
    Object.keys(preset.params).forEach(k => uni['u_' + k] = gl.getUniformLocation(prog, 'u_' + k));
    // Input samplers (named in passConfig.inputs)
    const inputSamplers = {};
    if (passConfig.inputs) {
      for (const samplerName of Object.keys(passConfig.inputs)) {
        inputSamplers[samplerName] = gl.getUniformLocation(prog, samplerName);
      }
    }
    // FBO size — default = canvas size (W×H). Numeric like "256x256" allowed.
    let fW = W, fH = H;
    if (passConfig.size && /^\d+x\d+$/.test(passConfig.size)) {
      [fW, fH] = passConfig.size.split('x').map(Number);
    }
    const fbos = passConfig.feedback
      ? { a: makeFBO(fW, fH), b: makeFBO(fW, fH), readFromA: true }
      : { single: makeFBO(fW, fH) };
    return { id, prog, uni, inputSamplers, inputs: passConfig.inputs || {},
             feedback: !!passConfig.feedback, fbos, w: fW, h: fH };
  }

  const passConfigs = preset.passes || [{ shader: cfg.shader }];
  const passes = [];
  for (let i = 0; i < passConfigs.length; i++) passes.push(await buildPass(passConfigs[i], i));
  log('shader graph: ' + passes.map(p => p.id).join(' → '));

  const hexToRgb = (h) => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
  const colA = hexToRgb(pal.a), colB = hexToRgb(pal.b), colC = hexToRgb(pal.c);

  // ── Watermark ────────────────────────────────────────────
  let watermarkImg = null;
  if (cfg.watermark !== false) {
    watermarkImg = new Image();
    watermarkImg.crossOrigin = 'anonymous';
    const wmUrl = cfg.watermarkUrl || '/watermark-5d-healing.svg';
    await new Promise((resolve) => {
      watermarkImg.onload = resolve;
      watermarkImg.onerror = () => { log('watermark load failed → disabled'); watermarkImg = null; resolve(); };
      watermarkImg.src = wmUrl;
    });
    if (watermarkImg) log('watermark loaded: ' + wmUrl);
  }

  // ── Audio setup ──────────────────────────────────────────
  log('loading audio: ' + cfg.trackUrl);
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.src = cfg.trackUrl;
  audio.preload = 'auto';
  await new Promise((res, rej) => {
    audio.addEventListener('loadedmetadata', res, { once: true });
    audio.addEventListener('error', () => rej(new Error('audio load error')), { once: true });
  });
  log('audio duration: ' + audio.duration.toFixed(1) + 's');

  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const source = ac.createMediaElementSource(audio);
  const analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.55;
  source.connect(analyser);

  // Destination for recorded audio track (into captureStream)
  const streamDest = ac.createMediaStreamDestination();
  source.connect(streamDest);
  // Also route to speakers so analyser stays fed. In headless this is silent.
  source.connect(ac.destination);

  const freqData = new Uint8Array(analyser.frequencyBinCount);
  // ── Audio feature matrix (Karleido-style: hit/presence/time per band + beat tracking) ──
  // Presence = smoothed RMS-like energy. Hit = peak-hold envelope (fast attack, slow decay).
  // Time = seconds since last transient. Beat = spectral-flux-style onset on bass band.
  let bassS=0, midS=0, trebS=0;              // legacy smoothed bands (kept for compat)
  let bassPres=0, midPres=0, treblePres=0;
  let bassHit=0, midHit=0, trebleHit=0;
  let lastBassHitT=0, lastMidHitT=0, lastTrebleHitT=0;
  let prevBass=0, lastBeatT=0, beatPeriod=0.5, beatOnset=0, beat=0;
  const BEAT_SENS = cfg.beatSensitivity || 0.12;

  function audioMetrics(tSec) {
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    const bEnd = Math.max(1, Math.floor(n * 0.08));   // ~0-1.7kHz  (sub + bass)
    const mEnd = Math.max(bEnd + 1, Math.floor(n * 0.35)); // ~1.7-7.5kHz (mid)
    let bass = 0, mid = 0, treb = 0;
    for (let i = 0; i < bEnd; i++) bass += freqData[i];
    for (let i = bEnd; i < mEnd; i++) mid += freqData[i];
    for (let i = mEnd; i < n; i++) treb += freqData[i];
    bass = bass / bEnd / 255;
    mid  = mid  / (mEnd - bEnd) / 255;
    treb = treb / (n - mEnd) / 255;

    // Legacy smoothed (existing shaders depend on these)
    bassS = bassS * 0.55 + bass * 0.45;
    midS  = midS  * 0.55 + mid  * 0.45;
    trebS = trebS * 0.55 + treb * 0.45;

    // Presence = slow low-pass (0.5-1s ramp)
    bassPres    = bassPres    * 0.88 + bass * 0.12;
    midPres     = midPres     * 0.86 + mid  * 0.14;
    treblePres  = treblePres  * 0.84 + treb * 0.16;

    // Hit = peak-hold envelope (instant attack, fast decay)
    bassHit    = Math.max(bassHit    - 0.06, bass);
    midHit     = Math.max(midHit     - 0.08, mid);
    trebleHit  = Math.max(trebleHit  - 0.10, treb);

    // Time since last transient — useful for parameter ramping
    if (bass > bassPres * 1.35 && bass > 0.32) lastBassHitT  = tSec;
    if (mid  > midPres  * 1.3)                  lastMidHitT   = tSec;
    if (treb > treblePres * 1.3)                lastTrebleHitT= tSec;

    // Beat onset on bass (spectral flux) with refractory period
    const delta = bass - prevBass;
    if (delta > BEAT_SENS && bass > 0.32 && (tSec - lastBeatT) > 0.18) {
      beatOnset = 1.0;
      const newPeriod = tSec - lastBeatT;
      if (newPeriod < 1.5) beatPeriod = beatPeriod * 0.6 + newPeriod * 0.4; // running avg BPM estimate
      lastBeatT = tSec;
      beat = 1.0; // legacy beat pulse (decays in render loop)
    }
    beatOnset = Math.max(0, beatOnset - 0.12);
    prevBass = bass;
  }

  // ── Parameter smoothing layer ──
  // Karleido "smoothFactor" equivalent: each frame, uniform value approaches target
  // via `val += (target - val) * factor`. Higher factor = snappier. Default: 0.18.
  const smoothedParams = {};
  function smoothParam(key, target, factor) {
    if (!(key in smoothedParams)) smoothedParams[key] = target;
    smoothedParams[key] += (target - smoothedParams[key]) * (factor == null ? 0.18 : factor);
    return smoothedParams[key];
  }

  // ── Render frame (2-pass: preset → FBO, post → glCanvas; 2D composite) ──
  const t0 = performance.now();
  const fxCfg = cfg.fx || {};
  const overlayCfg = (cfg.overlay && cfg.overlay.title) || null;

  function renderFrame() {
    const t = (performance.now() - t0) / 1000;
    audioMetrics(t);

    // ── Multi-pass shader graph ──
    const haveFX = !!(postProg && fbo);
    const effBeat = (cfg.beatMove === false ? 0 : beat) * (1 + (cfg.beatGlow || 0) * 2);
    const beatPhase = beatPeriod > 0.1 ? ((t - lastBeatT) / beatPeriod) % 1 : 0;

    // Helper: write the full uniform matrix (std + params) into a pass's program.
    function setUniformsForPass(pass) {
      const u = pass.uni;
      if (u.u_time)        gl.uniform1f(u.u_time, t);
      if (u.u_resolution)  gl.uniform2f(u.u_resolution, pass.w, pass.h);
      if (u.u_bass)        gl.uniform1f(u.u_bass, bassS);
      if (u.u_mid)         gl.uniform1f(u.u_mid,  midS);
      if (u.u_treble)      gl.uniform1f(u.u_treble, trebS);
      if (u.u_beat)        gl.uniform1f(u.u_beat, effBeat);
      if (u.u_bassHit)     gl.uniform1f(u.u_bassHit,    bassHit);
      if (u.u_midHit)      gl.uniform1f(u.u_midHit,     midHit);
      if (u.u_trebleHit)   gl.uniform1f(u.u_trebleHit,  trebleHit);
      if (u.u_bassPres)    gl.uniform1f(u.u_bassPres,   bassPres);
      if (u.u_midPres)     gl.uniform1f(u.u_midPres,    midPres);
      if (u.u_treblePres)  gl.uniform1f(u.u_treblePres, treblePres);
      if (u.u_bassTime)    gl.uniform1f(u.u_bassTime,   Math.min(9, t - lastBassHitT));
      if (u.u_midTime)     gl.uniform1f(u.u_midTime,    Math.min(9, t - lastMidHitT));
      if (u.u_trebleTime)  gl.uniform1f(u.u_trebleTime, Math.min(9, t - lastTrebleHitT));
      if (u.u_beatOnset)   gl.uniform1f(u.u_beatOnset,  beatOnset);
      if (u.u_beatPeriod)  gl.uniform1f(u.u_beatPeriod, beatPeriod);
      if (u.u_beatPhase)   gl.uniform1f(u.u_beatPhase,  beatPhase);
      if (u.u_colorA)      gl.uniform3fv(u.u_colorA, colA);
      if (u.u_colorB)      gl.uniform3fv(u.u_colorB, colB);
      if (u.u_colorC)      gl.uniform3fv(u.u_colorC, colC);
      if (u.u_paletteMix)  gl.uniform1f(u.u_paletteMix, cfg.paletteMix != null ? cfg.paletteMix : 0.85);
      if (u.u_paletteMode) gl.uniform1f(u.u_paletteMode, cfg.paletteMode != null ? cfg.paletteMode : 0);
      Object.keys(preset.params).forEach(k => {
        const loc = u['u_' + k];
        if (!loc) return;
        let v = (cfg.params && k in cfg.params) ? cfg.params[k] : preset.params[k].default;
        const src = (preset.audioMap || {})[k];
        if (cfg.beatMove !== false) {
          if      (src === 'bass')      v *= 1 + bassPres   * 0.6 + bassHit   * 0.25;
          else if (src === 'mid')       v *= 1 + midPres    * 0.6 + midHit    * 0.25;
          else if (src === 'treble')    v *= 1 + treblePres * 0.6 + trebleHit * 0.25;
          else if (src === 'bassHit')   v *= 1 + bassHit    * 0.9;
          else if (src === 'midHit')    v *= 1 + midHit     * 0.9;
          else if (src === 'trebleHit') v *= 1 + trebleHit  * 0.9;
          else if (src === 'beat')      v *= 1 + beatOnset  * 0.8;
        }
        const factor = (preset.params[k].smooth === false) ? 1.0 : (preset.params[k].smoothFactor || 0.18);
        const smoothed = (src && src !== 'none') ? smoothParam(k + '@' + pass.id, v, factor) : v;
        gl.uniform1f(loc, smoothed);
      });
    }

    // Render each pass in order.
    for (let pi = 0; pi < passes.length; pi++) {
      const pass = passes[pi];
      const isLast = (pi === passes.length - 1);
      // Output target — the LAST pass renders into the main fbo so post-FX picks it up.
      let writeTex;
      if (isLast && haveFX) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        writeTex = fboTex;
      } else if (pass.feedback) {
        const w = pass.fbos.readFromA ? pass.fbos.b : pass.fbos.a;
        gl.bindFramebuffer(gl.FRAMEBUFFER, w.fb);
        writeTex = w.tex;
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, pass.fbos.single.fb);
        writeTex = pass.fbos.single.tex;
      }
      gl.viewport(0, 0, pass.w, pass.h);
      gl.useProgram(pass.prog);

      // Re-bind quad attribute for this program
      const aPos = gl.getAttribLocation(pass.prog, 'a_pos');
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      // Bind pass inputs (samplers from earlier passes / self-prev for feedback)
      let texUnit = 1;  // unit 0 reserved for post-FX
      for (const [samplerName, sourceId] of Object.entries(pass.inputs)) {
        let srcTex;
        if (sourceId === pass.id && pass.feedback) {
          // self-feedback: read the OTHER ping-pong tex
          const r = pass.fbos.readFromA ? pass.fbos.a : pass.fbos.b;
          srcTex = r.tex;
        } else {
          const srcPass = passes.find(p => p.id === sourceId);
          if (!srcPass) continue;
          srcTex = srcPass.feedback
            ? (srcPass.fbos.readFromA ? srcPass.fbos.b.tex : srcPass.fbos.a.tex)
            : srcPass.fbos.single.tex;
        }
        gl.activeTexture(gl.TEXTURE0 + texUnit);
        gl.bindTexture(gl.TEXTURE_2D, srcTex);
        if (pass.inputSamplers[samplerName]) {
          gl.uniform1i(pass.inputSamplers[samplerName], texUnit);
        }
        texUnit++;
      }

      setUniformsForPass(pass);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      if (pass.feedback) pass.fbos.readFromA = !pass.fbos.readFromA;
    }

    // Pass 2: FX post-process → glCanvas screen
    if (haveFX) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.useProgram(postProg);
      const aPos2 = gl.getAttribLocation(postProg, 'a_pos');
      gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
      gl.enableVertexAttribArray(aPos2);
      gl.vertexAttribPointer(aPos2, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, fboTex);
      gl.uniform1i(postLocs.u_tex, 0);
      gl.uniform2f(postLocs.u_resolution, W, H);
      gl.uniform1f(postLocs.u_time, t);
      const fxOn = fxCfg.enabled === false ? 0 : 1;
      gl.uniform1f(postLocs.u_fxVignette,  fxOn * (fxCfg.vignette  || 0));
      gl.uniform1f(postLocs.u_fxChroma,    fxOn * (fxCfg.chroma    || 0));
      gl.uniform1f(postLocs.u_fxScanlines, fxOn * (fxCfg.scanlines || 0));
      gl.uniform1f(postLocs.u_fxGrain,     fxOn * (fxCfg.grain     || 0));
      gl.uniform1f(postLocs.u_fxPixelate,  fxOn * (fxCfg.pixelate  || 0));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    beat = Math.max(0, beat - 0.045);

    // ── 2D composite ─────────────────────────────────
    octx.drawImage(glCanvas, 0, 0, W, H);

    // Watermark
    if (watermarkImg) {
      const wmW = Math.round(W * 0.18);
      const wmH = Math.round(wmW * (watermarkImg.naturalHeight / watermarkImg.naturalWidth));
      const pad = Math.round(W * 0.022);
      octx.save();
      octx.globalAlpha = cfg.watermarkOpacity != null ? cfg.watermarkOpacity : 0.78;
      octx.drawImage(watermarkImg, W - wmW - pad, H - wmH - pad, wmW, wmH);
      octx.restore();
    }

    // Title overlay
    if (overlayCfg && overlayCfg.enabled) {
      const text = ((overlayCfg.text || '').trim()) || cfg.trackName || '';
      if (text) {
        const size = Math.round((overlayCfg.size || 32) * (W / 1280));
        const pad  = Math.round(W * 0.022);
        octx.save();
        octx.font = '700 ' + size + 'px -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
        octx.fillStyle = overlayCfg.color || '#FFFFFF';
        octx.shadowColor = 'rgba(0,0,0,0.55)';
        octx.shadowBlur = Math.max(4, Math.round(size * 0.28));
        octx.shadowOffsetY = Math.round(size * 0.07);
        const pos = overlayCfg.position || 'bottom-left';
        const vTop    = pos.startsWith('top');
        const hCenter = pos.endsWith('center');
        const hRight  = pos.endsWith('right');
        let x, y;
        if (hCenter) { octx.textAlign = 'center'; x = W / 2; }
        else if (hRight) { octx.textAlign = 'right';  x = W - pad; }
        else             { octx.textAlign = 'left';   x = pad; }
        octx.textBaseline = vTop ? 'top' : 'alphabetic';
        y = vTop ? pad : (H - pad);
        octx.fillText(text, x, y);
        octx.restore();
      }
    }
  }

  // ── MediaRecorder setup ──────────────────────────────────
  const videoStream = canvas.captureStream(cfg.fps || 60);
  streamDest.stream.getAudioTracks().forEach(t => videoStream.addTrack(t));

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
    ? 'video/webm;codecs=vp9,opus'
    : 'video/webm';
  const bitrate = (W * H >= 3840 * 2160) ? 45_000_000
                : (W * H >= 1920 * 1080) ? 20_000_000
                : 10_000_000;
  const rec = new MediaRecorder(videoStream, { mimeType: mime, videoBitsPerSecond: bitrate, audioBitsPerSecond: 256_000 });

  const chunkBase = '/api/render/' + jobId + '/chunk';
  rec.ondataavailable = async (e) => {
    if (!e.data || !e.data.size) return;
    try {
      const form = new FormData();
      form.append('chunk', e.data, 'chunk.webm');
      await fetch(chunkBase, { method: 'POST', body: form });
    } catch (err) {
      console.error('chunk upload failed:', err);
    }
  };

  let finalized = false;
  rec.onstop = async () => {
    if (finalized) return;
    finalized = true;
    await fetch('/api/render/' + jobId + '/finalize', { method: 'POST' });
    log('capture finalized');
    window.__renderDone = true;
  };

  audio.addEventListener('ended', () => {
    log('audio ended → stopping recorder');
    try { rec.stop(); } catch (_) {}
  });

  // ── Loop (rAF) ───────────────────────────────────────────
  let lastReported = -1;
  function loop() {
    renderFrame();
    if (audio.duration > 0) {
      const pct = Math.min(100, (audio.currentTime / audio.duration) * 100);
      const rounded = Math.floor(pct);
      if (rounded !== lastReported) {
        lastReported = rounded;
        fetch('/api/render/' + jobId + '/progress?v=' + rounded, { method: 'POST' }).catch(()=>{});
        log(`recording: ${rounded}% · t=${audio.currentTime.toFixed(1)}/${audio.duration.toFixed(1)}s`);
      }
    }
    requestAnimationFrame(loop);
  }

  // Page is ready — Puppeteer calls __renderStart() to begin
  window.__renderStart = async () => {
    try {
      if (ac.state === 'suspended') await ac.resume();
      rec.start(1000);     // chunk every 1s
      await audio.play();
      loop();
      log('started recording');
    } catch (e) {
      log('start error: ' + e.message);
      console.error(e);
    }
  };
  window.__renderReady = true;
  log('ready');
})().catch(err => {
  const msg = (err && err.message) || String(err);
  const stk = (err && err.stack) || '';
  console.error('[render] fatal message:', msg);
  if (stk) console.error('[render] fatal stack:', stk.split('\n').slice(0, 5).join(' | '));
  document.getElementById('status').textContent = 'FATAL: ' + msg;
  window.__renderError = msg;
});
</script>
</body>
</html>
