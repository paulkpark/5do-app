# Netlify config for Jumping Flash Web (pure static site — no build step).
# When connecting via Git, set "Base directory" to jumping-flash-web in the
# Netlify UI; this file is then picked up from here automatically.

[build]
  publish = "public"
  command = "echo 'no build step'"

# The vendored three.js never changes for a given deploy — cache it hard.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be revalidated or PWA updates never land.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
