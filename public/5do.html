<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>5DO</title>
<link rel="manifest" href="/manifest.webmanifest">

<!-- Supabase UMD -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script>const SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);</script>
<script src="/js/supabase-api.js"></script>
<script src="/js/i18n.js"></script>


<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/player.css">
<link rel="stylesheet" href="/css/generator-metallic.css">
</head>
<body>
	<div id="backdropLayer" aria-hidden="true"></div>
	<div id="backdropDim" aria-hidden="true"></div>
	<div id="appShell">
<header>
  <div class="left-pack">
    <div class="menu-container">
      <div id="menuBtn" class="hamburger"><span></span></div>
      <div id="menuDrop" class="dropdown">
        <a href="https://5dshop.co.kr" target="_blank" rel="noopener" data-i18n="menu.shop">Shop</a>
        <a href="#" class="menu-text" data-txt="faq" data-i18n="menu.faq">FAQ</a>
        <a href="#" class="menu-text" data-txt="manual" data-i18n="menu.manual">Manual</a>
        <a href="#" class="menu-text" data-txt="contact" data-i18n="menu.contact">Contact</a>
        <a href="#" class="menu-text" data-txt="about" data-i18n="menu.about">About</a>
        <a href="#" id="menuBackdrop" data-i18n="menu.backdrop">Backdrop</a>
      </div>
    </div>
    <div class="app-title">5DO</div>
  </div>
  <div class="right-pack">
    <button id="langBtn">KR/EN</button>
  </div>
</header>
<nav class="tab-bar">
  <button id="tabLibrary" class="tab active" data-i18n="tab.library">라이브러리</button>
  <button id="tabGenerator" class="tab" data-i18n="tab.generator">주파수 생성기</button>
</nav>

<main>
  <!-- Library -->
  <section id="pageLibrary">
    <div class="nav-row">
      <button id="btnBack" class="nav-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button id="btnHome" class="nav-btn" title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none"><path d="M3 12l9-8 9 8"/><path d="M9 21V9h6v12"/></svg>
      </button>
      <button id="btnRefresh" class="nav-btn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none"><path d="M21 12a9 9 0 1 0-2.64 6.36"/><path d="M21 12v-6h-6"/></svg>
      </button>
    </div>

   <!-- 검색/필터 -->
<div class="searchbar">
  <div class="search-input-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" data-i18n-placeholder="search.placeholder" placeholder="검색어…" />
    <button id="searchClear" class="search-clear-btn" aria-label="Clear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="search-actions">
    <select id="searchMode" class="search-mode-select">
      <option value="folder" data-i18n="search.mode.folder">폴더</option>
      <option value="track"  data-i18n="search.mode.track">곡명</option>
    </select>
    <button id="searchBtn" class="search-go-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button id="favOnlyBtn" class="fav-filter-btn" title="즐겨찾기만" aria-label="Favorites only">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none"><path d="M12 3l3 6 6 .9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.9 9 9z"/></svg>
    </button>
  </div>
</div>

    <div id="libBrowseView">
<div id="favoritesWrap">
      <div id="favoritesTitle">★ Favorites</div>
      <div id="favoritesStrip"></div>
    </div>

    <div class="strip vstrip" id="strip"></div>
</div>

<div id="libPlayerView" class="hidden">


    <div class="status">
      <div id="statusThumb" class="status-blank"></div>
      <div class="status-meta">
        <div id="metaTitle" class="status-title"></div>
        <div id="metaDesc" class="status-line"></div>
        <div id="metaComposer" class="status-line"></div>
      </div>
    </div>

    <div class="playerbar">
      <!-- 커스텀 프로그레스바 -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="progress-time">
          <span id="timeNow">0:00</span>
          <span id="timeTot">0:00</span>
        </div>
      </div>
      <!-- 아이콘 컨트롤 버튼 -->
      <div class="controls">
        <button id="btnPlay" class="ctrl-btn" title="Play" aria-label="Play">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <button id="btnPause" class="ctrl-btn" title="Pause" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btnLoop" class="ctrl-btn" title="Loop" aria-label="Loop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17,1 21,5 17,9"/><path d="M3,11V9a4,4,0,0,1,4-4h14"/><polyline points="7,23 3,19 7,15"/><path d="M21,13v2a4,4,0,0,1-4,4H3"/></svg>
        </button>
        <button id="btnTimer" class="ctrl-btn" title="Timer" aria-label="Timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><polyline points="12,9 12,13 14,15"/><path d="M9,3h6"/></svg>
        </button>
        <button id="btnPlaylist" class="ctrl-btn" title="Playlists" aria-label="Playlists" onclick="openPlPanel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
        </button>
      </div>
      <audio id="player" playsinline style="display:none;"></audio>
    </div>
    
  
    <!-- Track Info Panel (선곡 설명 영역) -->
    
    <!-- Library Player Oscilloscope -->
    <div class="lib-osc-wrap">
      <canvas id="libOsc"></canvas>
    </div>

<section id="trackInfoPanel" class="track-info-panel">
      <div id="trackInfoTitle" class="track-info-title"></div>
      <div id="trackInfoBody" class="track-info-body track-info-collapsed"></div>
      <button id="trackInfoToggle" class="track-info-toggle" onclick="toggleTrackInfo()">더보기 ▾</button>
    </section>
 

</div>

<!-- Playlist Panel -->
   <div id="plPanel" role="dialog" aria-modal="true" aria-labelledby="plTitle">
   <div id="plHead">
    <div id="plTitle" style="color:#cfe9ff;font-weight:800">Playlists</div>
    <div>
      <button id="plNewBtn" class="btn small">+ New</button>
      <button id="plAddCurrentBtn" class="btn small" data-i18n="pl.addCurrent">Add Current Track</button>
      <button id="plImportBtn" class="btn small">Import</button>
      <button id="plExportBtn" class="btn small">Export</button>
      <button id="plCloseBtn" class="btn small">Close</button>
    </div>
   </div>
 
 <div id="plBody"></div>
  <div id="plFoot">
    <button id="plSaveBtn" class="btn">Save</button>
  </div>
  <div class="pl-controls" id="plControls">
  <button id="plPlayAllBtn" class="pl-icbtn" title="Play playlist">
    <svg viewBox="0 0 24 24" class="pl-ic"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <button id="plPrevBtn" class="pl-icbtn" title="Previous">
    <svg viewBox="0 0 24 24" class="pl-ic"><path d="M6 6h2v12H6zM20 6v12l-10-6z"/></svg>
  </button>

  <button id="plNextBtn" class="pl-icbtn" title="Next">
    <svg viewBox="0 0 24 24" class="pl-ic"><path d="M16 6h2v12h-2zM4 18V6l10 6z"/></svg>
  </button>

  <button id="plShuffleBtn" class="pl-icbtn" title="Shuffle">
    <svg viewBox="0 0 24 24" class="pl-ic">
      <path d="M16 3h5v5h-2V6.41l-3.59 3.59-1.41-1.41L17.59 5H16V3zM3 7h5.5c1.38 0 2.71.55 3.69 1.53l1.28 1.28-1.41 1.41-1.28-1.28A3.25 3.25 0 0 0 8.5 9H3V7zm0 10h5.5c.86 0 1.69-.34 2.3-.95l7.29-7.29 1.41 1.41-7.29 7.29A5.25 5.25 0 0 1 8.5 19H3v-2zm18-1v-2h-2v3h3v-2h-1zm-2.41-2.59L19 13.59V16h-2v-5h5v2h-2.41z"/>
    </svg>
  </button>

  <button id="plLoopBtn" class="pl-icbtn" title="Loop">
    <svg viewBox="0 0 24 24" class="pl-ic">
      <path d="M17 17h-2v-2h4v-4h2v6h-6v-0zM7 7h2v2H5v4H3V7h4zm0 10h10v2H7a4 4 0 0 1-4-4v-3h2v3a2 2 0 0 0 2 2zm10-10H7V5h10a4 4 0 0 1 4 4v3h-2V9a2 2 0 0 0-2-2z"/>
    </svg>
    <span class="pl-badge" id="plLoopBadge">1</span>
  </button>

  <span class="pl-spacer"></span>

  <!-- 기존 버튼들(새목록/내보내기/가져오기/저장/닫기)은 너 UI에 맞게 옆에 두면 됨 -->
</div>

<div id="plToast" class="pl-toast" aria-live="polite">
</div>

   </section>
	


    <!-- Generator -->
<section id="pageGenerator" class="hidden">

  <!-- 오실로스코프 -->
  <div class="osc-wrap" style="padding:14px 14px 0">
    <canvas id="osc"></canvas>
    <div class="osc-toolbar" id="oscToolbar">
      <div class="osc-pop" id="oscPop">
        <div class="osc-swatches" id="oscSwatches"></div>
      </div>
    </div>
  </div>

  <!-- 컨트롤 바 -->
  <div class="gen-control-bar">
    <!-- 색상 피커 -->
    <div class="gen-color-picker" id="genColorPicker">
      <div class="gen-color-current" id="genColorCurrent"></div>
      <div class="gen-color-dropdown" id="genColorDropdown">
        <div class="gen-color-swatch" data-color="#39e3ff" style="background:#39e3ff" title="Neon Blue"></div>
        <div class="gen-color-swatch" data-color="#00ffd5" style="background:#00ffd5" title="Aqua"></div>
        <div class="gen-color-swatch" data-color="#00ff7f" style="background:#00ff7f" title="Neon Green"></div>
        <div class="gen-color-swatch" data-color="#ffd166" style="background:#ffd166" title="Amber"></div>
        <div class="gen-color-swatch" data-color="#ff5ea0" style="background:#ff5ea0" title="Magenta"></div>
        <div class="gen-color-swatch" data-color="#ffffff" style="background:#ffffff" title="White"></div>
      </div>
    </div>
    <!-- Hz 디스플레이 -->
    <div class="gen-hz-display">
      <span id="genHzLabel" class="gen-hz-num">432</span>
      <span class="gen-hz-unit">Hz</span>
    </div>
    <!-- 재생/정지 -->
    <div class="gen-transport">
      <button id="genPlay" class="gen-play-btn" aria-label="Play">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
      <button id="genStop" class="gen-stop-btn" aria-label="Stop">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </button>
    </div>
  </div>

  <!-- 모드 스위치 -->
  <div class="gen-mode-bar">
    <button class="gen-mode-btn active" data-mode="single" data-i18n="gen.mode.single">싱글</button>
    <button class="gen-mode-btn" data-mode="binaural" data-i18n="gen.mode.binaural">바이노럴</button>
    <button class="gen-mode-btn" data-mode="dual" data-i18n="gen.mode.dual">듀얼</button>
  </div>



  <!-- 퀵 프리셋 -->
  <div class="gen-quick-strip">
    <div id="quickPresetChips" class="gen-chips"></div>
  </div>

  <!-- 아코디언 패널 -->
  <div class="gen-panels">

    <!-- 주파수 & 파형 -->
    <details class="gen-panel" open>
      <summary class="gen-panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12 Q5 4 8 12 Q11 20 14 12 Q17 4 20 12 Q22 8 22 12"/></svg>
        <span data-i18n="gen.panel.freq">주파수 / 파형</span>
      </summary>
      <div class="gen-panel-body">
        <div class="gen-field">
          <label class="gen-field-label" data-i18n="gen.frequency">주파수 (Hz)</label>
          <div class="gen-field-row">
            <input id="freqRange" class="gen-slider" type="range" min="0" max="20000" step="1" value="432">
            <input id="freq" class="gen-num-input num-popup-field" type="number" min="0" max="20000" step="0.1" value="432">
            <span class="gen-unit">Hz</span>
          </div>
        </div>
        <div class="gen-field">
          <label class="gen-field-label" data-i18n="gen.waveform">파형</label>
          <div class="gen-waveform-btns">
            <button class="gen-wave-btn active" data-wf="sine" data-i18n="gen.wave.sine">사인파</button>
            <button class="gen-wave-btn" data-wf="square" data-i18n="gen.wave.square">사각파</button>
            <button class="gen-wave-btn" data-wf="triangle" data-i18n="gen.wave.triangle">삼각파</button>
            <button class="gen-wave-btn" data-wf="sawtooth" data-i18n="gen.wave.saw">톱니파</button>
          </div>
          <select id="wf" style="display:none">
            <option value="sine">Sine</option><option value="square">Square</option>
            <option value="triangle">Triangle</option><option value="sawtooth">Saw</option>
          </select>
        </div>
        <div class="gen-field" id="dutyField" style="display:none">
          <label class="gen-field-label" data-i18n="gen.duty">Duty Cycle</label>
          <div class="gen-field-row">
            <input id="duty" class="gen-slider" type="range" min="1" max="100" step="1" value="50">
            <input id="dutyNum" class="gen-num-input num-popup-field" type="number" min="1" max="100" step="1" value="50">
            <span class="gen-unit">%</span>
          </div>
        </div>
        <div class="gen-field" id="binauralField" style="display:none">
          <label class="gen-field-label" data-i18n="gen.diff">Gap (Hz)</label>
          <div class="gen-field-row">
            <input id="binDiff" class="gen-slider" type="range" min="0" max="40" step="0.1" value="4">
            <input id="binDiffNum" class="gen-num-input" type="number" min="0" max="40" step="0.1" value="4">
            <span class="gen-unit">Hz</span>
          </div>
          <input type="checkbox" id="binEnable" style="display:none">
        </div>
        <div class="gen-field" id="dualToneField" style="display:none">
          <label class="gen-field-label">톤 A / 톤 B</label>
          <div class="gen-dual-row">
            <div class="gen-dual-item">
              <span class="gen-dual-label" data-i18n="dual.toneA">톤 A</span>
              <input id="toneA" class="gen-num-input num-popup-field" type="number" min="0" max="20000" step="0.1" value="432">
              <span class="gen-unit">Hz</span>
            </div>
            <div class="gen-dual-item">
              <span class="gen-dual-label" data-i18n="dual.toneB">톤 B</span>
              <input id="toneB" class="gen-num-input num-popup-field" type="number" min="0" max="20000" step="0.1" value="528">
              <span class="gen-unit">Hz</span>
            </div>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px">
            <button id="dualPlay" class="gen-action-btn" data-i18n="dual.play">듀얼 재생</button>
            <button id="dualStop" class="gen-action-btn" data-i18n="dual.stop">정지</button>
          </div>
        </div>
      </div>
    </details>

    <!-- 하모닉스 -->
    <details class="gen-panel">
      <summary class="gen-panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
        <span data-i18n="gen.panel.harm">하모닉스</span>
      </summary>
      <div class="gen-panel-body">
        <div class="gen-toggle-row">
          <label class="gen-field-label" data-i18n="harmonics_enable">활성화</label>
          <label class="gen-switch"><input id="harmEnable" type="checkbox"><span class="gen-switch-track"></span></label>
        </div>
        <div class="gen-field">
          <label class="gen-field-label" data-i18n="harmonics_base">기준</label>
          <select id="harmBase" class="gen-select">
            <option value="fund" data-i18n="harm_base_fund">기본 주파수</option>
            <option value="mid"  data-i18n="harm_base_mid">중간 (x2)</option>
            <option value="high" data-i18n="harm_base_high">고역 (x4)</option>
          </select>
        </div>
        <div class="gen-field">
          <label class="gen-field-label" data-i18n="harm_octaves">옥타브 수</label>
          <select id="harmOct" class="gen-select">
            <option value="0">0</option><option value="1">1</option>
            <option value="2">2</option><option value="3" selected>3</option><option value="4">4</option>
          </select>
        </div>
      </div>
    </details>

    <!-- 출력 -->
    <details class="gen-panel">
      <summary class="gen-panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span data-i18n="gen.panel.output">출력 / 게인</span>
      </summary>
      <div class="gen-panel-body" id="genOutputRow">
        <div class="gen-field">
          <label class="gen-field-label" data-i18n="gen.gain">게인</label>
          <div class="gen-field-row">
            <input id="genGainRange" class="gen-slider" type="range" min="0" max="200" step="1" value="100">
            <input id="genGainNum" class="gen-num-input" type="number" min="0" max="200" step="1" value="100">
            <span class="gen-unit">%</span>
          </div>
        </div>
        <div class="gen-toggle-row">
          <label class="gen-field-label" data-i18n="gen.soft_limiter">소프트 리미터</label>
          <label class="gen-switch"><input id="genLimiterEnable" type="checkbox" checked><span class="gen-switch-track"></span></label>
        </div>
        <!-- oscColor hidden select (JS 호환용) -->
        <select id="oscColor" style="display:none">
          <option value="#39e3ff">Neon Blue</option>
          <option value="#00ffd5">Aqua</option>
          <option value="#00ff7f">Neon Green</option>
          <option value="#ffd166">Amber</option>
          <option value="#ff5ea0">Magenta</option>
          <option value="#ffffff">White</option>
        </select>
      </div>
    </details>

    <!-- 내보내기 & 프리셋 -->
    <details class="gen-panel">
      <summary class="gen-panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span data-i18n="gen.panel.export">내보내기 / 프리셋</span>
      </summary>
      <div class="gen-panel-body">
        <div class="gen-export-row">
          <div class="gen-field">
            <label class="gen-field-label" data-i18n="gen.export_dur">길이(초)</label>
            <input id="genExportDur" class="gen-num-input" type="number" min="1" step="1" value="300">
          </div>
          <div class="gen-field">
            <label class="gen-field-label" data-i18n="gen.fade_in">페이드 인</label>
            <input id="genFadeIn" class="gen-num-input" type="number" min="0" step="0.1" value="2">
          </div>
          <div class="gen-field">
            <label class="gen-field-label" data-i18n="gen.fade_out">페이드 아웃</label>
            <input id="genFadeOut" class="gen-num-input" type="number" min="0" step="0.1" value="2">
          </div>
        </div>

/* ===== FIX: ensure text modal is outside tab containers ===== */
(function ensureGlobalTextModal(){
  const move = ()=>{
    const bd = document.getElementById('backdrop');
    const md = document.getElementById('modal');
    if(!bd || !md) return;

    // If placed inside a hidden tab container, reparent to <body> so it works on all tabs
    if(bd.parentElement !== document.body) document.body.appendChild(bd);
    if(md.parentElement !== document.body) document.body.appendChild(md);

    // Force top layering
    bd.style.position = 'fixed';
    bd.style.inset = '0';
    bd.style.zIndex = '9998';
    md.style.position = 'fixed';
    md.style.zIndex = '9999';
  };

  if(document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', move, {once:true});
  } else {
    move();
  }
})();
/* ===== Shorthands & State ===== */
const $ = (s,r=document)=>r.querySelector(s);
const strip       = $('#strip');
const player      = $('#player');
player.crossOrigin = 'anonymous';
const statusThumb = $('#statusThumb');
const statusTitle = $('#metaTitle');
const infoTitle   = document.getElementById('trackInfoTitle');
const infoBody    = document.getElementById('trackInfoBody');
const STATE = { path:'', stack:[], currentTrack:null, foldersCache:[], tracksCache:{} };
let RENDER_TICK = 0;

function statusBlank(){
  // 로딩(선택 전) 상태로 돌리고, 현재 언어에 맞는 로딩 썸네일을 표시
  statusThumb.dataset.thumbMode = 'loading';
  statusThumb.classList.add('status-blank');
  statusThumb.style.backgroundImage='none';
  refreshLoadingThumbForLang(false);

  statusTitle.classList.remove('playing');
  statusTitle.textContent='';
  $('#metaDesc').textContent='';
  $('#metaComposer').textContent='';

  if(infoTitle) infoTitle.textContent = '';
  if(infoBody)  infoBody.textContent  = '';
}

/* ===== Favorites ===== */
function loadFavs(){ try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]')); }catch{ return new Set(); } }
function saveFavs(set){ localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }
const FAVS = loadFavs();
let FAVORITES_ONLY = false;
function starSvg(){ return '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path d="M12 3l3 6 6 .9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.9 9 9z"/></svg>'; }
function trackId(folder, file){ return (folder? `${folder}/${file}` : file); }

async function renderFavoritesStrip(){
  const wrap   = $('#favoritesWrap');
  const fstrip = $('#favoritesStrip');
  const list   = [...FAVS];

  if(list.length===0){
    wrap.style.display='none';
    fstrip.innerHTML='';
    return;
  }

  wrap.style.display='';
  fstrip.innerHTML='';

  for(const id of list){
    const seg    = id.split('/');
    const folder = seg.length>1 ? seg.slice(0,-1).join('/') : '';
    const file   = seg[seg.length-1];

    const card = document.createElement('div');
    card.className='card fav';

    const th   = document.createElement('div');
    th.className='thumb';
    card.append(th);

    const star = document.createElement('div');
    star.className='star';
    star.innerHTML=starSvg();
    card.append(star);

    const u = folder ? trackThumb(folder, file) : null;
	if (u) th.style.backgroundImage = `url("${u}")`;
    // ★ 즐겨찾기 카드 클릭 시: 재생 + meta 반영
    card.addEventListener('click', async (e)=>{
      if(e.target.closest('.star')) return;  // 별 클릭이면 무시

      const url = mediaObjectUrl(folder, file);

      player.src = url;
      player.load?.();
      setLibMode('player');
      stopLibViz();

      // 썸네일 업데이트
      const u2 = folder ? trackThumb(folder, file) : null;
	if (u2){
  	statusThumb.classList.remove('status-blank');
        statusThumb.dataset.thumbMode = 'track';
 	 setStatusThumb(statusThumb, `${u2}`);
	}

      // 기본 제목 (파일명 기반)
      const baseTitle = stem(file).replace(/[_\-]+/g,' ');

      // meta.json 조회
      const meta = lookupTrackMeta(folder, file);
      let title    = baseTitle;
      let desc     = "";
      let composer = "";

      if (meta){
        title    = getLocalized(meta, 'title') || baseTitle;
        desc     = getLocalized(meta, 'desc');
        composer = meta.composer || getLocalized(meta, 'composer') || "";
      }

      // 상단 상태 바
      statusTitle.textContent = title;
      statusTitle.classList.add('playing');
      if (typeof STATE !== 'undefined'){
        STATE.currentTrack = { name: title, url };
      }

      // info 패널 업데이트
      if (typeof infoTitle !== 'undefined' && infoTitle) infoTitle.textContent = title;
      if (typeof infoBody !== 'undefined' && infoBody){
        const parts = [];
        if (desc)     parts.push(desc);
        if (composer) parts.push(LANG==='ko' ? `작곡: ${composer}` : `Composer: ${composer}`);
        infoBody.textContent = parts.join(' · ');
      }
    });

    // ★ 별 클릭 시 즐겨찾기 토글
    star.addEventListener('click',(e)=>{
      e.stopPropagation();
      const isFav = FAVS.has(id);
      if(isFav){
        FAVS.delete(id);
        card.classList.remove('fav');
      } else {
        FAVS.add(id);
        card.classList.add('fav');
      }
      saveFavs(FAVS);
      renderFavoritesStrip();
    });

    fstrip.appendChild(card);
  }
}

}

function loadAndPlayTrack(track) {

// ===== Track selection (browse -> player) =====
function playSelectedTrack(folder, file){
  const url = mediaObjectUrl(folder, file);
  player.src = url;
  player.load?.();

  // UI: player view로 전환
  setLibMode('player');

  // thumb
  const u2 = trackThumb(folder, file);
  if(u2){
    statusThumb.classList.remove('status-blank');
        statusThumb.dataset.thumbMode = 'track';
    setStatusThumb(statusThumb, u2);
  }

  // meta
  const baseTitle = prettyName(stem(file));
  const meta = lookupTrackMeta(folder, file);

  let title = baseTitle;
  let desc = "";
  let composer = "";

  if(meta){
    title    = getLocalized(meta, 'title') || baseTitle;
    desc     = getLocalized(meta, 'desc');
    composer = meta.composer || getLocalized(meta, 'composer') || "";
  }

  statusTitle.textContent = title;
  statusTitle.classList.add('playing');
  document.getElementById('metaDesc').textContent = desc || '';
  document.getElementById('metaComposer').textContent = composer ? (LANG==='ko'?`작곡: ${composer}`:`Composer: ${composer}`) : '';

  if(infoTitle) infoTitle.textContent = title;
  if(infoBody){
    const parts = [];
    if(desc) parts.push(desc);
    if(composer) parts.push(LANG==='ko'?`작곡: ${composer}`:`Composer: ${composer}`);
    infoBody.textContent = parts.join(' · ');
  }

  STATE.currentTrack = { name: title, url, folder, file };

  // NOTE: do NOT autoplay; wait for user to press Play
  stopLibViz();
}

async function renderStrip(){
  const myTick = ++RENDER_TICK;
  strip.innerHTML='';

  // 폴더 루트
  if(!STATE.path){
    setLibMode('folders');

    await renderFavoritesStrip();
    if(myTick !== RENDER_TICK) return;

    if(!STATE.foldersCache.length) STATE.foldersCache = await listRoot();

    for(const name of STATE.foldersCache){
      if(myTick !== RENDER_TICK) return;

      const row = document.createElement('div');
      row.className = 'v-item folder';

      const th = document.createElement('div');
      th.className = 'v-thumb';
      th.style.backgroundImage = `url("${folderThumb(name)}")`;

      const meta = document.createElement('div');
      meta.className = 'v-meta';

      const title = document.createElement('div');
      title.className = 'v-title';
      title.textContent = prettyName(name);

      const sub = document.createElement('div');
      sub.className = 'v-sub';
      sub.textContent = (LANG==='ko') ? '카테고리 열기' : 'Open category';

      meta.append(title, sub);
      row.append(th, meta);

      row.addEventListener('click', ()=>{
        STATE.path = name;
        statusBlank();
        renderStrip();
      });

      strip.appendChild(row);
    }
    return;
  }

  // 폴더 내부(트랙 리스트)
  setLibMode('tracks');

  const files = await listTracks(STATE.path);
  for(const f of files){
    if(myTick !== RENDER_TICK) return;

    if (FAVORITES_ONLY) {
      const id = trackId(STATE.path, f);
      if (!FAVS.has(id)) continue;
    }

    const row = document.createElement('div');
    row.className = 'v-item track' + (FAVS.has(trackId(STATE.path, f)) ? ' fav' : '');

    const th = document.createElement('div');
    th.className = 'v-thumb';
    th.style.backgroundImage = `url("${trackThumb(STATE.path, f)}")`;

    const metaBox = document.createElement('div');
    metaBox.className = 'v-meta';

    const baseTitle = prettyName(stem(f));
    const meta = lookupTrackMeta(STATE.path, f);

    const title = document.createElement('div');
    title.className = 'v-title';
    title.textContent = (meta ? (getLocalized(meta,'title') || baseTitle) : baseTitle);

    const sub = document.createElement('div');
    sub.className = 'v-sub';
    const desc = meta ? (getLocalized(meta,'desc') || '') : '';
    const composer = meta ? (meta.composer || getLocalized(meta,'composer') || '') : '';
    const composerTxt = composer ? (LANG==='ko'?`작곡: ${composer}`:`Composer: ${composer}`) : '';
    sub.textContent = [desc, composerTxt].filter(Boolean).join(' · ');

    metaBox.append(title, sub);

    const star = document.createElement('div');
    star.className = 'star';
    star.innerHTML = starSvg();

    // row click = play
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.star')) return;
      playSelectedTrack(STATE.path, f);
    });

    // star click = fav toggle
    star.addEventListener('click',(e)=>{
      e.stopPropagation();
      const id = trackId(STATE.path, f);
      const isFav = FAVS.has(id);
      if(isFav){ FAVS.delete(id); row.classList.remove('fav'); }
      else { FAVS.add(id); row.classList.add('fav'); }
      saveFavs(FAVS);
      renderFavoritesStrip();
    });

    row.append(th, metaBox, star);
    strip.appendChild(row);
  }
}

      const th   = document.createElement('div'); th.className='thumb'; card.append(th);
      const u = await folderThumb(name);

      card.addEventListener('click',()=>{ STATE.stack.push(''); STATE.path=name; statusBlank(); renderStrip(); });
      strip.appendChild(card);
    }
  }else{
    if(!STATE.foldersCache.length) STATE.foldersCache = await listRoot();
    for(const folder of STATE.foldersCache){
      const tracks = await listTracks(folder);
      for(const f of tracks){
        if(stem(f).toLowerCase().includes(q)){
          const card = document.createElement('div'); card.className='card';
          const th   = document.createElement('div'); th.className='thumb'; card.append(th);
          const u = await trackThumb(folder, f); if(u) th.style.backgroundImage=`url("${u}")`;
          card.addEventListener('click', async ()=>{
            STATE.path = folder;
            const url = `${MEDIA_BASE}/${encodeURIComponent(folder)}/${encodeURIComponent(f)}`;
            player.src = url; player.load?.();
            const u2 = await trackThumb(folder, f);
            if(u2){ statusThumb.classList.remove('status-blank');
        statusThumb.dataset.thumbMode = 'track';
            setStatusThumb(statusThumb, `${u2}`); }
            statusTitle.textContent = stem(f).replace(/[_\-]+/g,' ');
            statusTitle.classList.add('playing');
            STATE.currentTrack = { name: stem(f), url };
          });
          strip.appendChild(card);
        }
      }
    }
  }
});

$('#langBtn').addEventListener('click',()=>{
  LANG = (LANG==='en'?'ko':'en');
  applyLang();

  // ✅ 언어 토글은 현재 화면을 유지한다.
  // - 플레이어 화면에서는 라이브러리 스트립을 재렌더하면 모드가 folders/tracks로 바뀌어버리므로 금지.

  if(STATE.uiMode !== 'player'){

  }else{
    // 플레이어 화면에서는 현재 트랙 메타 텍스트만 갱신 (applyLang이 대부분 처리)
    // 필요 시: infoPanel / metaTitle 같은 텍스트가 비어있다면 보강
    try{
      if(STATE.currentTrack && STATE.currentTrack.folder && STATE.currentTrack.file){
        const meta = lookupTrackMeta(STATE.currentTrack.folder, STATE.currentTrack.file);
        const baseTitle = (STATE.currentTrack.file||'').replace(/\.[^/.]+$/,'');
        const title = meta ? (getLocalized(meta,'title') || baseTitle) : (STATE.currentTrack.name || baseTitle);
        const desc  = meta ? (getLocalized(meta,'desc')  || '') : '';
        const composer = meta ? (meta.composer || getLocalized(meta,'composer') || '') : '';
        const titleEl = document.getElementById('metaTitle');
        const compEl  = document.getElementById('metaComposer');
        if(titleEl) titleEl.textContent = title;
        if(compEl)  compEl.textContent  = composer ? (LANG==='ko'?`작곡: ${composer}`:`Composer: ${composer}`) : '';
        if(infoTitle) infoTitle.textContent = title;
        if(infoBody){
          const parts = [];
          if(desc) parts.push(desc);
          if(composer) parts.push(LANG==='ko'?`작곡: ${composer}`:`Composer: ${composer}`);
          infoBody.textContent = parts.join(' · ');
      // ✅ 플레이어 화면: 선택된 트랙 썸네일도 현재 LANG에 맞게 즉시 교체 (name_E.webp)
      if (STATE.currentTrack && STATE.currentTrack.folder && STATE.currentTrack.file){
        const f = STATE.currentTrack.file;
        const folder = STATE.currentTrack.folder;
        const el = document.getElementById('statusThumb');
        if (el){
          const primary = trackThumb(folder, f); // uses LANG
          const alt = (LANG === 'en')
            ? primary.replace(/_E\.webp/i, '.webp')
            : primary.replace(/\.webp/i, '_E.webp');
          const img = new Image();
          img.onload = ()=>{ el.classList.remove('status-blank'); setStatusThumb(el, primary); };
          img.onerror = ()=>{
            const img2 = new Image();
            img2.onload = ()=>{ el.classList.remove('status-blank'); setStatusThumb(el, alt); };
            img2.onerror = ()=>{};
            img2.src = alt;
          };
          img.src = primary;
        }
      }

        }
      }
    }catch(e){}
  }
});

/* ===== Menu text modals (FAQ/Manual/Contact/About) - robust =====
   - Works on GitHub Pages (including /repo/ subpaths)
   - Works on local servers (http://localhost/...)
   - If opened via file://, fetch will be blocked by CORS; we show a clear hint.
*/
async function fetchMenuText(key){
  const cleanKey = String(key||'').trim().replace(/[^a-z0-9_\-]/gi,'');
  if(!cleanKey) throw new Error('invalid key');

  // Build correct URL relative to THIS HTML, so /repo/ deployments work.
  const urlObj = new URL(`texts/${encodeURIComponent(cleanKey)}.txt`, location.href);
  urlObj.searchParams.set('v', Date.now());

  const res = await fetch(urlObj.toString(), { cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.text();
}

// Event delegation: menu DOM can change and still works.
if(!window.__MENU_TEXT_DELEGATED__){
  window.__MENU_TEXT_DELEGATED__ = true;

  // Backdrop menu item -> open backdrop panel
  const menuBackdropEl = document.getElementById('menuBackdrop');
  if(menuBackdropEl){
    menuBackdropEl.addEventListener('click', (e)=>{
      e.preventDefault();
      try{ menuDrop.style.display='none'; }catch(_){}
      if(typeof openBackdropPanel === 'function') openBackdropPanel();
    });
  }

  // Text modals
  menuDrop.addEventListener('click', async (e)=>{
    const a = e.target.closest('a.menu-text');
    if(!a) return;
    e.preventDefault();

function formatTime(s){
  if(isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m+':'+(sec<10?'0':'')+sec;
}
(function initProgressBar(){
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const thumb = document.getElementById('progressThumb');
  const timeNow = document.getElementById('timeNow');
  const timeTot = document.getElementById('timeTot');
  if(!bar || !fill) return;

  player.addEventListener('timeupdate', ()=>{
    if(!player.duration) return;
    const pct = (player.currentTime / player.duration) * 100;
    fill.style.width = pct + '%';
    thumb.style.left = pct + '%';
    if(timeNow) timeNow.textContent = formatTime(player.currentTime);
  });
  player.addEventListener('loadedmetadata', ()=>{
    if(timeTot) timeTot.textContent = formatTime(player.duration);
  });
  player.addEventListener('durationchange', ()=>{
    if(timeTot) timeTot.textContent = formatTime(player.duration);
  });

  bar.addEventListener('click', (e)=>{
    if(!player.duration) return;
    const rect = bar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    player.currentTime = pct * player.duration;
  });
})();

function drawOsc(){
  const W=cvs.width= cvs.clientWidth; const H=cvs.height = cvs.clientHeight;
  ctx2d.clearRect(0,0,W,H);
  if(!analyser){ cancelAnimationFrame(rafId); return; }
  const color = document.getElementById('oscColor').value;
 
  const buf = new Uint8Array(1024); analyser.getByteTimeDomainData(buf);
  ctx2d.lineWidth=line; ctx2d.strokeStyle=color; ctx2d.beginPath();
  const step = Math.max(1, Math.floor(buf.length/(W/zoom))); let x=0;
  for(let i=0;i<buf.length;i+=step){
    const t = Math.pow(buf[i]/255, gamma);
    const y = t*H;
    if(i===0) ctx2d.moveTo(x,y); else ctx2d.lineTo(x,y);
    x += zoom; if(x>W) break;
  }
  ctx2d.stroke();
  rafId = requestAnimationFrame(drawOsc);
}
function clearOsc(){ cancelAnimationFrame(rafId); ctx2d.clearRect(0,0,cvs.width,cvs.height); }

function stopGen(){
  try{ oscNodes.forEach(n=>{ try{n.stop()}catch{} try{n.node?.stop?.()}catch{} }); }catch{}
  try{ oscNodes.forEach(n=> n.disconnect && n.disconnect()); }catch{}
  oscNodes=[];
  if(analyser){ try{ analyser.disconnect(); }catch{} analyser=null; }
  clearOsc();
  GEN_PLAYING=false;
}

function _readGenGain(){
  const r = document.getElementById('genGainRange');
  const n = document.getElementById('genGainNum');
  let v = 100;
  if(n && n.value!=='' ) v = Number(n.value);
  else if(r) v = Number(r.value);
  if(!isFinite(v)) v = 100;
  v = Math.max(0, Math.min(200, v));
  if(r) r.value = String(v);
  if(n) n.value = String(v);
  GEN_GAIN = v/100;
  return GEN_GAIN;
}
function _readGenLimiter(){
  const cb = document.getElementById('genLimiterEnable');
  GEN_LIMITER_ON = cb ? !!cb.checked : true;
  return GEN_LIMITER_ON;
}
function _applyGenOutputNodes(ctx, inputNode){
  // inputNode -> analyser -> masterGain -> (limiter?) -> destination
  GEN_MASTER_GAIN_NODE = ctx.createGain();
  GEN_MASTER_GAIN_NODE.gain.value = _readGenGain();

  const analyserNode = analyser; // already created in playGen
  inputNode.connect(analyserNode);

  analyserNode.connect(GEN_MASTER_GAIN_NODE);

  if(_readGenLimiter()){
    // Limiter-like compressor (soft limiting)
    GEN_LIMITER_NODE = ctx.createDynamicsCompressor();
    GEN_LIMITER_NODE.threshold.value = -6;  // dB
    GEN_LIMITER_NODE.knee.value = 6;        // dB
    GEN_LIMITER_NODE.ratio.value = 20;      // strong
    GEN_LIMITER_NODE.attack.value = 0.003;  // seconds
    GEN_LIMITER_NODE.release.value = 0.25;  // seconds

    GEN_MASTER_GAIN_NODE.connect(GEN_LIMITER_NODE);
    GEN_LIMITER_NODE.connect(ctx.destination);
  }else{
    GEN_LIMITER_NODE = null;
    GEN_MASTER_GAIN_NODE.connect(ctx.destination);
  }
}
/* ===================================================
   🎵 OPTIMIZED playGen — 음질 최적화 버전
   1. Band-limited pulse (polyBLEP via PeriodicWave)
   2. Freq/Duty param ramping (스무딩, 클릭 방지)
   3. DC block HPF (10 Hz)
   4. LF enhance 옵션 (저주파 가청 보강)
   =================================================== */

// polyBLEP band-limited 사각파/펄스 파형 생성
function _makeBandLimitedSquare(ctx, freq, dutyRatio) {
  const sr   = ctx.sampleRate;
  const size = 4096;
  const real = new Float32Array(size);
  const imag = new Float32Array(size);

  // Fourier 급수로 band-limited pulse 합성
  // duty = 0.5 → 대칭 사각파, 0~1 범위
  const d = Math.max(0.01, Math.min(0.99, dutyRatio));
  const nyquist = sr / 2;
  const maxHarm = Math.floor(nyquist / Math.max(freq, 1));

  for (let k = 1; k <= Math.min(maxHarm, size / 2 - 1); k++) {
    // k번째 하모닉의 진폭 (duty-cycle pulse Fourier 계수)
    const amp = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * d);
    // DC 제거를 위해 real[0] = 0 유지
    imag[k] = -amp; // sin 기반 (cosine phase 없음)
  }

  return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}

// 톱니파 band-limited (aliasing 감소)
function _makeBandLimitedSaw(ctx, freq) {
  const sr   = ctx.sampleRate;
  const size = 4096;
  const real = new Float32Array(size);
  const imag = new Float32Array(size);
  const nyquist = sr / 2;
  const maxHarm = Math.floor(nyquist / Math.max(freq, 1));

  for (let k = 1; k <= Math.min(maxHarm, size / 2 - 1); k++) {
    imag[k] = -(1 / k); // 표준 톱니 스펙트럼
  }
  return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}

// DC block: 10 Hz 1차 HPF
function _addDCBlock(ctx, node) {
  const hpf = ctx.createBiquadFilter();
  hpf.type = 'highpass';
  hpf.frequency.value = 10;
  hpf.Q.value = 0.5;
  node.connect(hpf);
  return hpf;
}

// LF enhance: 저주파를 AM 캐리어(200 Hz)로 변조하여 체감 향상
function _addLFEnhance(ctx, oscFreq, sourceNode, gainVal) {
  if (oscFreq > 80) return null; // 80 Hz 이하에서만 적용
  const carrierFreq = 200;
  const carrier = ctx.createOscillator();
  carrier.type = 'sine';
  carrier.frequency.value = carrierFreq;

  const amGain = ctx.createGain();
  amGain.gain.value = 0;
  carrier.connect(amGain.gain);
  sourceNode.connect(amGain);
  carrier.start();
  oscNodes.push(carrier);

  const enhGain = ctx.createGain();
  enhGain.gain.value = gainVal * 0.35; // 원음보다 약하게
  amGain.connect(enhGain);
  return enhGain;
}

function playGen(){
  if(!aCtx) aCtx = new (window.AudioContext||window.webkitAudioContext)();
  stopGen();

  const wf   = document.getElementById('wf').value;
  const f0   = parseFloat(document.getElementById('freq').value) || 0;
  // GEN_MODE: 'single' | 'binaural' | 'dual'
  const isSingle   = (GEN_MODE === 'single');
  const isBinaural = (GEN_MODE === 'binaural');
  const isDual     = (GEN_MODE === 'dual');
  const bina = isBinaural;
  const diff = parseFloat(document.getElementById('binDiff').value) || 0;
  const duty = Math.max(1, Math.min(100, parseInt(document.getElementById('duty').value || '50', 10)));
  const hEn  = document.getElementById('harmEnable').checked;
  const hBase= document.getElementById('harmBase').value;
  const hOct = parseInt(document.getElementById('harmOct').value || '0', 10);

  const baseMul  = (hBase === 'mid' ? 2 : (hBase === 'high' ? 4 : 1));
  const baseFreq = f0 * baseMul;

  const merger = aCtx.createChannelMerger(2);
  analyser = aCtx.createAnalyser();
  analyser.fftSize = 2048;

  // ── 오실레이터 생성 (band-limited) ──
  const mkOsc = (freq) => {
    const clampedFreq = Math.max(0.01, freq);
    const o = aCtx.createOscillator();

    if (wf === 'square') {
      // ✅ Band-limited pulse (polyBLEP 대체)
      const dutyRatio = duty / 100;
      o.setPeriodicWave(_makeBandLimitedSquare(aCtx, clampedFreq, dutyRatio));
    } else if (wf === 'sawtooth') {
      // ✅ Band-limited saw
      o.setPeriodicWave(_makeBandLimitedSaw(aCtx, clampedFreq));
    } else {
      o.type = wf; // sine / triangle (이미 band-limited)
    }

    // ✅ freq ramping: 즉시 점프 대신 20ms 슬라이드
    o.frequency.setTargetAtTime(clampedFreq, aCtx.currentTime, 0.02);

    const g = aCtx.createGain();
    // ✅ gain ramp-in: 클릭 방지 (5ms fade-in)
    g.gain.setValueAtTime(0, aCtx.currentTime);
    g.gain.linearRampToValueAtTime(1.0, aCtx.currentTime + 0.005);

    // ✅ DC block HPF 삽입
    const dcBlock = _addDCBlock(aCtx, o);
    dcBlock.connect(g);

    return { osc: o, node: g };
  };

  const gens = [];
  const mixerMode = isDual;

  // ── 1) 듀얼 톤 모드 ──
  if (mixerMode) {
    const fA = parseFloat(document.getElementById('toneA')?.value || '0') || 0;
    const fB = parseFloat(document.getElementById('toneB')?.value || '0') || 0;
    if (!fA && !fB) return;

    const oA = mkOsc(fA || fB);
    const oB = mkOsc(fB || fA);
    oA.node.connect(merger, 0, 0);
    oB.node.connect(merger, 0, 1);
    gens.push(oA, oB);

    _applyGenOutputNodes(aCtx, merger);
    gens.forEach(g => { try { g.osc.start(); } catch(e){} oscNodes.push(g.osc); });
    drawOsc();
    return;
  }

  // ── 2) 단일톤 + 바이노럴 + 하모닉 ──
  const leftBase  = baseFreq;
  const rightBase = bina ? Math.max(0.01, baseFreq + diff) : baseFreq;

  const buildChannel = (base, chIndex) => {
    const baseGen = mkOsc(base);
    gens.push(baseGen);

    // ✅ LF enhance (80Hz 이하 저주파 보강)
    const lfNode = _addLFEnhance(aCtx, base, baseGen.node, 1.0);
    if (lfNode) {
      lfNode.connect(merger, 0, chIndex);
    }

    if (hEn) {
      for (let k = 1; k <= hOct; k++) {
        const harmFreq = base * Math.pow(2, k);
        const hg = mkOsc(harmFreq);
        // 하모닉은 음량 줄임 (-6dB per octave)
        hg.node.gain.setTargetAtTime(1 / (k + 1), aCtx.currentTime, 0.02);
        gens.push(hg);
      }
    }

    const sliceCount = hEn ? (1 + hOct) : 1;
    gens.slice(-sliceCount).forEach(g => g.node.connect(merger, 0, chIndex));
  };

  buildChannel(leftBase,  0);
  buildChannel(rightBase, 1);

  _applyGenOutputNodes(aCtx, merger);
  gens.forEach(g => { try { g.osc.start(); } catch(e){} oscNodes.push(g.osc); });

  GEN_PLAYING = true;
  drawOsc();
}

/* ===== Generator WAV Export (Offline Render) ===== */
function _clampNum(x, lo, hi, dflt){
  const n = Number(x);
  if(!isFinite(n)) return dflt;
  return Math.min(hi, Math.max(lo, n));
}
function audioBufferToWav16(buffer){
  const numCh = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length;
  const bytesPerSample = 2;
  const blockAlign = numCh * bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = length * blockAlign;
  const bufferSize = 44 + dataSize;

  const ab = new ArrayBuffer(bufferSize);
  const view = new DataView(ab);

  let offset = 0;
  function writeStr(s){
    for(let i=0;i<s.length;i++) view.setUint8(offset++, s.charCodeAt(i));
  }
  function writeU32(v){ view.setUint32(offset, v, true); offset += 4; }
  function writeU16(v){ view.setUint16(offset, v, true); offset += 2; }

  // RIFF header
  writeStr('RIFF'); writeU32(36 + dataSize); writeStr('WAVE');

  // fmt chunk
  writeStr('fmt '); writeU32(16);
  writeU16(1);                 // PCM
  writeU16(numCh);
  writeU32(sampleRate);
  writeU32(byteRate);
  writeU16(blockAlign);
  writeU16(16);                // bits

  // data chunk
  writeStr('data'); writeU32(dataSize);

  // interleave + float->int16
  const chans = [];
  for(let ch=0; ch<numCh; ch++) chans.push(buffer.getChannelData(ch));

  for(let i=0;i<length;i++){
    for(let ch=0; ch<numCh; ch++){
      let v = chans[ch][i];
      v = Math.max(-1, Math.min(1, v));
      const s = v < 0 ? (v * 0x8000) : (v * 0x7FFF);
      view.setInt16(offset, s, true);
      offset += 2;
    }
  }
  return new Blob([ab], {type:'audio/wav'});
}

async function renderGeneratorToWavBlob(opts){
  const durationSec = _clampNum(opts?.durationSec, 1, 60*60, 300);
  const fadeInSec   = _clampNum(opts?.fadeInSec, 0, durationSec, 2);
  const fadeOutSec  = _clampNum(opts?.fadeOutSec, 0, durationSec, 2);

  const wf   = document.getElementById('wf')?.value || 'sine';
  const f0   = parseFloat(document.getElementById('freq')?.value)||0;
  const bina = !!document.getElementById('binEnable')?.checked;
  const diff = parseFloat(document.getElementById('binDiff')?.value)||0;
  const duty = Math.max(1, Math.min(100, parseInt(document.getElementById('duty')?.value||'50',10)));
  const hEn  = !!document.getElementById('harmEnable')?.checked;
  const hBase= document.getElementById('harmBase')?.value || 'fund';
  const hOct = parseInt(document.getElementById('harmOct')?.value||'0',10);

  const baseMul  = (hBase==='mid'?2:(hBase==='high'?4:1));
  const baseFreq = f0 * baseMul;

  const sampleRate = 44100;
  const frameCount = Math.floor(sampleRate * durationSec);
  const oCtx = new OfflineAudioContext(2, frameCount, sampleRate);

  const merger = oCtx.createChannelMerger(2);

  const master = oCtx.createGain();
  master.gain.setValueAtTime(1, 0);

  // fade envelope
  const t0 = 0;
  const tInEnd = Math.min(durationSec, fadeInSec);
  const tOutStart = Math.max(0, durationSec - fadeOutSec);

  if(fadeInSec > 0){
    master.gain.setValueAtTime(0, t0);
    master.gain.linearRampToValueAtTime(1, tInEnd);
  }
  if(fadeOutSec > 0){
    master.gain.setValueAtTime(1, Math.max(tInEnd, tOutStart));
    master.gain.linearRampToValueAtTime(0, durationSec);
  }

  merger.connect(master);
  const outGain = oCtx.createGain();
  // apply UI gain (0~2.0). NOTE: fade envelope is on 'master'
  outGain.gain.setValueAtTime(GEN_GAIN || 1.0, 0);
  if (GEN_LIMITER_ON){
    const lim = oCtx.createDynamicsCompressor();
    lim.threshold.value = -6;
    lim.knee.value = 6;
    lim.ratio.value = 20;
    lim.attack.value = 0.003;
    lim.release.value = 0.25;
    master.connect(outGain);
    outGain.connect(lim);
    lim.connect(oCtx.destination);
  } else {
    master.connect(outGain);
    outGain.connect(oCtx.destination);
  }

  const mkOsc = (freq)=>{
    const o = oCtx.createOscillator();
    // NOTE: custom duty square uses PWM (sawtooth + comparator)
    if(wf==='square') o.type = 'sawtooth';
    else o.type = (wf==='triangle'?'triangle':(wf==='sawtooth'?'sawtooth':'sine'));
    o.frequency.value = Math.max(0,freq);
    let node = o;

    // custom duty for square (same logic as live)
    if(wf==='square'){
      const shaper = oCtx.createWaveShaper();
      const curve = new Float32Array(256);
      const th = (duty/100)*2-1;
      for(let i=0;i<256;i++){
        const x=i/128-1;
        curve[i] = (x<th)? -1 : 1;
      }
      shaper.curve = curve;
      o.connect(shaper);
      node = shaper;
    }

    const g = oCtx.createGain();
    g.gain.value = 1.0;
    node.connect(g);
    return { osc:o, node:g };
  };

  const gens = [];
    const fA_in = parseFloat(document.getElementById('toneA')?.value || '0') || 0;
  const fB_in = parseFloat(document.getElementById('toneB')?.value || '0') || 0;
  const useDualChk = !!document.getElementById('genExportUseDual')?.checked;
  const mixerMode = (window.__dualMode__ === true) || useDualChk;

  // Dual-tone export mode (stereo A->L, B->R)
  if(mixerMode){
    const fA = parseFloat(document.getElementById('toneA')?.value || '0') || 0;
    const fB = parseFloat(document.getElementById('toneB')?.value || '0') || 0;
    if(!fA && !fB) return audioBufferToWav16(await oCtx.startRendering()); // silent

    const leftFreq  = (fA || fB) * baseMul;
    const rightFreq = (fB || fA) * baseMul;

    const L = mkOsc(leftFreq);
    const R = mkOsc(rightFreq);
    gens.push(L,R);

    L.node.connect(merger,0,0);
    R.node.connect(merger,0,1);

    gens.forEach(g=> g.osc.start(0));
    const buf = await oCtx.startRendering();
    return audioBufferToWav16(buf);
  }

  // Normal mode
  const leftBase  = baseFreq;
  const rightBase = bina ? Math.max(0, baseFreq + diff) : baseFreq;

  const buildChannel = (base, chIndex)=>{
    const baseGen = mkOsc(base);
    gens.push(baseGen);

    if(hEn){
      for(let k=1;k<=hOct;k++){
        gens.push(mkOsc(base*Math.pow(2,k)));
      }
    }

    const sliceCount = (hEn ? (1+hOct) : 1);
    gens.slice(-sliceCount).forEach(g=> g.node.connect(merger,0,chIndex));
  };

  buildChannel(leftBase, 0);
  buildChannel(rightBase,1);

  gens.forEach(g=> g.osc.start(0));

  const rendered = await oCtx.startRendering();
  return audioBufferToWav16(rendered);
}

function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

function _safeFilePart(s){
  return String(s||'').replace(/[^\w\-]+/g,'_').slice(0,50);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const btn = document.getElementById('genExportWav');
  if(!btn) return;

  btn.addEventListener('click', async ()=>{
    try{
      const dur = document.getElementById('genExportDur')?.value || 300;
      const fi  = document.getElementById('genFadeIn')?.value || 0;
      const fo  = document.getElementById('genFadeOut')?.value || 0;

      btn.disabled = true;
      btn.style.opacity = '0.6';

      const blob = await renderGeneratorToWavBlob({
        durationSec: dur,
        fadeInSec: fi,
        fadeOutSec: fo
      });

      const wf = document.getElementById('wf')?.value || 'sine';
      const f0 = document.getElementById('freq')?.value || '0';
      const name = `5DO_${_safeFilePart(wf)}_${_safeFilePart(f0)}Hz_${_safeFilePart(dur)}s.wav`;
      downloadBlob(blob, name);
    }catch(e){
      console.warn('[WAV export] failed', e);
      alert(LANG==='en' ? 'WAV export failed. Check console.' : 'WAV 내보내기에 실패했습니다. 콘솔을 확인하세요.');
    }finally{
      btn.disabled = false;
      btn.style.opacity = '';
    }
  });
});





/* ===== Generator Presets (SAVE/LOAD/MANAGE + QUICK PRESETS) ===== */
const GEN_PRESET_KEY = 'fiveDO_gen_presets_v1';

function _isObj(x){ return x && typeof x === 'object'; }
function _isoNow(){ return new Date().toISOString(); }

function loadGenPresets(){
  try{
    const raw = localStorage.getItem(GEN_PRESET_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){
    console.warn('[gen preset] load failed', e);
    return [];
  }
}
function saveGenPresets(arr){
  try{
    localStorage.setItem(GEN_PRESET_KEY, JSON.stringify(arr));
  }catch(e){
    console.warn('[gen preset] save failed', e);
  }
}

function ensurePresetShape(p){
  if(!_isObj(p)) return null;
  if(!p.id) p.id = 'gp_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  if(!p.name) p.name = p.id;
  if(!_isObj(p.params)) p.params = {};
  if(typeof p.isQuick !== 'boolean') p.isQuick = false;
  if(!p.createdAt) p.createdAt = _isoNow();
  if(!p.updatedAt) p.updatedAt = p.createdAt;
  return p;
}

function getPresetDisplayName(p){
  // if a preset provides a nameKey (e.g., built-in quick presets), show localized label
  if(p && p.nameKey && I18N && I18N[LANG] && I18N[LANG][p.nameKey]) return I18N[LANG][p.nameKey];
  return (p && p.name) ? p.name : 'Preset';
}

function captureGenParams(){
  const num = (id, fb=0) => {
    const el = document.getElementById(id);
    const v = el ? parseFloat(el.value) : fb;
    return Number.isFinite(v) ? v : fb;
  };
  const str = (id, fb='') => {
    const el = document.getElementById(id);
    return el ? (el.value ?? fb) : fb;
  };
  const bool = (id) => {
    const el = document.getElementById(id);
    return !!(el && el.checked);
  };

  return {
    wf: str('wf','sine'),
    freq: num('freq', 432),
    duty: num('dutyNum', 50),
    binaural: bool('binEnable'),
    diff: num('binDiff', 4),
    harmEnable: bool('harmEnable'),
    harmBase: str('harmBase','fund'),
    harmOct: num('harmOct', 1),
    oscColor: str('oscColor', '#39e3ff')
  };
}

function applyGenParams(p){
  if(!p) return;

  const setVal = (id, v) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.value = v;
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  };
  const setCheck = (id, v) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.checked = !!v;
    el.dispatchEvent(new Event('change', {bubbles:true}));
  };

  setVal('wf', p.wf ?? 'sine');

  // freq / freqRange sync
  setVal('freq', p.freq ?? 432);
  setVal('freqRange', p.freq ?? 432);

  // duty / dutyNum sync
  setVal('dutyNum', p.duty ?? 50);
  setVal('duty', p.duty ?? 50);

  setCheck('binEnable', !!p.binaural);
  setVal('binDiff', p.diff ?? 4);

  setCheck('harmEnable', !!p.harmEnable);
  setVal('harmBase', p.harmBase ?? 'fund');
  setVal('harmOct', p.harmOct ?? 1);

  if(p.oscColor) setVal('oscColor', p.oscColor);

  // if generator is currently running, reflect immediately
  try{
    if(typeof aCtx !== 'undefined' && aCtx && aCtx.state === 'running'){
      playGen();
    }
  }catch(e){}
}

/* --- Built-in quick presets bootstrap (migrate hardcoded chips to editable presets) --- */
function ensureBuiltinQuickPresets(){
  const presets = loadGenPresets().map(ensurePresetShape).filter(Boolean);

  const builtins = [
    { id:'qp_528',    nameKey:'qp.528',      params:{ wf:'sine', freq:528, duty:50, binaural:false, diff:4, harmEnable:false, harmBase:'fund', harmOct:1 }, isQuick:true, builtIn:true },
    { id:'qp_432',    nameKey:'qp.432',      params:{ wf:'sine', freq:432, duty:50, binaural:false, diff:4, harmEnable:false, harmBase:'fund', harmOct:1 }, isQuick:true, builtIn:true },
    { id:'qp_174',    nameKey:'qp.174',      params:{ wf:'sine', freq:174, duty:50, binaural:false, diff:4, harmEnable:false, harmBase:'fund', harmOct:1 }, isQuick:true, builtIn:true },
    { id:'qp_sch',    nameKey:'qp.schumann', params:{ wf:'sine', freq:7.83, duty:50, binaural:false, diff:4, harmEnable:false, harmBase:'fund', harmOct:1 }, isQuick:true, builtIn:true },
    { id:'qp_g40',    nameKey:'qp.gamma40',  params:{ wf:'sine', freq:40, duty:50, binaural:false, diff:4, harmEnable:false, harmBase:'fund', harmOct:1 }, isQuick:true, builtIn:true },
  ];

  let changed = false;
  for(const b of builtins){
    const hit = presets.find(x => x.id === b.id);
    if(!hit){
      presets.push(ensurePresetShape({
        id: b.id,
        name: b.nameKey,      // fallback (if not localized)
        nameKey: b.nameKey,
        params: b.params,
        isQuick: true,
        builtIn: true,
        createdAt: _isoNow(),
        updatedAt: _isoNow()
      }));
      changed = true;
    }else{
      // If it exists but missing nameKey/isQuick, patch it (don't overwrite user edits)
      if(!hit.nameKey) { hit.nameKey = b.nameKey; changed = true; }
      if(typeof hit.isQuick !== 'boolean') { hit.isQuick = true; changed = true; }
    }
  }

  if(changed) saveGenPresets(presets);
}

// Import presets (merge or replace)
const presetImportBtn = document.getElementById('presetImport');
if(presetImportBtn){
  presetImportBtn.addEventListener('click', ()=>{
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json';
    inp.onchange = async ()=>{
      const f = inp.files?.[0];
      if(!f) return;
      try{
        const text = await f.text();
        const json = JSON.parse(text);
        if(!Array.isArray(json)){
          alert(LANG==='en' ? 'Invalid preset file.' : '프리셋 파일 형식이 올바르지 않습니다.');
          return;
        }

        const mode = prompt(
          (LANG==='en'
            ? 'Type "r" to replace, "m" to merge:'
            : '"r" 입력: 교체, "m" 입력: 병합'
          ),
          'm'
        );

        const incoming = json.map(ensurePresetShape).filter(Boolean);

        if(mode && mode.toLowerCase().startsWith('r')){
          saveGenPresets(incoming);
        }else{
          const cur = loadGenPresets().map(ensurePresetShape).filter(Boolean);
          const map = new Map(cur.map(p=>[p.id,p]));
          for(const p of incoming){
            map.set(p.id, p);
          }
          saveGenPresets(Array.from(map.values()));
        }

        ensureBuiltinQuickPresets(); // keep core quick presets available
        refreshPresetSelect(false);
        renderQuickPresetChips();
        updateQuickToggleUI();

        alert(LANG==='en' ? 'Presets imported.' : '프리셋을 가져왔습니다.');
      }catch(err){
        console.warn('[preset import] failed', err);
        alert(LANG==='en' ? 'Import failed.' : '가져오기 실패');
      }
    };
    inp.click();
  });
}

];

  BANNERS.forEach((_, idx)=>{

<script>
(function(){
  const popup      = document.getElementById('numPopup');
  if (!popup) return;

  const labelEl    = document.getElementById('numPopupLabel');
  const valEl      = document.getElementById('numPopupValue');
  const rangeEl    = document.getElementById('numPopupRange');
  const closeBtn   = document.getElementById('numPopupClose');

  let boundInput = null;
  let cfg        = null;

 // 팝업 설정: 주파수 / 듀티 / 듀얼 톤
const configs = {
  freq: {
    min: 0,
    max: 20000,
    step: 0.1,
    labelKey: 'gen.frequency'
  },
  dutyNum: {
    min: 1,
    max: 100,
    step: 1,
    labelKey: 'gen.duty'
  },
  toneA: {
    min: 0,
    max: 20000,
    step: 0.1,
    labelKey: 'dual.toneA'
  },
  toneB: {
    min: 0,
    max: 20000,
    step: 0.1,
    labelKey: 'dual.toneB'
  }
};

  function getLabelText(input, config){
    // i18n 우선
    if (config && config.labelKey && I18N && I18N[LANG] && I18N[LANG][config.labelKey]){
      return I18N[LANG][config.labelKey];
    }
    // 그다음 fallback
    if (input.dataset.label) return input.dataset.label;
    if (input.placeholder)  return input.placeholder;
    return input.id;
  }

  function openPopup(input){
    const id = input.id;
    const c  = configs[id];
    if (!c) return;
    boundInput = input;
    cfg = c;

    labelEl.textContent = getLabelText(input, c);

    valEl.min   = c.min;
    valEl.max   = c.max;
    valEl.step  = c.step;
    rangeEl.min = c.min;
    rangeEl.max = c.max;
    rangeEl.step= c.step;

    const current = parseFloat(input.value || c.min);
    valEl.value   = isNaN(current) ? c.min : current;
    rangeEl.value = valEl.value;

    popup.classList.add('show');
  }

  function applyValue(v){
    if (!boundInput) return;
    boundInput.value = v;
    // 기존 제너레이터 로직에 즉시 반영되도록 input/change 이벤트 둘 다 쏴줌
    boundInput.dispatchEvent(new Event('input', { bubbles:true }));
    boundInput.dispatchEvent(new Event('change', { bubbles:true }));
  }

  // 슬라이더/숫자 입력 시 실시간 반영
  valEl.addEventListener('input', ()=>{
    const v = valEl.value;
    rangeEl.value = v;
    applyValue(v);
  });

  rangeEl.addEventListener('input', ()=>{
    const v = rangeEl.value;
    valEl.value = v;
    applyValue(v);
  });

  // 닫기 버튼 & 배경 클릭으로 모달 닫기
  function closePopup(){
    popup.classList.remove('show');
    boundInput = null;
    cfg        = null;
  }

  closeBtn.addEventListener('click', closePopup);
  popup.addEventListener('click', (e)=>{
    if (e.target === popup) closePopup();
  });

  // 대상 필드에 클릭 핸들러 걸기 (freq / dutyNum)
  document.querySelectorAll('.num-popup-field').forEach(input =>{
    input.readOnly = true;  // 직접 키보드 입력 대신 팝업 사용
    input.addEventListener('click', (e)=>{
      e.preventDefault();
      openPopup(input);
    });
  });
})();
</script>

<!-- === WebP thumb loader (no JPG/PNG fallback) === -->
<script>
(function(){
  function buildThumbCandidates(src, lang){
    try{
      const u = new URL(src, location.href);
      const q = new URLSearchParams(u.search);

      // pathname without extension
      const base = u.pathname.replace(/\.(webp|jpg|jpeg|png)$/i, '');

      // We support KO (no suffix) + optional "_e" and EN "_E" (legacy) variants.
      // Normalize by stripping any existing suffix first, then re-add per language.
      const baseNo = base.replace(/(_e|_E)$/i, '');

      // Candidate suffix order (first wins)
      const suffixes = (lang === 'en')
        ? ['_E', '_e', '']
        : ['', '_e'];

      const mk = (ext, suf) => {
        const p = baseNo + suf + '.' + ext;
        const uu = new URL(u.origin + p);
        const qq = new URLSearchParams(q.toString());
        if (!qq.get('format'))  qq.set('format','webp');
        if (!qq.get('quality')) qq.set('quality','70');
        if (!qq.get('width'))   qq.set('width','300');
        uu.search = '?' + qq.toString();
        return uu.toString();
      };

      const list = [];
      suffixes.forEach(s => list.push(mk('webp', s)));
      return [...new Set(list)];
    }catch(e){
      return [src];
    }
  }

  function setBGWithFallback(el, urls, i=0){
    if (!el || i>=urls.length){ if(el) el.setAttribute('data-loaded','fail'); return; }
    const test = new Image();
    test.onload = ()=>{ el.style.backgroundImage = `url("${urls[i]}")`; el.setAttribute('data-loaded','1'); };
    test.onerror= ()=> setBGWithFallback(el, urls, i+1);
    test.referrerPolicy = 'no-referrer';
    test.decoding = 'async';
    test.src = urls[i];
  }

  function lazyLoadThumbs(){
    const lang = (window.LANG || (document.documentElement.lang==='en'?'en':'ko')) || 'ko';
    document.querySelectorAll('.thumb[data-src]:not([data-loaded])').forEach(th => {
      const src = th.getAttribute('data-src');
      if (!src) return;
      const list = buildThumbCandidates(src, lang);
      setBGWithFallback(th, list, 0);
    });
  }

  window.addEventListener('DOMContentLoaded', lazyLoadThumbs, {once:true});
  window.addEventListener('load', lazyLoadThumbs);
  document.addEventListener('scroll', ()=>{
    if (window.__ll_t) return;
    window.__ll_t = setTimeout(()=>{ window.__ll_t=null; lazyLoadThumbs(); }, 120);
  }, {passive:true});

  window.setStatusThumb = function(div, src){
    const lang = (window.LANG || 'ko');
    const list = buildThumbCandidates(src, lang);
    setBGWithFallback(div, list, 0);
  };
  window.lazyLoadThumbs = lazyLoadThumbs;
})();
</script>

<!-- === 5DO Level-1 Memory Cache (folders/tracks/thumbs) === -->
<script>
(function(){
  const MC = window.__MEMCACHE__ = {
    root: null,
    folders: {},
    thumbs: new Map()
  };

  function deepClone(v){
    try { return structuredClone(v); } catch(e){
      return JSON.parse(JSON.stringify(v));
    }
  }

  function wrapRoot(fn){
    return async function(){
      if (MC.root) return deepClone(MC.root);
      const data = await fn.apply(this, arguments);
      MC.root = data;
      return deepClone(data);
    };
  }
  function wrapFolder(fn){
    return async function(path){
      const key = String(path || "");
      if (MC.folders[key]) return deepClone(MC.folders[key]);
      const data = await fn.apply(this, arguments);
      MC.folders[key] = data;
      return deepClone(data);
    };
  }

  if (typeof window.listRoot === 'function'){
    window.listRoot = wrapRoot(window.listRoot);
  }
  if (typeof window.listFolder === 'function'){
    window.listFolder = wrapFolder(window.listFolder);
  } else if (typeof window.loadFolder === 'function'){
    window.loadFolder = wrapFolder(window.loadFolder);
  }

  (function(){
    const orig = window.setBGWithFallback;
    if (!orig){
      window.setBGWithFallback = function(el, urls, i=0){
        if (!el || i>=urls.length){ if (el) el.setAttribute('data-loaded','fail'); return; }
        const u = urls[i];
        if (MC.thumbs.has(u)){
          el.style.backgroundImage = `url("${MC.thumbs.get(u)}")`;
          el.setAttribute('data-loaded','1');
          return;
        }
        const img = new Image();
        img.onload = function(){
          MC.thumbs.set(u, img.src);
          el.style.backgroundImage = `url("${img.src}")`;
          el.setAttribute('data-loaded','1');
        };
        img.onerror = function(){ window.setBGWithFallback(el, urls, i+1); };
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.src = u;
      };
      return;
    }

    window.setBGWithFallback = function(el, urls, i=0){
      if (!el || i>=urls.length){ if (el) el.setAttribute('data-loaded','fail'); return; }
      const u = urls[i];

      if (MC.thumbs.has(u)){
        el.style.backgroundImage = `url("${MC.thumbs.get(u)}")`;
        el.setAttribute('data-loaded','1');
        return;
      }

      const before = el.style.backgroundImage;
      const obs = new MutationObserver(()=>{
        const bi = el.style.backgroundImage;
        if (bi && bi !== before){
          const m = bi.match(/url\(["']?(.*?)["']?\)/i);
          if (m && m[1]) MC.thumbs.set(u, m[1]);
          obs.disconnect();
        }
      });
      try{ obs.observe(el, {attributes:true, attributeFilter:['style']}); }catch(e){}
      orig(el, urls, i);
    };
  })();

  window.clear5DOMemoryCaches = function(){
    MC.root = null;
    MC.folders = {};
    MC.thumbs.clear();
  };
})();
</script>

    { id:'cosmic_blue',   name:{ko:'코스믹 블루',  en:'Cosmic Blue'},   kind:'gradient',
      value:'radial-gradient(1200px circle at 20% 20%, rgba(60,140,255,.55), rgba(5,10,25,1) 55%, rgba(0,0,0,1))' },
    { id:'nebula_purple', name:{ko:'네뷸라 퍼플',  en:'Nebula Purple'}, kind:'gradient',
      value:'radial-gradient(900px circle at 70% 30%, rgba(190,90,255,.55), rgba(10,6,22,1) 55%, rgba(0,0,0,1))' },
    { id:'aurora_green',  name:{ko:'오로라 그린',  en:'Aurora Green'},  kind:'gradient',
      value:'radial-gradient(1000px circle at 60% 10%, rgba(90,255,200,.35), rgba(8,18,20,1) 55%, rgba(0,0,0,1))' },

    { id:'deep_space',    name:{ko:'딥 스페이스',  en:'Deep Space'},    kind:'gradient',
      value:'radial-gradient(1200px circle at 50% 0%, rgba(60,80,160,.45), rgba(5,7,15,1) 60%, rgba(0,0,0,1))' },
    { id:'nebula_violet', name:{ko:'네뷸라 바이올렛', en:'Nebula Violet'}, kind:'gradient',
      value:'linear-gradient(135deg, rgba(42,8,69,1), rgba(100,65,165,1))' },
    { id:'quantum_teal',  name:{ko:'퀀텀 틸',      en:'Quantum Teal'},  kind:'gradient',
      value:'linear-gradient(135deg, rgba(15,32,39,1), rgba(32,58,67,1), rgba(44,83,100,1))' },
    { id:'solar_gold',    name:{ko:'솔라 골드',    en:'Solar Gold'},    kind:'gradient',
      value:'radial-gradient(1100px circle at 50% 40%, rgba(255,200,60,.25), rgba(20,14,0,1) 60%, rgba(0,0,0,1))' },
    { id:'plasma_red',    name:{ko:'플라즈마 레드', en:'Plasma Red'},    kind:'gradient',
      value:'linear-gradient(135deg, rgba(60,15,18,1), rgba(142,14,0,1))' },
    { id:'ether_gray',    name:{ko:'에테르 그레이', en:'Ether Gray'},    kind:'gradient',
      value:'linear-gradient(135deg, rgba(35,37,38,1), rgba(65,67,69,1))' },
    { id:'starlight_blue',name:{ko:'스타라이트 블루', en:'Starlight Blue'}, kind:'gradient',
      value:'radial-gradient(1000px circle at 50% 0%, rgba(40,120,255,.35), rgba(8,18,40,1) 60%, rgba(0,0,0,1))' },


    // 이미지 백드롭을 쓰려면 아래 예시처럼 파일을 올리고 주석을 해제:
    // 파일 위치: /_system/backdrops/space_01.webp
    // { id:'space_01', name:{ko:'스페이스 01', en:'Space 01'}, kind:'image', file:'space_01.webp' },
    // { id:'forest_01',name:{ko:'포레스트 01',en:'Forest 01'},kind:'image', file:'forest_01.webp' },
  ];

  function bdLabel(item){
    return (LANG === 'ko') ? (item.name?.ko || item.id) : (item.name?.en || item.id);
  }

  function setBackdropCss(item){
    if(!item) return;
    if(item.kind === 'gradient'){
      backdropLayer.style.backgroundImage = item.value;
    }else{
      const base = MEDIA_BASE + '/_system/backdrops/';
      backdropLayer.style.backgroundImage = 'url("' + (base + item.file) + '")';
    }
  }

  function renderBackdropGrid(selectedId){
    grid.innerHTML = '';
    BACKDROP_LIBRARY.forEach(item=>{
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'bd-tile' + (item.id === selectedId ? ' bd-selected' : '');
      tile.title = bdLabel(item);

      const thumb = document.createElement('div');
      thumb.className = 'bd-thumb';

      // ✅ 자동 썸네일: 동일 배경을 그대로 사용
      if(item.kind === 'gradient'){
        thumb.style.backgroundImage = item.value;
      }else{
        const base = MEDIA_BASE + '/_system/backdrops/';
        thumb.style.backgroundImage = 'url("' + (base + item.file) + '")';
      }

      const cap = document.createElement('div');
      cap.className = 'bd-caption';
      cap.textContent = bdLabel(item);

      tile.append(thumb, cap);

      tile.addEventListener('click', ()=>{
        applyBackdrop(item.id);
        closeBackdropPanel();
      });

      grid.appendChild(tile);
    });
  }

  function applyBackdrop(id){
    const item = BACKDROP_LIBRARY.find(x=>x.id===id) || BACKDROP_LIBRARY[0];
    if(!item) return;
    setBackdropCss(item);
    localStorage.setItem(BD_ID_KEY, item.id);
    renderBackdropGrid(item.id);
  }

  function setBackdropOpacity(v){
    const x = Math.max(0.15, Math.min(1.0, Number(v) || 1));
    backdropLayer.style.opacity = String(x);
    if(bdOpacityVal) bdOpacityVal.textContent = x.toFixed(2);
    localStorage.setItem(BD_OP_KEY, String(x));
  }

  function setUiOpacity(v){
    const x = Math.max(0.35, Math.min(1.0, Number(v) || 0.92));
    document.documentElement.style.setProperty('--uiOpacity', String(x));
    if(uiOpacityVal) uiOpacityVal.textContent = x.toFixed(2);
    localStorage.setItem(UI_OP_KEY, String(x));
  }

  function openBackdropPanel(){
    panel.style.display = 'flex';
    renderBackdropGrid(localStorage.getItem(BD_ID_KEY) || BACKDROP_LIBRARY[0].id);
  }
  function closeBackdropPanel(){
    panel.style.display = 'none';
  }

  // Open/Close bindings
  if(btnOpen) btnOpen.addEventListener('click', openBackdropPanel);
  if(btnClose) btnClose.addEventListener('click', closeBackdropPanel);
  panel.addEventListener('click', (e)=>{ if(e.target === panel) closeBackdropPanel(); });
  window.addEventListener('keydown', (e)=>{
    if(panel.style.display !== 'none' && e.key === 'Escape') closeBackdropPanel();
  });

  // Init sliders (load saved)
  const initBdOp = parseFloat(localStorage.getItem(BD_OP_KEY) || '1');
  const initUiOp = parseFloat(localStorage.getItem(UI_OP_KEY) || '0.92');

  if(bdOpacityEl){
    bdOpacityEl.value = String(isFinite(initBdOp) ? initBdOp : 1);
    bdOpacityEl.addEventListener('input', ()=>setBackdropOpacity(bdOpacityEl.value));
  }
  if(uiOpacityEl){
    uiOpacityEl.value = String(isFinite(initUiOp) ? initUiOp : 0.92);
    uiOpacityEl.addEventListener('input', ()=>setUiOpacity(uiOpacityEl.value));
  }

  // Apply initial values
  setBackdropOpacity(isFinite(initBdOp) ? initBdOp : 1);
  setUiOpacity(isFinite(initUiOp) ? initUiOp : 0.92);
  if(backdropDim) backdropDim.style.opacity = '1';

  const initId = localStorage.getItem(BD_ID_KEY) || BACKDROP_LIBRARY[0].id;
  applyBackdrop(initId);

  // Re-render backdrop captions when language toggles
  const _applyLang = window.applyLang;
  window.applyLang = function(){
    try{ _applyLang && _applyLang(); }catch(e){}
    try{
      if(btnOpen) btnOpen.title = (LANG==='en' ? 'Backdrop' : '백드롭');
      renderBackdropGrid(localStorage.getItem(BD_ID_KEY) || BACKDROP_LIBRARY[0].id);
    }catch(e){}
  };
})();
</script>

</body>
</html>
