<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5DO Admin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0A0A0F;color:#f0f0ff;min-height:100vh;padding:20px}
  h1{font-size:24px;font-weight:700;margin-bottom:24px;color:#7C5CFC}
  h2{font-size:16px;font-weight:600;margin-bottom:12px;color:#9B7FFF}
  .card{background:#1A1A2E;border:1px solid #2A2A45;border-radius:14px;padding:20px;margin-bottom:20px}
  label{display:block;font-size:12px;color:#A0A0C0;margin-bottom:4px;margin-top:12px}
  input,textarea{width:100%;padding:10px 12px;background:#252540;border:1px solid #2A2A45;border-radius:8px;color:#f0f0ff;font-size:14px;outline:none}
  input:focus,textarea:focus{border-color:#7C5CFC}
  textarea{resize:vertical;min-height:60px}
  button{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;margin-right:8px}
  .btn-primary{background:linear-gradient(135deg,#7C5CFC,#5A3AD9);color:#fff}
  .btn-danger{background:#F87171;color:#fff}
  .btn-secondary{background:#252540;color:#A0A0C0;border:1px solid #2A2A45}
  .msg{padding:10px;border-radius:8px;margin-top:12px;font-size:13px;display:none}
  .msg.ok{display:block;background:rgba(74,222,128,0.1);color:#4ADE80;border:1px solid rgba(74,222,128,0.2)}
  .msg.err{display:block;background:rgba(248,113,113,0.1);color:#F87171;border:1px solid rgba(248,113,113,0.2)}
  .coupon-list{font-family:'SF Mono',monospace;font-size:13px;line-height:2;color:#3ECFCF;background:#141420;padding:12px;border-radius:8px;margin-top:8px;max-height:200px;overflow-y:auto}
  #loginWrap{max-width:360px;margin:100px auto;text-align:center}
  #adminWrap{max-width:600px;margin:0 auto;display:none}
  .stat{display:inline-block;background:#252540;padding:6px 14px;border-radius:8px;font-size:12px;margin-right:8px;margin-bottom:8px}
  .stat b{color:#3ECFCF}
</style>
</head>
<body>

<div id="loginWrap">
  <h1>5DO Admin</h1>
  <label>Admin Key</label>
  <input type="password" id="adminKeyInput" placeholder="관리자 키 입력">
  <button class="btn-primary" onclick="adminLogin()">로그인</button>
</div>

<div id="adminWrap">
  <h1>5DO Admin</h1>

  <!-- Stats -->
  <div class="card">
    <h2>📊 통계</h2>
    <div id="statsArea">로딩중...</div>
  </div>

  <!-- Announcement -->
  <div class="card">
    <h2>📢 알림 배너</h2>
    <div id="currentAnnounce" style="font-size:13px;color:#A0A0C0;margin-bottom:8px"></div>
    <label>한국어 메시지</label>
    <textarea id="annTextKo" placeholder="얼리버드 30% 할인 중!"></textarea>
    <label>영어 메시지</label>
    <textarea id="annTextEn" placeholder="Early Bird 30% off!"></textarea>
    <label>링크 URL (선택)</label>
    <input type="text" id="annUrl" placeholder="https://...">
    <div>
      <button class="btn-primary" onclick="saveAnnounce()">저장</button>
      <button class="btn-danger" onclick="deleteAnnounce()">삭제</button>
    </div>
    <div id="annMsg" class="msg"></div>
  </div>

  <!-- Coupon -->
  <div class="card">
    <h2>🎟️ 쿠폰 관리</h2>
    <label>생성 수량</label>
    <input type="number" id="couponCount" value="10" min="1" max="100">
    <button class="btn-primary" onclick="generateCoupons()">쿠폰 생성</button>
    <button class="btn-secondary" onclick="loadCoupons()">사용내역 조회</button>
    <div id="couponMsg" class="msg"></div>
    <div id="couponList"></div>
  </div>

  <!-- Email -->
  <div class="card">
    <h2>📧 이메일 발송</h2>
    <label>발송 대상</label>
    <select id="emailTarget" style="width:100%;padding:10px 12px;background:#252540;border:1px solid #2A2A45;border-radius:8px;color:#f0f0ff;font-size:14px">
      <option value="all">전체 유저</option>
      <option value="free">Free 유저만</option>
      <option value="pro">Pro 유저만</option>
      <option value="recipients">지정 이메일만</option>
    </select>
    <div id="emailRecipientsRow" style="display:none">
      <label>받는 사람 (쉼표 또는 줄바꿈으로 구분)</label>
      <textarea id="emailRecipients" style="min-height:70px" placeholder="someone@example.com, another@example.com"></textarea>
      <div style="font-size:12px;color:#6B6B8D;margin-top:-4px">가입된 계정만 발송됩니다. 계정이 없는 주소는 발송 후 따로 표시됩니다.</div>
    </div>
    <label>제목</label>
    <input type="text" id="emailSubject" placeholder="이메일 제목">
    <label>본문 (HTML)</label>
    <textarea id="emailBody" style="min-height:180px" placeholder="<h2>안녕하세요!</h2><p>새로운 소식을 전해드립니다.</p>"></textarea>
    <div style="margin-top:8px">
      <button class="btn-secondary" onclick="previewEmail()">미리보기</button>
      <button class="btn-primary" onclick="sendEmail()">발송</button>
    </div>
    <div id="emailMsg" class="msg"></div>
    <div id="emailPreview" style="display:none;margin-top:12px;background:#fff;border-radius:8px;padding:16px;max-height:300px;overflow-y:auto"></div>
  </div>

  <!-- Email log -->
  <div class="card">
    <h2>📨 발송 내역</h2>
    <div style="font-size:12px;color:#6B6B8D;margin-bottom:10px">
      <strong>접수</strong>는 Resend가 메일을 받아 발송 대기열에 넣었다는 뜻입니다.
      실제 수신·반송 여부는 Resend 대시보드에서 확인하세요.
    </div>
    <button class="btn-secondary" onclick="loadEmailLog()">새로고침</button>
    <div id="emailLog" style="margin-top:12px"></div>
  </div>

  <!-- Grant Lifetime -->
  <div class="card">
    <h2>👑 Lifetime Pro 부여</h2>
    <label>사용자 이메일</label>
    <input type="email" id="grantEmail" placeholder="user@email.com">
    <button class="btn-primary" onclick="grantLifetime()">Lifetime Pro 부여</button>
    <div id="grantMsg" class="msg"></div>
  </div>

  <!-- Delete User -->
  <div class="card">
    <h2>🗑️ 유저 삭제</h2>
    <label>사용자 이메일</label>
    <input type="email" id="deleteEmail" placeholder="user@email.com">
    <button class="btn-danger" onclick="deleteUser()">유저 삭제</button>
    <div id="deleteMsg" class="msg"></div>
  </div>
</div>

<script>
let ADMIN_KEY = '';

function adminLogin() {
  ADMIN_KEY = document.getElementById('adminKeyInput').value.trim();
  if (!ADMIN_KEY) return;
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminWrap').style.display = 'block';
  loadAnnounce();
  loadStats();
}

// Allow Enter key to login
document.getElementById('adminKeyInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') adminLogin();
});

function headers() {
  return { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY };
}

function showMsg(id, ok, text) {
  const el = document.getElementById(id);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
  if (ok) setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ─── Stats ───
async function loadStats() {
  try {
    const res = await fetch('/api/admin/stats', { headers: headers() });
    const data = await res.json();
    if (data.error) { document.getElementById('statsArea').textContent = '통계 로드 실패'; return; }
    document.getElementById('statsArea').innerHTML =
      `<span class="stat">전체 유저: <b>${data.totalUsers}</b></span>` +
      `<span class="stat">Pro: <b>${data.proUsers}</b></span>` +
      `<span class="stat">Lifetime: <b>${data.lifetimeUsers}</b></span>` +
      `<span class="stat">쿠폰 사용: <b>${data.couponsUsed}/${data.couponsTotal}</b></span>`;
  } catch (e) {
    document.getElementById('statsArea').textContent = '통계 로드 실패';
  }
}

// ─── Announcement ───
async function loadAnnounce() {
  try {
    const res = await fetch('/api/admin/announcement', { headers: headers() });
    const data = await res.json();
    if (data.metadata) {
      document.getElementById('annTextKo').value = data.metadata.text_ko || '';
      document.getElementById('annTextEn').value = data.metadata.text_en || '';
      document.getElementById('annUrl').value = data.metadata.url || '';
      document.getElementById('currentAnnounce').textContent = '현재: ' + (data.metadata.text_ko || '없음');
    } else {
      document.getElementById('currentAnnounce').textContent = '현재 알림 없음';
    }
  } catch (e) {}
}

async function saveAnnounce() {
  const text_ko = document.getElementById('annTextKo').value.trim();
  const text_en = document.getElementById('annTextEn').value.trim();
  const url = document.getElementById('annUrl').value.trim();
  try {
    const res = await fetch('/api/admin/announcement', {
      method: 'PUT', headers: headers(),
      body: JSON.stringify({ text_ko, text_en, url }),
    });
    const data = await res.json();
    showMsg('annMsg', data.ok, data.ok ? '저장 완료' : (data.error || '실패'));
    if (data.ok) loadAnnounce();
  } catch (e) { showMsg('annMsg', false, e.message); }
}

async function deleteAnnounce() {
  if (!confirm('알림을 삭제하시겠습니까?')) return;
  try {
    const res = await fetch('/api/admin/announcement', { method: 'DELETE', headers: headers() });
    const data = await res.json();
    showMsg('annMsg', data.ok, data.ok ? '삭제 완료' : (data.error || '실패'));
    if (data.ok) {
      document.getElementById('annTextKo').value = '';
      document.getElementById('annTextEn').value = '';
      document.getElementById('annUrl').value = '';
      document.getElementById('currentAnnounce').textContent = '현재 알림 없음';
    }
  } catch (e) { showMsg('annMsg', false, e.message); }
}

// ─── Coupons ───
async function generateCoupons() {
  const count = parseInt(document.getElementById('couponCount').value) || 10;
  try {
    const res = await fetch('/api/coupon/generate', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ count }),
    });
    const data = await res.json();
    if (data.ok) {
      showMsg('couponMsg', true, `${data.codes.length}개 쿠폰 생성 완료`);
      document.getElementById('couponList').innerHTML =
        '<div class="coupon-list">' + data.codes.join('<br>') + '</div>';
    } else {
      showMsg('couponMsg', false, data.error || '실패');
    }
  } catch (e) { showMsg('couponMsg', false, e.message); }
}

async function loadCoupons() {
  try {
    const res = await fetch('/api/admin/coupons', { headers: headers() });
    const data = await res.json();
    if (data.coupons) {
      let html = '<div class="coupon-list">';
      data.coupons.forEach(c => {
        const status = c.used_by ? `✅ 사용됨 (${c.used_at?.slice(0,10)})` : '⏳ 미사용';
        html += `${c.code} — ${status}<br>`;
      });
      html += '</div>';
      document.getElementById('couponList').innerHTML = html;
    }
  } catch (e) { showMsg('couponMsg', false, e.message); }
}

// ─── Grant Lifetime ───
async function grantLifetime() {
  const email = document.getElementById('grantEmail').value.trim();
  if (!email) return;
  try {
    const res = await fetch('/api/subscription/grant-lifetime', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    showMsg('grantMsg', data.ok, data.ok ? data.message : (data.error || '실패'));
  } catch (e) { showMsg('grantMsg', false, e.message); }
}

// ─── Delete User ───
async function deleteUser() {
  const email = document.getElementById('deleteEmail').value.trim();
  if (!email) return;
  if (!confirm(email + ' 유저를 완전히 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  try {
    const res = await fetch('/api/admin/delete-user', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    showMsg('deleteMsg', data.ok, data.ok ? data.message : (data.error || '실패'));
    if (data.ok) { document.getElementById('deleteEmail').value = ''; loadStats(); }
  } catch (e) { showMsg('deleteMsg', false, e.message); }
}

// ─── Email ───
function wrapEmailTemplate(bodyHtml) {
  return `<div style="max-width:520px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#333;padding:20px">
    ${bodyHtml}
    <hr style="border:none;border-top:1px solid #eee;margin:32px 0 16px">
    <p style="font-size:11px;color:#999;text-align:center">5DO — 5th Dimensional Oscillator<br>주식회사 스피닛 (SPINIT)<br><a href="https://5do.app" style="color:#7C5CFC">5do.app</a></p>
  </div>`;
}

function previewEmail() {
  const body = document.getElementById('emailBody').value;
  const preview = document.getElementById('emailPreview');
  preview.innerHTML = wrapEmailTemplate(body);
  preview.style.display = 'block';
}

// Only the explicit-recipient mode needs the address box.
document.getElementById('emailTarget').addEventListener('change', function () {
  document.getElementById('emailRecipientsRow').style.display =
    this.value === 'recipients' ? 'block' : 'none';
});

async function sendEmail() {
  const target = document.getElementById('emailTarget').value;
  const subject = document.getElementById('emailSubject').value.trim();
  const body = document.getElementById('emailBody').value.trim();
  if (!subject || !body) { showMsg('emailMsg', false, '제목과 본문을 입력하세요'); return; }

  let recipients = null;
  if (target === 'recipients') {
    recipients = document.getElementById('emailRecipients').value
      .split(/[\s,;]+/).map(e => e.trim().toLowerCase()).filter(Boolean);
    recipients = [...new Set(recipients)];
    if (!recipients.length) { showMsg('emailMsg', false, '받는 사람을 입력하세요'); return; }
  }

  // Name the addresses in the confirm when there are few enough to read. The
  // tier sends say how many; this one says who, because sending a billing
  // notice to the wrong person is not a volume mistake.
  const confirmText = recipients
    ? (recipients.length <= 5
        ? '다음 ' + recipients.length + '명에게 발송합니다:\n\n' + recipients.join('\n') + '\n\n진행할까요?'
        : recipients.length + '개 주소로 발송하시겠습니까?')
    : ({ all: '전체', free: 'Free', pro: 'Pro' }[target] + ' 유저에게 이메일을 발송하시겠습니까?');
  if (!confirm(confirmText)) return;

  try {
    showMsg('emailMsg', true, '발송 중...');
    const res = await fetch('/api/admin/send-email', {
      method: 'POST', headers: headers(),
      body: JSON.stringify({ target, recipients, subject, body_html: wrapEmailTemplate(body) }),
    });
    const data = await res.json();
    if (data.ok) {
      let msg = '발송 완료: ' + data.sent + '건 성공, ' + data.failed + '건 실패 (총 ' + data.total + '명)';
      if (data.notFound && data.notFound.length) {
        msg += ' / 계정 없음 ' + data.notFound.length + '건: ' + data.notFound.join(', ');
      }
      showMsg('emailMsg', data.failed === 0 && !(data.notFound || []).length, msg);
    } else {
      let err = data.error || '실패';
      if (data.notFound && data.notFound.length) err += ' (' + data.notFound.join(', ') + ')';
      showMsg('emailMsg', false, err);
    }
  } catch (e) { showMsg('emailMsg', false, e.message); }
  loadEmailLog();
}

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function loadEmailLog() {
  const box = document.getElementById('emailLog');
  box.innerHTML = '<div style="color:#6B6B8D;font-size:13px">불러오는 중…</div>';
  try {
    const res = await fetch('/api/admin/email-log', { headers: headers() });
    const data = await res.json();
    if (!res.ok) { box.innerHTML = '<div style="color:#F87171;font-size:13px">' + esc(data.error || '조회 실패') + '</div>'; return; }
    const log = data.log || [];
    if (!log.length) { box.innerHTML = '<div style="color:#6B6B8D;font-size:13px">발송 내역이 없습니다.</div>'; return; }

    box.innerHTML = log.map(function (r) {
      const when = new Date(r.created_at).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' });
      const targetLabel = { all: '전체', free: 'Free', pro: 'Pro', recipients: '지정' }[r.target] || esc(r.target);
      const failed = r.failed || 0;
      const notFound = (r.notFound || []).length;
      // Anything other than a clean, complete send reads amber — a partial
      // success is the case most worth noticing and the easiest to skim past.
      const clean = failed === 0 && notFound === 0;
      const bar = clean ? '#4ADE80' : '#FBBF24';

      let detail = '';
      if ((r.failures || []).length) {
        detail += '<div style="margin-top:6px;font-size:12px;color:#F87171">거부됨:<br>'
          + r.failures.map(function (f) { return '&nbsp;&nbsp;' + esc(f.to) + ' — ' + esc(f.error); }).join('<br>')
          + '</div>';
      }
      if (notFound) {
        detail += '<div style="margin-top:6px;font-size:12px;color:#FFB86C">계정 없음: '
          + r.notFound.map(esc).join(', ') + '</div>';
      }

      return '<div style="border-left:3px solid ' + bar + ';background:#1A1A2E;border-radius:8px;padding:10px 12px;margin-bottom:8px">'
        + '<div style="font-size:12px;color:#6B6B8D">' + esc(when) + ' · ' + targetLabel
        + (r.requested ? ' ' + r.requested + '명' : '') + '</div>'
        + '<div style="font-size:14px;color:#F0F0FF;margin:4px 0">' + esc(r.subject || '(제목 없음)') + '</div>'
        + '<div style="font-size:13px"><span style="color:#4ADE80">접수 ' + (r.sent || 0) + '</span>'
        + (failed ? ' · <span style="color:#F87171">거부 ' + failed + '</span>' : '')
        + (notFound ? ' · <span style="color:#FFB86C">계정없음 ' + notFound + '</span>' : '')
        + ' <span style="color:#6B6B8D">/ 대상 ' + (r.total || 0) + '</span></div>'
        + detail
        + '</div>';
    }).join('');
  } catch (e) {
    box.innerHTML = '<div style="color:#F87171;font-size:13px">' + esc(e.message) + '</div>';
  }
}
</script>
</body>
</html>
