<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<meta name="description" content="정밀 천체력으로 계산한 출생 천궁도와 해석.">
<!-- Static so crawlers and a no-JS load still get a name; the script below
     re-sets it from window.PRODUCT, which is the source of truth. -->
<title>5DOracle</title>

<!-- No React, no Babel, no payment SDK. The natal module is framework-free, so
     this page loads nothing but the module itself — the thing that made the
     5DO page slow was exactly the habit of putting SDKs in <head> "just in
     case". Keep this file that way. -->
<script>
  // ── The product name lives here and nowhere else. ──────────────────────
  // Renames leak into titles, headers, share cards and alt text that nobody
  // thinks to grep. One source means a rename is one line.
  window.PRODUCT = {
    name: '5DOracle',
    tagline: { ko: '천궁도 리딩', en: 'Natal chart reading' },
  };
  document.title = PRODUCT.name;
</script>

<style>
  :root {
    --bg: #0A0A0F; --bg-card: #1A1A2E; --border: #2A2A45;
    --primary: #7C5CFC; --primary-light: #9B7FFF;
    --text: #F0F0FF; --text-dim: #A0A0C0; --text-faint: #6B6B8D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text',
          'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 18px 16px 14px; border-bottom: 1px solid var(--border);
  }
  .acct {
    margin-left: auto; align-self: center; flex: none;
    padding: 7px 13px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    font: inherit; font-size: 12.5px; max-width: 46vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .acct:hover { color: var(--text); border-color: var(--primary); }
  .soon .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .soon .choices button {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-weight: 500;
  }
  .wordmark {
    font-size: 19px; font-weight: 700; letter-spacing: -0.4px;
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline { font-size: 12px; color: var(--text-faint); }
  main { padding: 0 16px 48px; max-width: 900px; margin: 0 auto; }
  #mount { display: block; }

  .boot { padding: 64px 16px; text-align: center; color: var(--text-dim); }
  .boot .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px;
    border: 2px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot .spinner { animation: none; } }
  .boot.error { color: #F87171; }
  .boot button {
    margin-top: 14px; padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
    font: inherit; font-size: 14px;
  }

  /* Stage 1 placeholder for the upgrade path. Replaced by real checkout in
     stage 4; it says "not yet" rather than pretending to sell something. */
  .soon-backdrop {
    position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(0,0,0,.72); backdrop-filter: blur(8px);
  }
  .soon {
    max-width: 380px; width: 100%; padding: 24px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
  }
  .soon h2 { margin: 0 0 8px; font-size: 17px; }
  .soon p { margin: 0 0 18px; font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }
  .soon button {
    width: 100%; padding: 12px; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), #5A3AD9);
    color: #fff; font: inherit; font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <span class="wordmark" id="wordmark"></span>
  <span class="tagline" id="tagline"></span>
  <button class="acct" id="acct" hidden></button>
</header>

<main>
  <div id="mount">
    <div class="boot" id="boot">
      <div class="spinner"></div>
      <div id="bootMsg">불러오는 중…</div>
    </div>
  </div>
</main>

<script type="module">
  // The ephemeris is 850KB and is fetched by the module on mount. In 5DO that
  // cost is paid when the tab is opened; here the reading *is* the app, so it
  // is paid at boot — hence the explicit loading state above rather than a
  // blank screen while it arrives.
  const el = document.getElementById('mount');
  const boot = document.getElementById('boot');
  const bootMsg = document.getElementById('bootMsg');

  // Korean unless the browser says otherwise. Matches 5DO's initialLang().
  const lang = /^ko\b/i.test(navigator.language || '') ? 'ko' : 'en';
  document.documentElement.lang = lang;
  document.getElementById('wordmark').textContent = PRODUCT.name;
  document.getElementById('tagline').textContent = PRODUCT.tagline[lang];
  if (lang === 'en') bootMsg.textContent = 'Loading…';

  const T = {
    ko: {
      failed: '불러오지 못했습니다.',
      retry: '다시 시도',
      soonTitle: '해석 구매는 준비 중입니다',
      soonBody: '출생 차트와 데이터 표는 지금 무료로 보실 수 있습니다. 차트별 해석 구매는 곧 열립니다.',
      ok: '알겠습니다',
      signIn: '로그인',
      signOut: '로그아웃',
      signInTitle: '로그인',
      signInBody: '차트 계산과 데이터 표는 로그인 없이 쓰실 수 있습니다. 해석을 구매하고 다시 열어보려면 계정이 필요합니다.',
      google: 'Google 계정으로 계속',
      kakao: '카카오로 계속',
      signInFailed: '로그인을 시작할 수 없습니다. 잠시 후 다시 시도해 주세요.',
      cancel: '닫기',
      // Gate block, shown in place of the generate controls.
      gateOutTitle: '해석을 보려면 로그인하세요',
      gateOutBody: '차트와 데이터 표 4종은 계산이 끝나 그대로 보실 수 있습니다. 15개 항목의 전문 해석은 차트별로 구매하며, 구매 내역을 남기려면 계정이 필요합니다.',
      gateOutCta: '로그인',
      gateInTitle: '이 차트의 해석',
      gateInBody: '15개 항목의 전문 해석을 이 차트에 대해 한 번 구매하면 계속 보실 수 있습니다. 구매 기능은 준비 중입니다.',
      gateInCta: '구매 안내 보기',
    },
    en: {
      failed: 'Could not load.',
      retry: 'Try again',
      soonTitle: 'Purchasing is not open yet',
      soonBody: 'The birth chart and its data tables are free to use right now. Buying a reading per chart opens soon.',
      ok: 'Got it',
      signIn: 'Sign in',
      signOut: 'Sign out',
      signInTitle: 'Sign in',
      signInBody: 'Computing a chart and reading its tables needs no account. An account is what keeps a reading you have bought.',
      google: 'Continue with Google',
      kakao: 'Continue with Kakao',
      signInFailed: 'Could not start sign-in. Please try again shortly.',
      cancel: 'Close',
      gateOutTitle: 'Sign in to read the interpretation',
      gateOutBody: 'The chart and its four data tables are computed and yours to read. The fifteen-section interpretation is bought per chart, and an account is what keeps that purchase.',
      gateOutCta: 'Sign in',
      gateInTitle: 'This chart\'s reading',
      gateInBody: 'Buy the fifteen-section interpretation once for this chart and it stays yours. Purchasing is not open yet.',
      gateInCta: 'See details',
    },
  }[lang];

  // One sheet, two uses. `choices` are the buttons above the dismiss button.
  function sheet({ title, body, ok, choices = [] }) {
    const b = document.createElement('div');
    b.className = 'soon-backdrop';
    const box = document.createElement('div');
    box.className = 'soon';
    const h = document.createElement('h2'); h.textContent = title;
    const p = document.createElement('p'); p.textContent = body;
    box.append(h, p);
    const close = () => b.remove();
    if (choices.length) {
      const wrap = document.createElement('div');
      wrap.className = 'choices';
      for (const c of choices) {
        const btn = document.createElement('button');
        btn.textContent = c.label;
        btn.addEventListener('click', () => { close(); c.run(); });
        wrap.appendChild(btn);
      }
      box.appendChild(wrap);
    }
    const dismiss = document.createElement('button');
    dismiss.textContent = ok;
    dismiss.addEventListener('click', close);
    box.appendChild(dismiss);
    b.appendChild(box);
    b.addEventListener('click', (e) => { if (e.target === b) close(); });
    // Escape closes it; a modal with no keyboard way out is a trap.
    const esc = (e) => { if (e.key === 'Escape') { close(); window.removeEventListener('keydown', esc); } };
    window.addEventListener('keydown', esc);
    document.body.appendChild(b);
    return close;
  }

  function showSoon() {
    sheet({ title: T.soonTitle, body: T.soonBody, ok: T.ok });
  }

  let P = null;              // the provider module, once loaded
  let user = null;           // the signed-in user, or null

  function showSignIn() {
    if (!P) return;
    sheet({
      title: T.signInTitle,
      body: T.signInBody,
      ok: T.cancel,
      choices: P.AUTH_PROVIDERS.map((id) => ({
        label: T[id] || id,
        run: () => P.signIn(id).catch(() => sheet({ title: T.signInTitle, body: T.signInFailed, ok: T.ok })),
      })),
    });
  }

  async function start() {
    boot.className = 'boot';
    bootMsg.textContent = lang === 'ko' ? '불러오는 중…' : 'Loading…';
    try {
      const [{ mountNatal }, providers] = await Promise.all([
        import('/lib/natal/index.js'),
        import('./providers.js'),
      ]);
      P = providers;

      // Whether the chart on screen is paid for is asked during render, so it is
      // answered from a set fetched once per sign-in rather than per chart.
      const entitlement = {
        canRead: (chartKey, l) => P.owns(chartKey, l),
        remaining: null,
        onUpgrade: () => (user ? showSoon() : showSignIn()),
        // "Subscribe" is the wrong word for something sold one chart at a time,
        // and what to offer depends on whether they are signed in at all.
        get gate() {
          const out = !user;
          const c = {
            title: out ? T.gateOutTitle : T.gateInTitle,
            body: out ? T.gateOutBody : T.gateInBody,
            cta: out ? T.gateOutCta : T.gateInCta,
          };
          return { ko: c, en: c };
        },
      };

      const handle = await mountNatal(el, {
        ...providers.createProvider({
          lang,
          entitlement,
          onLangChange: (l) => { document.documentElement.lang = l; },
        }),
        // This app owns no language chrome of its own, so the module keeps its
        // own ko/en toggle — the one 5DO hides because the host owns language.
        hideLangToggle: false,
      });
      boot.remove();

      // Auth is loaded lazily, so this resolves after the chart UI is already up
      // — which is the right order: the free tier must not wait on a session.
      const acct = document.getElementById('acct');
      acct.addEventListener('click', () => (user ? P.signOut() : showSignIn()));

      const paintAccount = () => {
        acct.hidden = false;
        acct.textContent = user ? (user.email || T.signOut) : T.signIn;
        acct.title = user ? T.signOut : T.signIn;
      };

      const applySession = async (u) => {
        const was = !!user;
        user = u;
        paintAccount();
        await P.refreshOwned();
        // Redraw so the gate block reflects the new state. Cheap: the chart is
        // already computed and nothing is refetched. Only on an actual change of
        // signed-in state — a token refresh must not make the page flicker.
        if (was !== !!user && handle && handle.refresh) handle.refresh();
      };

      await applySession(await P.currentUser());
      P.onAuthChange(applySession);
    } catch (e) {
      console.error('[' + PRODUCT.name + '] mount failed', e);
      boot.className = 'boot error';
      boot.innerHTML = '';
      const msg = document.createElement('div');
      msg.textContent = T.failed;
      const btn = document.createElement('button');
      btn.textContent = T.retry;
      btn.addEventListener('click', start);
      boot.append(msg, btn);
    }
  }

  start();
</script>

</body>
</html>
