<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Quantum Torus Pendant Navigation</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    body{
      margin:0;
      background:#050910;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px 10px 40px;
      color:#e5f4ff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    .page-wrap{
      width:100%;
      max-width:1500px;
    }

    /* 안내 문구 */
    .nav-guide{
      text-align:center;
      font-size:1.1rem;
      margin-bottom:14px;
      line-height:1.5;
      color:#d0e5ff;
    }

    /* 언어 탭 */
    .lang-tabs{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-bottom:10px;
    }
    .lang-tab{
      border:1px solid #253447;
      background:#070c16;
      color:#a8c0d9;
      padding:6px 12px;
      border-radius:999px;
      cursor:pointer;
      font-size:0.9rem;
    }
    .lang-tab.active{
      background:#39e3ff;
      color:#050910;
      border-color:#39e3ff;
    }

    /* 이미지 영역 */
    .pendant-nav{
      position:relative;
      width:100%;
      border-radius:14px;
      overflow:hidden;
    }

    #pendantImage{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* 공통 핫스팟 (1500x2122 기준) */
    .pendant-hotspot{
      position:absolute;
      left:22.5%;                         /* 이미지 왼쪽에서 20% 지점이 토러스의 중앙 */
      transform:translate(-50%, -50%);
      width:15%;                        /* 토러스 지름과 거의 동일하게 맞춤 */
      aspect-ratio:1 / 1;
      border-radius:50%;
      background:rgba(255,255,255,0);   /* 투명 */
      cursor:pointer;
    }

    @media (hover:hover){
      .pendant-hotspot:hover{
        box-shadow:0 0 0 3px rgba(0,255,255,0.45);
      }
    }

    /* 1500x2122 기준 세로 위치 (정중앙 맞춘 값) */
    .hot-1{ top: 15%; }   /* ULTRA  */
    .hot-2{ top: 27%; }   /* FLOW   */
    .hot-3{ top: 39%; }   /* DNA    */
    .hot-4{ top: 51.5%; }   /* HEAL   */
    .hot-5{ top: 63.5%; }   /* HALO   */
    .hot-6{ top: 75.5%; }   /* LIFT   */
    .hot-7{ top: 87.5%; }   /* SHIELD */
  </style>
</head>

<body>

  <div class="page-wrap">

    <!-- 🔹 안내 문구 -->
    <div class="nav-guide">
      원하는 펜던트 이미지를 터치/클릭하면 해당 상품의 상세 페이지로 이동합니다.<br>
      Tap or click your preferred pendant to open its product detail page.
    </div>

    <!-- 🔹 언어 선택 탭 -->
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="ko">한국어</button>
      <button class="lang-tab" data-lang="en">English</button>
    </div>

    <!-- 🔹 펜던트 네비게이션 이미지 -->
    <div class="pendant-nav">
      <img
        id="pendantImage"
        src="https://paulkpark.github.io/5do-app/assets/nav/pendant-desc_K.webp"
        data-src-ko="https://paulkpark.github.io/5do-app/assets/nav/qtp-desc.webp"
        data-src-en="https://paulkpark.github.io/5do-app/assets/nav/qtp-desc_E.webp"
        alt="Quantum Torus Pendant Navigation"
      >

      <!-- 🔹 7개 핫스팟 (한/영 동일 링크) -->
      <a class="pendant-hotspot hot-1"
         href="https://5dshop.co.kr/?idx=482" target="_blank"></a>

      <a class="pendant-hotspot hot-2"
         href="https://5dshop.co.kr/?idx=467" target="_blank"></a>

      <a class="pendant-hotspot hot-3"
         href="https://5dshop.co.kr/?idx=463" target="_blank"></a>

      <a class="pendant-hotspot hot-4"
         href="https://5dshop.co.kr/?idx=464" target="_blank"></a>

      <a class="pendant-hotspot hot-5"
         href="https://5dshop.co.kr/?idx=481" target="_blank"></a>

      <a class="pendant-hotspot hot-6"
         href="https://5dshop.co.kr/?idx=465" target="_blank"></a>

      <a class="pendant-hotspot hot-7"
         href="https://5dshop.co.kr/?idx=477" target="_blank"></a>

    </div>

  </div>


  <!-- 🔹 언어 전환 스크립트 -->
  <script>
    (function(){
      const img  = document.getElementById('pendantImage');
      const tabs = document.querySelectorAll('.lang-tab');

      function setLang(lang){
        tabs.forEach(t => t.classList.toggle('active', t.dataset.lang === lang));

        const srcKo = img.getAttribute('data-src-ko');
        const srcEn = img.getAttribute('data-src-en');

        img.src = (lang === 'ko') ? srcKo : srcEn;
      }

      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          setLang(btn.dataset.lang);
        });
      });

      setLang('ko');  // 초기값 한글
    })();
  </script>

</body>
</html>
